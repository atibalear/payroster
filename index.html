  const max = Math.max(L2+20, Math.ceil((c.T+10)/10)*10);
  const seg = (lo,hi,color) => { const w = Math.max(0, Math.min(c.T,hi)-lo)/max*100; return w>0?`<div class="gseg" style="width:${w}%;background:${color}"></div>`:''; };
  const tierNow = c.T>L2?3:c.T>L1?2:1;
  const nextMsg = tierNow===1 ? t('tier1Msg',{h:hhmm(L1-c.T)}) : tierNow===2 ? t('tier2Msg',{h:hhmm(L2-c.T)}) : t('tier3Msg');
  const dc = c.dietaCounts;
  const dietLine = ['intlNight','intlDay','natNight','natDay'].filter(k=>dc[k]).map(k=>t('dc_'+k,{n:dc[k]})).join(' · ') || t('noAway');
  const P = c._slipNow, N = c._slipNext, ok = c._prevLoaded;
  const mNow = monthName(ro.year, ro.month), mPrev = monthName(ro.year, ro.month-1), mNext = monthName(ro.year, ro.month+1);
  const slips = state.slips||{};
  const realNow = slips[key(ro)], realNext = slips[c._nextKey], pk = prevKey(ro.year, ro.month);
  const cmp = (calc, real) => { if(!real || real.net==null) return ''; const d = PR.r2(calc - real.net);
    return `<dt>${t('realSlip')}</dt><dd>${eur.format(real.net)}</dd><dt>${t('difference')}</dt><dd style="color:${Math.abs(d)<5?'var(--pay)':'var(--warn)'}">${d>0?'+':''}${eur.format(d)}</dd>`; };
  $('hero').innerHTML = `
  <div class="panel">
    <div class="eyebrow">${t('nextPayHead',{m:mNext})}</div>
    <div class="big num" style="color:var(--pay)">${eur.format(N.net)}</div>
    <div class="sub">${t('nextPaySub',{m:mNext,p:mNow})}</div>
    <dl class="sumbox">
      <dt><span class="op"> </span>${t('fixedOf',{m:mNext})}</dt><dd>${eur.format(N.fixed)}</dd>
      <dt><span class="op">+</span>${t('variableOf',{p:mNow})}</dt><dd>${eur.format(N.variable)}</dd>
      <dt><span class="op">=</span>${t('grossTotal')}</dt><dd>${eur.format(N.gross)}</dd>
      <dt><span class="op">−</span>${t('deductions')}</dt><dd>${eur.format(N.ded)}</dd>
      <dt class="netrow"><span class="op">=</span>${t('youGet')}</dt><dd class="netrow">${eur.format(N.net)}</dd>
      ${cmp(N.net, realNext)}
    </dl>
    ${salesInput(key(ro), mNow)}
    ${oneOffInput(N.year, N.month)}
    ${N.month===12 && !state.settings.joined ? `<div class="askj"><span>${t('askJoined')}</span><label class="askjin">${t('f_joinedShort')}<input type="date" id="q-joined"></label><button class="btn" id="q-joined-save" type="button" style="align-self:flex-start">${t('saveDate')}</button></div>` : ''}
    <div class="eyebrow" style="margin-top:16px">${t('variableOf',{p:mNow})}</div>
    <dl class="kv">
      <dt>${t('dutyTime',{h:hhmm(c.T)})}</dt><dd>${eur.format(c.hourPay + c.topUp)}</dd>
      <dt>${t('perDiems')} · ${dietLine}</dt><dd>${eur.format(c.dietasPaid)}</dd>
      ${c.early?`<dt>${t('earlyOff')}</dt><dd>${eur.format(c.early)}</dd>`:''}
      ${c.trainDays+c.ctDays>0?`<dt>${t('trainDaysLine',{n:c.trainDays,c:c.ctDays})}</dt><dd>${eur.format(c.trainPay)}</dd>`:''}
      ${c.extraFix?`<dt>${t('daysBought')}</dt><dd>${eur.format(c.extraFix)}</dd>`:''}
      ${c.sales?`<dt>${t('sales')} ${c.salesFromDays?'':t('estimated')}</dt><dd>${eur.format(c.sales)}</dd>`:''}
      ${c.topUp?`<dt>${t('minGuar')}</dt><dd>+${eur.format(c.topUp)}</dd>`:''}
    </dl>
    <div class="gauge" aria-label="${t('gaugeAria')}">
      <div class="gtrack">${seg(0,L1,'var(--accent)')}${seg(L1,L2,'var(--pay)')}${seg(L2,Infinity,'var(--warn)')}</div>
      <div class="gscale"><span style="left:0;transform:none">0</span><span style="left:${L1/max*100}%">${L1} h</span><span style="left:${L2/max*100}%">${L2} h</span></div>
      <div class="gnote">${nextMsg}</div>
      <div class="gnote mono">FDP ${hhmm(c.TF)} · ${t('addDuty')} ${hhmm(c.TA)} · Block ${hhmm(c.blockHours)} · ${Math.round(c.r*100)} % FDP</div>
    </div>
  </div>
  <div class="panel">
    <div class="eyebrow">${t('slipOf',{m:mNow})}</div>
    ${ok ? `
      <div class="netfig num">${eur.format(P.net)}</div>
      <div class="sub">${t('slipOfSub',{m:mNow,p:mPrev})}</div>
      <dl class="sumbox">
        <dt><span class="op"> </span>${t('fixedOf',{m:mNow})}</dt><dd>${eur.format(P.fixed)}</dd>
        <dt><span class="op">+</span>${t('variableOf',{p:mPrev})}</dt><dd>${eur.format(P.variable)}</dd>
        <dt><span class="op">=</span>${t('grossTotal')}</dt><dd>${eur.format(P.gross)}</dd>
        <dt><span class="op">−</span>${t('deductions')}</dt><dd>${eur.format(P.ded)}</dd>
        <dt class="netrow"><span class="op">=</span>${t('youGet')}</dt><dd class="netrow">${eur.format(P.net)}</dd>
        ${cmp(P.net, realNow)}
      </dl>
      ${salesInput(pk, mPrev)}
      ${oneOffInput(ro.year, ro.month)}`
    : realNow && realNow.net!=null ? `
      <div class="netfig num">${eur.format(realNow.net)}</div>
      <div class="sub">${t('realOnly',{p:mPrev})}</div>`
    : `
      <div class="netfig num" style="color:var(--muted)">—</div>
      <div class="sub">${t('needPrev2',{m:mNow,p:mPrev})}</div>`}
  </div>`;
}

function renderStrip(c, ro, stripId, legendId){
  const dows = [...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleDateString(LOC,{weekday:'narrow'}));
  const first = (new Date(ro.year, ro.month-1, 1).getDay()+6)%7;
  const today = todayISO();
  let h = dows.map(d=>`<div class="dow">${d}</div>`).join('') + '<div class="cell blank"></div>'.repeat(first);
  for(const d of c.days){
    const k = kind(d.kind);
    const code = d.kind==='flight' ? (d.legs.filter(l=>l.type==='flt').map(l=>l.arr).filter(a=>a!==d.startLoc).filter((v,i,a)=>a.indexOf(v)===i).slice(0,2).join(' ')||'FLT')
              : d.kind==='deadhead' ? 'DH '+(d.legs[0]?d.legs[d.legs.length-1].arr:'')
              : (d.label||'').replace(/^DT_/,'').replace(/^STBY_/,'SB ').replace('RESERVE72','RES');
    h += `<button class="cell${d.date===today?' today':''}" style="--kc:var(${k.c})" data-go="${d.date}" aria-label="${d.day}: ${esc(k.n)} ${d.total?eur.format(d.total):''}">
      <span class="d">${d.day}</span><span class="c">${esc(code)}</span>${d.total>0.005?`<span class="e">${eur0.format(d.total)}</span>`:''}</button>`;
  }
  $(stripId||'strip').innerHTML = h;
  const used = [...new Set(c.days.map(d=>d.kind))].filter(k=>k!=='empty');
  $(legendId||'legend').innerHTML = used.map(k=>`<span><i style="background:var(${kind(k).c})"></i>${kind(k).n}</span>`).join('');
}

function renderDays(c, ro){
  const today = todayISO();
  const open = new Set([...document.querySelectorAll('.day[open]')].map(e=>e.dataset.date));
  $('days').innerHTML = c.days.map((d,di)=>{
    const k = kind(d.kind);
    const wd = new Date(d.date+'T12:00').toLocaleDateString(LOC,{weekday:'short'}).replace('.','');
    const main = d.route ? d.route : (d.label || k.n);
    const times = d.ci ? `${t4(d.ci)}${d.co?'–'+t4(d.co):''}` : '';
    const tier = d.H>0 ? t('tierN',{n:d.tierEnd>c.rates.limits[1]?3:d.tierEnd>c.rates.limits[0]?2:1}) : '';
    const legs = d.legs.length ? `<div class="legs">${d.legs.map(l=>`<span class="${l.type==='dh'?'dhl':''}">${l.type==='dh'?'DH ':''}${esc(l.flight)}</span><span>${l.dep}</span><span>${t4(l.t1)}</span><span>${t4(l.t2)}</span><span>${l.arr}</span>`).join('')}</div>` : '';
    const ex = state.extras[d.date]||{};
    const offish = d.kind==='off' || d.kind==='flight' || d.kind==='deadhead';
    return `<details class="day${d.date===today?' isToday':''}" id="d-${d.date}" data-date="${d.date}"${open.has(d.date)?' open':''}>
      <summary>
        <div class="dd"><span class="wd">${wd}</span><span class="n">${d.day}</span></div>
        <div class="what"><div class="r">${esc(main)}</div>
          <div class="m"><span class="tag" style="--kc:var(${k.c})"><i></i>${k.n}</span>${times?`<span class="mono">${times}</span>`:''}${d.hotel?`<span>${t('nightIn',{st:d.hotel})}</span>`:''}</div></div>
        <div class="amt"><div class="v${d.total>0.005?'':' zero'}">${d.total>0.005?eur.format(d.total):'0 €'}</div>${d.H?`<div class="h">${hhmm(d.H)} h</div>`:''}</div>
      </summary>
      <div class="detail">
        ${legs}
        ${d.legs.length ? `<button class="btn ghost mapbtn" type="button" data-mapday="${d.date}">🗺 ${t('map_btn')}</button>` : ''}${fdpHtml(d, c.days[di+1])}${d.ci && (d.events||[]).some(e=>e.type==='ci') ? restHtml(d) : ''}
        ${crewHtml(d, state.months[state.current] && state.months[state.current].crew)}
        <dl class="brk">
          ${d.H?`<dt>${t('payHours',{f:hhmm(d.F),a:hhmm(d.A)})}${d.absence?t('absenceCredit'):''} · ${tier} · ${n2.format(d.hourRate)} €/h</dt><dd>${eur.format(d.hourPay)}</dd>`:''}
          ${d.dieta?`<dt>${t('d_'+d.dietaType)}</dt><dd>${eur.format(d.dieta)}</dd>`:''}
          ${d.early?`<dt>${t('earlyAt',{t:t4(d.ci)})}</dt><dd>${eur.format(d.early)}</dd>`:''}
          ${d.isTrain?`<dt>${t('trainDay',{n:d.trainNo})}${d.trainNo===1?t('inPlus'):''}</dt><dd>${eur.format(d.trainPay)}</dd>`:''}
          ${d.isCTday?`<dt>${t('ctDay',{n:d.ctNo})}${d.ctNo===1?t('inPlus'):''}</dt><dd>${eur.format(d.trainPay)}</dd>`:''}
          ${d.extraFix?`<dt>${t('buyDefer')}${d.autoBuy && !d.buyManual && d.buyWhy ? ' · '+buyWhyText(d) : ''}</dt><dd>${eur.format(d.extraFix)}</dd>`:''}
          ${d.sales?`<dt>${t('sales')}</dt><dd>${eur.format(d.sales)}</dd>`:''}
          <dt class="t">${t('dayTotal')}</dt><dd class="t">${eur.format(d.total)}</dd>
        </dl>
        <div class="extras" data-date="${d.date}">
          ${d.kind==='flight'?`<label>${t('salesEur')} <input type="number" step="0.01" min="0" id="s-${d.date}" data-f="sales" value="${ex.sales||''}" placeholder="0,00"></label>`:''}
          ${offish?`<label>${t('dayBought')} <select id="b-${d.date}" data-f="buy"><option value="">${t('buyAuto',{v: d.autoBuy==='full'?t('full'):d.autoBuy==='half'?t('half'):t('no')})}${d.buyWhy?' · '+buyWhyText(d):''}</option><option value="none"${ex.buy==='none'?' selected':''}>${t('no')}</option><option value="full"${ex.buy==='full'?' selected':''}>${t('full')}</option><option value="half"${ex.buy==='half'?' selected':''}>${t('half')}</option></select></label>`:''}
          ${d.codes.includes('O_M')?`<label><input type="checkbox" id="o-${d.date}" data-f="omDefer"${ex.omDefer?' checked':''}> ${t('omDeferred')}</label>`:''}
          ${(!offish && d.kind!=='flight')?`<span class="note">${t('noExtras')}</span>`:''}
          <button class="btn ghost" type="button" data-sim="${d.date}" style="margin-left:auto">${t('sim_btn')}</button>
        </div>
      </div>
    </details>`;
  }).join('');
}

const hm2 = h => { if(h==null) return ''; h=((h%24)+24)%24; return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0'); };
function buyWhyText(d){
  const w = d.buyWhy;
  if(d.autoBuy==='half') return w.start!=null && w.start>=16 ? t('buyHalfLate',{h:hm2(w.start)}) : t('buyHalfEarly',{h:hm2(w.end)});
  return t('buyFullWhy',{h:hm2(w.start)});
}
function renderSlip(c, ro){
  const s = state.settings, P = c._slipNext, v = P.v, R = c.rates;
  const mNow = monthName(ro.year, ro.month+1), mPrev = monthName(ro.year, ro.month);
  $('slipH').textContent = t('slipOf',{m:mNow});
  const rows = [];
  const add = (name, info, val, cls='') => rows.push(`<tr class="${cls}"><td>${name}</td><td>${info||''}</td><td>${val}</td></tr>`);
  const sec = (label, val) => rows.push(`<tr class="sec"><td>${label}</td><td></td><td>${val}</td></tr>`);
  sec(t('fixedOf',{m:mNow}), eur.format(P.fixed));
  add(t('slip_base',{r:rankName(s.rank),l:P.level}), s.contract!==100?s.contract+' %':'', eur.format(P.baseSalary));
  if(P.allowBase) add(t('slip_trainer'), '', eur.format(P.allowBase));
  if(P.uniform) add(t('slip_uniform'),'',eur.format(P.uniform));
  if(P.oneOff) add(t('slip_oneOff'),'',eur.format(P.oneOff));
  if(P.fiscalAid) add(t('slip_fiscalAid'),'',eur.format(P.fiscalAid));
  sec(t('variableOf',{p:mPrev}), eur.format(P.variable));
  const tn = ['<70','70–110','>110'];
  (v.tiers||[]).forEach(tr=>{ if(tr.h<=0) return;
    add(t('slip_fdp',{t:tn[tr.i]}), `${n2.format(tr.hF)} h × ${n2.format(tr.rateF)}`, eur.format(tr.payF));
    add(t('slip_add',{t:tn[tr.i]}), `${n2.format(tr.hA)} h × ${n2.format(tr.rateA)}`, eur.format(tr.payA)); });
  if(v.topUp) add(t('slip_min'),'',eur.format(v.topUp));
  if(v.trainPay) add(t('slip_trainer'), t('slip_trainerInfo',{n:v.trainDays,c:v.ctDays}), eur.format(v.trainPay));
  if(v.early) add('Early check-in', `${v.early/s.earlyCheckin} × ${s.earlyCheckin} €`, eur.format(v.early));
  if(v.extraFix) add(t('slip_buy'),'',eur.format(v.extraFix));
  if(v.sales) add(t('slip_sales'), v.salesFromDays?'':t('estimatedW'), eur.format(v.sales));
  const dc=v.dietaCounts||{};
  if(dc.intlNight) add(t('slip_intlNight'), `${dc.intlNight} × ${n2.format(PR.DIETA.intlNight)}`, eur.format(dc.intlNight*PR.DIETA.intlNight));
  if(dc.intlDay) add(t('slip_intlDay'), `${dc.intlDay} × ${n2.format(PR.DIETA.intlDay)}`, eur.format(dc.intlDay*PR.DIETA.intlDay));
  if(dc.natNight) add(t('slip_natNight'), `${dc.natNight} × ${n2.format(PR.DIETA.natNight)}`, eur.format(dc.natNight*PR.DIETA.natNight));
  if(dc.natDay) add(t('slip_natDay'), `${dc.natDay} × ${n2.format(PR.DIETA.natDay)}`, eur.format(dc.natDay*PR.DIETA.natDay));
  if(v.dietasPaid>v.dietas) add(t('slip_minDiet'),'',eur.format(v.dietasPaid-v.dietas));
  add(t('grossTotal'),'',eur.format(P.gross),'gross');
  add(t('slip_taxable'),'',eur.format(P.taxable),'info');
  add(t('slip_ss'), n2.format(s.ss)+' %', '−'+eur.format(P.ss), 'ded');
  add(t('slip_irpf'), n2.format(s.irpf)+' %', '−'+eur.format(P.irpf), 'ded');
  if(P.ingresoCta) add(t('slip_ingCta'), `${n2.format(P.fiscalAid)} × ${n2.format(s.irpf)} %`, '−'+eur.format(P.ingresoCta), 'ded');
  rows.push(`<tr class="sum"><td>${t('slip_net')}</td><td></td><td>${eur.format(P.net)}</td></tr>`);
  const real = (state.slips||{})[c._nextKey];
  if(real && real.net!=null){ const d=PR.r2(P.net-real.net);
    rows.push(`<tr><td>${t('realSlip')}</td><td></td><td>${eur.format(real.net)}</td></tr><tr><td>${t('difference')}</td><td></td><td style="color:${Math.abs(d)<5?'var(--pay)':'var(--warn)'}">${d>0?'+':''}${eur.format(d)}</td></tr>`); }
  $('slip').innerHTML = rows.join('');
  $('slipNote').innerHTML = t('slipNote2',{m:mNow,p:mPrev,f:R.fdp.map(x=>n2.format(x)).join(' / '),a:R.add.map(x=>n2.format(x)).join(' / ')});
}

function applyPayslip(p){
  const s = state.settings;
  if(!p.rank || p.level==null) return {html:t('e_noCat'), err:true};
  const pk = p.period ? p.period.year+'-'+String(p.period.month).padStart(2,'0') : '';
  const mes = p.period ? monthName(p.period.year,p.period.month,{month:'long',year:'numeric'}) : '';
  state.slips = state.slips||{};
  // an older payslip is only stored for the history; the contract data comes from the newest one
  const newest = Object.keys(state.slips).sort().pop();
  const older = s.configured && pk && newest && pk < newest;
  if(pk && p.net!=null){ state.slips[pk] = { net: p.net, lines: p.lines, totals: p.totals }; salesFromSlips(state); }
  if(older){ save(); render(); return {html: t('ps_saved',{m:mes})}; }
  s.rank = p.rank; s.level = p.level; s.contract = p.contract || 100;
  if(p.since){ s.levelMode='date'; s.since=p.since; } else s.levelMode='manual';
  // concept 1046 «Formación de cabina»: 270 € or more = trainer, 80–269 € = competence team only
  s.isTrainer = p.trainerPlus >= (+s.tBase||270); s.isCT = !s.isTrainer && p.trainerPlus > 0;
  if(p.uniform) s.uniform = p.uniform;
  if(p.irpf!=null) s.irpf = p.irpf;
  if(p.joined) s.joined = p.joined;
  if(p.ss) s.ss = PR.r2(p.ss);
  s.configured = true; $('form').dataset.ready=''; save(); render();
  const expected = (PR.BASE[p.rank][p.level]||0) * s.contract/100;
  let html = t('ps_read',{m: mes?t('ps_of',{m:mes}):'', r: rankName(p.rank), l: p.level, c: s.contract!==100?t('ps_at',{c:s.contract}):'', irpf: n2.format(s.irpf),
    t: s.isTrainer?t('ps_trainer'):(s.isCT?t('ps_ct'):''), n: p.nextIncrease?t('ps_next',{d:new Date(p.nextIncrease+'T12:00').toLocaleDateString(LOC)}):''});
  const bad = p.basePay && Math.abs(p.basePay-expected)>1;
  if(bad) html += ' <br>'+t('ps_mismatch',{a:eur.format(p.basePay),b:eur.format(expected)});
  if(pk && p.net!=null) html += ' '+t('ps_saved',{m:mes});
  if(!Object.keys(state.months).length) html += ' '+t('ps_nowRoster');
  return {html, err:bad};
}
function saveSetup(){

const PDFJS = './lib/';
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error(t('e_pdfLib'))); document.head.appendChild(s); }); }
// ---- OCR for payslips that are a picture (screenshot / photo in a PDF, or a PNG/JPG) ----
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/';
let ocrWorker = null;
async function ocrCanvas(canvas){
  if(!window.Tesseract) await loadScript(TESS+'tesseract.min.js');
  if(!ocrWorker) ocrWorker = await Tesseract.createWorker('spa', 1, { workerPath: TESS+'worker.min.js' });
  const r = await ocrWorker.recognize(canvas, {}, {blocks:true});
  const words = [];
  for(const b of r.data.blocks||[]) for(const p of b.paragraphs) for(const l of p.lines) for(const w of l.words)
    words.push({t:w.text, x0:w.bbox.x0, y0:w.bbox.y0, x1:w.bbox.x1, y1:w.bbox.y1});
  return words;
}
const OCR_W = 2250;   // the payslip screenshots read best at about twice their size
async function pdfPageCanvas(file){
  await loadPdfLib();
  const doc = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pg = await doc.getPage(1), vp0 = pg.getViewport({scale:1}), vp = pg.getViewport({scale: OCR_W/vp0.width});
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext: ctx, viewport: vp}).promise;
  return c;
}
async function imageCanvas(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k = OCR_W / img.naturalWidth, c = document.createElement('canvas');
    c.width = OCR_W; c.height = Math.round(img.naturalHeight*k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
async function ocrPayslip(file, isImage){
  showMsg(t('ocr_reading',{f:esc(file.name)}));
  const canvas = isImage ? await imageCanvas(file) : await pdfPageCanvas(file);
  return PR.parsePayslipOcr(await ocrCanvas(canvas), canvas.width);
}
async function loadPdfLib(){
  if(!window.pdfjsLib){ await loadScript(PDFJS+'pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS+'pdf.worker.min.js'; }
}
async function readPdf(file){
  if(!window.pdfjsLib){ await loadScript(PDFJS+'pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS+'pdf.worker.min.js'; }
  const doc = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p); const tc=await pg.getTextContent(); const vp=pg.getViewport({scale:1});
    pages.push({items: tc.items.filter(i=>i.str&&i.str.trim()).map(it=>{ const m=pdfjsLib.Util.transform(vp.transform,it.transform); return {x:m[4],y:m[5],str:it.str}; })});
  }
  return pages;
}
function showMsg(html, err){ const m=$('importMsg'); m.hidden=false; m.className='msg'+(err?' err':''); m.innerHTML=html; }
async function fromOcr(f, isImage){
  let slip = null;
  try{ slip = await ocrPayslip(f, isImage); }catch(e){ console.warn('ocr', e); return {html: t('e_image',{f:esc(f.name)}), err:true}; }
  if(!slip || !slip.period || slip.net==null) return {html: t('e_image',{f:esc(f.name)}), err:true};
  const r = applyPayslip(slip);
  const mes = monthName(slip.period.year, slip.period.month, {month:'long',year:'numeric'});
  return {slip:true, period: slip.period, err: r.err || !slip.ocrOk,
    html: (slip.ocrOk ? t('ocr_ok',{f:esc(f.name),m:mes}) : t('ocr_check',{f:esc(f.name),m:mes})) + ' ' + r.html};
}
async function importPdf(f){
  try{
    if(/^image\//.test(f.type) || /\.(png|jpe?g|heic|webp)$/i.test(f.name)) return await fromOcr(f, true);
    const pages = await readPdf(f);
    const slip = PR.parsePayslip(pages[0] ? pages[0].items : []);
    if(slip) return Object.assign({slip:true, period: slip.period}, applyPayslip(slip));
    if(!pages.some(p=>p.items.length)) return await fromOcr(f, false);
    const list = PR.parseRosterAll(pages);
    const raw = pages.map(p => p.items.map(i => [Math.round(i.x*10)/10, Math.round(i.y*10)/10, i.str]));
    state.raws = state.raws || {};
    const before = {}; for(const r of list){ const k = key(r); if(state.months[k] && !state.example) before[k] = state.months[k]; }
    const keys = storeRosters(state, list, raw);
    state.changes = state.changes || {};
    const chg = [];
    for(const r of list){ const k = key(r); if(!before[k]) continue;
      let d = null; try{ d = rosterDiff(before[k], state.months[k]); }catch(e){ console.warn(e); }
      if(d){ state.changes[k] = d; chg.push(t('chg_import',{m:monthName(r.year,r.month,{month:'long',year:'numeric'}), n:d.items.length, v:(d.dNet>0?'+':'')+eur.format(d.dNet)})); } else delete state.changes[k]; }
    pruneRaws(state);
    state.current = keys[keys.length-1]; save(); render();
    const ro = list[list.length-1];
    if(list.length > 1){
      const flights = list.reduce((a,r)=>a+r.days.filter(d=>d.events.some(x=>x.type==='flt')).length, 0);
      return {html: t('importedMany',{n:list.length, a:monthName(list[0].year,list[0].month,{month:'long',year:'numeric'}), b:monthName(ro.year,ro.month,{month:'long',year:'numeric'}), f:flights}) + (chg.length ? '<br>' + chg.join('<br>') : '')};
    }
    const flights = ro.days.filter(d=>d.events.some(x=>x.type==='flt')).length;
    if(chg.length) return {html: t('imported',{m:monthName(ro.year,ro.month,{month:'long',year:'numeric'}),d:ro.days.length,f:flights}) + ' ' + chg.join(' ')};
    return {html: t('imported',{m:monthName(ro.year,ro.month,{month:'long',year:'numeric'}),d:ro.days.length,f:flights})};
  }catch(err){ const m=String(err.message||err); return {html: esc(f.name)+': '+(/^No encuentro el periodo/.test(m)?t('e_noPeriod'):esc(m)), err:true}; }
}

// ---- max FDP (EASA ORO.FTL.205) and commander's discretion ----
const hm2s = h => { const m = Math.round(((h%24)+24)%24*60); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
function fdpHtml(d, next){
  const ev = d.events||[], ciI = ev.map(e=>e.type).lastIndexOf('ci'), ci = ev[ciI];
  if(!ci || !ci.t1) return '';
  const after = ev.slice(ciI+1);                       // only this duty: legs after its check-in
  let legs = after.filter(e=>e.type==='flt'||e.type==='dh');
  // a duty that lands after midnight continues on the next day without a new check-in
  const closed = after.some(e=>e.type==='co');
  if(next && !closed){
    const nl = []; for(const e of (next.events||[])){ if(e.type==='ci' || e.type==='co') break; if(e.type==='flt'||e.type==='dh') nl.push(e); }
    legs = legs.concat(nl.map(e=>Object.assign({}, e, {_next:true})));
  }
  const sectors = legs.filter(e=>e.type==='flt').length;
  if(!sectors) return '';
  const toMin = x => Math.floor(+x/100)*60 + (+x%100);
  const st = ci.st || (legs[0] && legs[0].dep) || '';
  const startL = PR.localHour(d.date, ci.t1, st);
  const max = PR.maxFdp(startL, sectors), disc = max + 2;
  // scheduled FDP: check-in to the last on-block
  const last = legs[legs.length-1];
  let fdpMin = toMin(last.t2) - toMin(ci.t1) + (last._next ? 1440 : 0);
  if(!last._next && toMin(last.t2) < toMin(ci.t1)) fdpMin += 1440;
  const fdp = fdpMin/60;
  const cls = fdp > disc ? 'over' : fdp > max ? 'over' : '';
  const utcEnd = (toMin(ci.t1) + Math.round(disc*60)) % 1440;
  return `<div class="fdpl">
    <div>${t('fdp_lim',{m:hhmm(max),s:sectors,t:hm2s(startL),st:esc(st)})}</div>
    <div>${t('fdp_disc',{m:hhmm(disc),e:hm2s(startL+disc),u:hm2s(utcEnd/60)})}</div>
    <div class="${cls}">${t('fdp_now',{f:hhmm(fdp)})}${fdp>max?' · '+(fdp>disc?t('fdp_overDisc'):t('fdp_needDisc')):''}</div>
  </div>`;
}

async function encodeShare2(ro, c, o){

  const lines = days.map(d => {

    if(o.crew !== 'none'){
      if(d.crewInherited) crew = '^';
      else crew = (d.crew||[]).map(l => { const li = d.legs.findIndex(x => x.flight===l.flight && x.dep===l.dep); return (li>=0 ? li : [clean(l.flight).replace(/^EW /,''), l.dep, l.arr].join('/')) + ':' +
        l.members.map(m => m.role + (m.name.trim()===me ? '@' : ni(o.crew==='short' ? shortName(m.name) : clean(m.name)))).join('.'); }).join(';');
    }
    return [KC2[d.kind]||'X', clean(d.label), d.ci||'', d.co||'', d.hotel||'', legs, crew].join('~').replace(/~+$/,'');
  });
  const head = ['3', ro.year, ro.month, o.name ? clean(me) : '', todayISO(), o.from, o.to, ro.base||state.settings.base||''].join('|');
  const txt = head + '\n' + lines.join('\n') + (names.length ? '\n#\n' + names.join('\n') : '');
  const raw = new TextEncoder().encode(txt);
  return '2'+b64u(fflate.deflateSync(raw, {level:9, mem:12}));   // strongest deflate: shortest link
}
function parseShare2(txt){
  const [body, tbl] = txt.split('\n#\n');
  const names = tbl ? tbl.split('\n') : [];
  const rows = body.split('\n'), h = rows.shift().split('|');
  const p = { v:2, y:+h[1], m:+h[2], n:h[3], at:h[4], from:h[5], to:h[6] };
  const compact = h[0]==='3', base = h[7]||'', d0 = +String(p.from).slice(8,10)||1;
  let loc = base;
  const fl = x => /^\d/.test(x) ? 'EW '+x : x;
  let last = [];
  p.days = rows.map(r => {
    const f = r.split('~'), idx = rows.indexOf(r);
    const [day, k, label, ci, co, hotel, startLoc, legs, crew] = compact ? [d0+idx, f[0], f[1], f[2], f[3], f[4], loc, f[5], f[6]] : f;
    const lg = legs ? legs.split(',').map(s => { const dh = s[0]==='*'; const b = dh?s.slice(1):s;
      if(compact){ const m = /^(.*?)([A-Z]{3})(\d{4})(\d{4})([A-Z]{3})$/.exec(b) || []; return {type:dh?'dh':'flt', flight:fl(m[1]||''), dep:m[2], t1:m[3], t2:m[4], arr:m[5]}; }
      const [ff,dep,t1,t2,arr] = b.split('/'); return {type:dh?'dh':'flt', flight:fl(ff), dep, t1, t2, arr}; }) : [];
    if(compact) loc = hotel || (lg.length ? lg[lg.length-1].arr : loc);
    let cr = [];
    if(crew === '^') cr = last;
    else if(crew){ cr = crew.split(';').map(s => { const [hd, mem] = s.split(':'); let ff, dep, arr;
      if(/^\d+$/.test(hd) && lg[+hd]){ ff = lg[+hd].flight; dep = lg[+hd].dep; arr = lg[+hd].arr; } else { const q = hd.split('/'); ff = fl(q[0]); dep = q[1]; arr = q[2]; }
      return { flight:ff, dep, arr, members:(mem||'').split('.').filter(Boolean).map(x => { const mm = /^([A-Za-z]+)(@|[0-9a-z]+)$/.exec(x) || []; return { role:mm[1]||'', name: mm[2]==='@' ? (p.n || '★') : (names[parseInt(mm[2],36)]||'') }; }) }; }); last = cr; }
    else last = [];
    const date = `${p.y}-${String(p.m).padStart(2,'0')}-${String(+day).padStart(2,'0')}`;
    return { day:+day, date, kind:KC2R[k]||'other', label, ci, co, hotel, startLoc, legs:lg, crew:cr, crewInherited:crew==='^', gcrew:[], total:0,
      route: lg.length ? [lg[0].dep, ...lg.map(l=>l.arr)].join('–') : '' };
  });
  return p;
}
async function encodeShare(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){ try{ return 'z'+b64u(await pipe(raw, CompressionStream, 'deflate-raw')); }catch(e){} }
  return 'j'+b64u(raw);
}
async function decodeShare(str){
  if(str[0]==='2' || str[0]==='3'){ const b = unb64u(str.slice(1)); const raw = str[0]==='2' ? fflate.inflateSync(b) : b; return parseShare2(new TextDecoder().decode(raw)); }
  const kind = str[0], bytes = unb64u(str.slice(1));
  const raw = kind==='z' ? await pipe(bytes, DecompressionStream, 'deflate-raw') : bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}
function sharePayload(ro, c, o){
  const days = c.days.filter(d => d.date >= o.from && d.date <= o.to);
  return { v:1, y:ro.year, m:ro.month, n: o.name ? (ro.crew||'') : '', at: todayISO(), from:o.from, to:o.to,
    d: days.map(d => [d.day, d.kind, d.label||'', d.ci||'', d.co||'', d.hotel||'', d.startLoc||'',
      d.legs.map(l=>[l.flight, l.dep, l.t1, l.t2, l.arr, l.type==='dh'?1:0]),
      o.crew && !d.crewInherited ? (d.crew||[]).map(l=>[l.flight, l.dep, l.arr, l.members.map(m=>m.role+'|'+m.name)]) : 0,
      o.crew && d.crewInherited ? 1 : 0 ]) };
}
function unpackDays(p){
  let last = [];
  return p.d.map(a => {
    const [day, kindK, label, ci, co, hotel, startLoc, legs, crew, inh] = a;
    const lg = legs.map(x=>({type:x[5]?'dh':'flt', flight:x[0], dep:x[1], t1:x[2], t2:x[3], arr:x[4]}));
    let cr = crew ? crew.map(x=>({flight:x[0], dep:x[1], arr:x[2], members:x[3].map(s=>{const i=s.indexOf('|'); return {role:s.slice(0,i), name:s.slice(i+1)};})})) : [];
    if(cr.length) last = cr; else if(inh) cr = last;
    const date = `${p.y}-${String(p.m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    return { day, date, kind:kindK, label, ci, co, hotel, startLoc, legs:lg, crew:cr, crewInherited:!!inh, gcrew:[], total:0,
      route: lg.length ? [lg[0].dep, ...lg.map(l=>l.arr)].join('–') : '' };
  });
}
let shareOpts = null;
function renderSharePanel(){
  const ro = state.months[state.current]; if(!ro) return;
  const last = `${ro.year}-${String(ro.month).padStart(2,'0')}-${String(ro.days.length).padStart(2,'0')}`;
  const first = `${ro.year}-${String(ro.month).padStart(2,'0')}-01`;
  if(!shareOpts || shareOpts.key!==state.current) shareOpts = { key:state.current, name:false, crew:'short', from:first, to:last };
  const o = shareOpts;
  $('sharePanel').innerHTML = `<div class="h2row"><h2 style="margin:0">${t('share_title',{m:monthName(ro.year,ro.month,{month:'long',year:'numeric'})})}</h2><button class="btn ghost" id="shareClose" type="button">${t('share_close')}</button></div>
    <p class="note">${t('share_note')}</p>
    <div class="opts">
      <label><input type="checkbox" id="sh-name"${o.name?' checked':''}> ${t('share_name')}</label>
      <label>${t('crewT')} <select id="sh-crew"><option value="short"${o.crew==='short'?' selected':''}>${t('share_crewShort')}</option><option value="full"${o.crew==='full'?' selected':''}>${t('share_crewFull')}</option><option value="none"${o.crew==='none'?' selected':''}>${t('share_crewNone')}</option></select></label>
      <label>${t('share_from')} <input type="date" id="sh-from" min="${first}" max="${last}" value="${o.from}"></label>
      <label>${t('share_to')} <input type="date" id="sh-to" min="${first}" max="${last}" value="${o.to}"></label>
    </div>
    <div><button class="btn" id="sh-make" type="button">${t('share_make')}</button></div>
    <div id="sh-out"></div>`;
}
async function makeShare(){
  const ro = state.months[state.current]; const o = shareOpts;
  o.name = $('sh-name').checked; o.crew = $('sh-crew').value; o.from = $('sh-from').value || o.from; o.to = $('sh-to').value || o.to;
  if(o.to < o.from) [o.from, o.to] = [o.to, o.from];
  const c = PR.compute(ro, state.settings, state.extras);
  const url = SHARE_BASE + '#s=' + await encodeShare2(ro, c, o);
  let qrSvg = '';
  try{ const q = qrcode(0, 'L'); q.addData(url); q.make(); qrSvg = q.createSvgTag({cellSize:4, margin:2, scalable:true}); }catch(e){ qrSvg = ''; }
  $('sh-out').innerHTML = `<div class="qrbox">${qrSvg?`<div class="qr">${qrSvg}</div>`:`<p class="msg err" style="margin:0">${t('share_toolong')}</p>`}
    <div class="linkcol"><textarea id="sh-url" readonly>${esc(url)}</textarea>
      <div class="row"><button class="btn" id="sh-copy" type="button">${t('share_copy')}</button>${navigator.share?`<button class="btn ghost" id="sh-send" type="button">${t('share_send')}</button>`:''}<span id="sh-msg" class="note"></span></div><span class="note">${t('share_len',{n:url.length})}</span></div></div>`;
}

// ---- viewer (someone opened a shared link) ----
let viewerData = null, viewerStr = '';
async function openViewer(str){
  viewerStr = str;
  try{ viewerData = await decodeShare(str); }catch(e){ viewerData = null; }
  document.body.classList.add('viewer');
  const v = $('viewer'); v.hidden = false;
  if(!viewerData){ v.innerHTML = `<div class="panel"><p>${t('v_bad')}</p><button class="btn ghost" id="v-mine" type="button">${t('v_mine')}</button></div>`; return; }
  const p = viewerData, days = p.v===2 ? p.days : unpackDays(p);
  const saved = !!(state.shared||{})[viewerKey()];
  v.innerHTML = `<div class="panel">
      <div class="eyebrow">${t('v_title')}</div>
      <h2 style="margin:4px 0;text-transform:capitalize">${monthName(p.y,p.m,{month:'long',year:'numeric'})}${p.n?` · <span style="text-transform:none">${t('v_by',{n:esc(p.n)})}</span>`:''}</h2>
      <div class="note">${t('v_sharedOn',{d:esc(p.at)})}</div>
      <div class="row" style="margin-top:10px"><button class="btn" id="v-save" type="button"${saved?' disabled':''}>${saved?t('v_saved'):t('v_save')}</button><button class="btn ghost" id="v-mine" type="button">${t('v_mine')}</button></div>
    </div>
    <section style="margin-top:14px"><div class="strip" id="vstrip"></div><div class="legend" id="vlegend"></div></section>
    <div class="days" style="margin-top:14px">${days.filter(d=>d.kind!=='empty').map(d=>{
      const k = kind(d.kind), wd = new Date(d.date+'T12:00').toLocaleDateString(LOC,{weekday:'short'}).replace('.','');
      const times = d.ci ? `${t4(d.ci)}${d.co?'–'+t4(d.co):''}` : '';
      const legs = d.legs.length ? `<div class="legs">${d.legs.map(l=>`<span class="${l.type==='dh'?'dhl':''}">${l.type==='dh'?'DH ':''}${esc(l.flight)}</span><span>${l.dep}</span><span>${t4(l.t1)}</span><span>${t4(l.t2)}</span><span>${l.arr}</span>`).join('')}</div>` : '';
      const cr = crewHtml(d, p.n);
      return `<details class="day vday" id="v-${d.date}"><summary><div class="dd"><span class="wd">${wd}</span><span class="n">${d.day}</span></div>
        <div class="what"><div class="r">${esc(d.route || d.label || k.n)}</div><div class="m"><span class="tag" style="--kc:var(${k.c})"><i></i>${k.n}</span>${times?`<span class="mono">${times}</span>`:''}${d.hotel?`<span>${t('nightIn',{st:d.hotel})}</span>`:''}</div></div></summary>
        ${legs||cr?`<div class="detail" style="padding-left:12px">${legs}${cr}</div>`:''}</details>`; }).join('')}</div>`;
  renderStrip({days}, {year:p.y, month:p.m}, 'vstrip', 'vlegend');
}
function viewerKey(){ return viewerData ? `${viewerData.y}-${String(viewerData.m).padStart(2,'0')}·${viewerData.n||'-'}·${viewerData.at}` : ''; }
function closeViewer(){ document.body.classList.remove('viewer'); $('viewer').hidden = true; $('viewer').innerHTML=''; viewerData=null;
  try{ history.replaceState(null,'',location.pathname); }catch(e){ location.hash=''; } render(); }
function checkHash(){ const h = location.hash; if(h.startsWith('#s=')) openViewer(h.slice(3)); else if(document.body.classList.contains('viewer')) closeViewer(); }
addEventListener('hashchange', checkHash);

document.addEventListener('click', async e=>{
  const id = e.target.id;
  if(id==='shareBtn'){ const p=$('sharePanel'); if(p.hidden){ renderSharePanel(); p.hidden=false; p.scrollIntoView({block:'nearest'}); } else p.hidden=true; return; }
  if(id==='shareClose'){ $('sharePanel').hidden = true; return; }
  if(id==='sh-make'){ e.target.disabled = true; try{ await makeShare(); } finally { e.target.disabled = false; } return; }
  if(id==='sh-copy'){ const ta=$('sh-url'); try{ await navigator.clipboard.writeText(ta.value); $('sh-msg').textContent=t('share_copied'); }catch(err){ ta.focus(); ta.select(); } return; }
  if(id==='sh-send'){ try{ await navigator.share({title:'Payroster', url:$('sh-url').value}); }catch(err){} return; }
  if(id==='v-save'){ state.shared = state.shared||{}; state.shared[viewerKey()] = Object.assign({s:viewerStr}, {y:viewerData.y, m:viewerData.m, n:viewerData.n, at:viewerData.at}); save(); e.target.disabled=true; e.target.textContent=t('v_saved'); return; }
  if(id==='v-mine'){ closeViewer(); return; }
  const op = e.target.closest('[data-shopen]'); if(op){ const s=(state.shared||{})[op.dataset.shopen]; if(s) location.hash = '#s='+s.s; return; }
  const dl = e.target.closest('[data-shdel]'); if(dl){ delete state.shared[dl.dataset.shdel]; save(); renderSharedList(); return; }
});

render();
checkHash();
if(state.stale && state.stale.length) showMsg(t('staleMsg',{m:state.stale.map(k=>{const [y,m]=k.split('-');return monthName(+y,+m,{month:'long',year:'numeric'});}).join(', ')}), true);
// ---- updates (installed webapp) ----
async function latestVersion(){
  const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('http'); return (await r.json()).version;
}
async function checkUpdate(manual){
  if(!IS_PWA_BUILD) return;
  try{
    const v = await latestVersion();
    if(v && v !== APP_VERSION){
      const b=$('updBar'); b.hidden=false;
      b.innerHTML = `${t('upd_available')} <button class="btn" id="updNow" type="button" style="margin-left:6px">${t('upd_button')}</button>`;
    } else if(manual) $('updRes').textContent = t('upd_latest');
  }catch(e){ if(manual) $('updRes').textContent = t('upd_offline'); }
}
async function applyUpdate(){
  try{
    if('serviceWorker' in navigator){ const reg = await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }
    if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); }
  }catch(e){}
  location.replace(location.pathname + '?v=' + Date.now());
}
if(IS_PWA_BUILD){
  $('verRow').hidden=false; $('verTxt').textContent = t('version',{v:APP_VERSION});
  document.addEventListener('click', e=>{ if(e.target.id==='updNow') applyUpdate(); if(e.target.id==='updCheck'){ $('updRes').textContent='…'; checkUpdate(true); } });
  checkUpdate(false);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkUpdate(false); });
}
// open today's row on first view
(()=>{ const el=$('d-'+todayISO()); if(el) el.open=true; })();
</script>
