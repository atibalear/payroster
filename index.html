<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Payroster">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Payroster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: duty-plan ledger — month figure + tier gauge on top, a NetLine-style day strip, then one row per day that opens into its pay breakdown. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#e9ebf1; --ink:#161a2c; --muted:#5d6379; --line:#d8dbe5;
  --accent:#2c4fd6; --accent-soft:#e3e8fb; --pay:#0b7650; --pay-soft:#dcf1e7; --warn:#a85a00; --warn-soft:#fbecd6;
  --k-flight:#2c4fd6; --k-dh:#7d8bd6; --k-train:#c48a00; --k-sby:#8e4fb8; --k-off:#c9ccd7; --k-ground:#3a8a9a;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#171b2d; --sunk:#1f2438; --ink:#e8eaf3; --muted:#9aa0b8; --line:#2b3150;
  --accent:#8fa6ff; --accent-soft:#232c55; --pay:#5fd3a2; --pay-soft:#163a2c; --warn:#f0b35e; --warn-soft:#3b2a12;
  --k-flight:#7f99ff; --k-dh:#5e6aa8; --k-train:#d9a520; --k-sby:#b583d9; --k-off:#3a4060; --k-ground:#5bb3c4; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#171b2d; --sunk:#1f2438; --ink:#e8eaf3; --muted:#9aa0b8; --line:#2b3150;
  --accent:#8fa6ff; --accent-soft:#232c55; --pay:#5fd3a2; --pay-soft:#163a2c; --warn:#f0b35e; --warn-soft:#3b2a12;
  --k-flight:#7f99ff; --k-dh:#5e6aa8; --k-train:#d9a520; --k-sby:#b583d9; --k-off:#3a4060; --k-ground:#5bb3c4; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:.01em;margin-right:auto}
.brand span{color:var(--accent)}
.monthnav{display:flex;align-items:center;gap:2px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;height:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default}
.mlabel{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:17px;min-width:96px;text-align:center;text-transform:capitalize}

/* summary */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:800;font-stretch:78%;font-size:46px;line-height:1;margin:6px 0 4px;letter-spacing:-.01em}
.big small{font-size:22px;font-weight:600;color:var(--muted);margin-left:2px}
.sub{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700;color:var(--ink)}
.netfig{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:32px;color:var(--pay);line-height:1.05;margin-top:4px}

/* tier gauge */
.gauge{margin-top:14px}
.gtrack{position:relative;height:14px;border-radius:7px;background:var(--sunk);overflow:hidden;display:flex}
.gseg{height:100%}
.gscale{position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:3px}
.gscale span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono)}
.gnote{font-size:13px;color:var(--muted);margin-top:4px}
.gnote b{color:var(--ink)}

/* strip calendar */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.cell{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:58px;padding:4px 5px;cursor:pointer;display:flex;flex-direction:column;gap:1px;text-align:left;position:relative;overflow:hidden}
.cell::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--kc, transparent)}
.cell .d{font-family:var(--f-mono);font-size:12px;font-weight:600;margin-top:2px}
.cell .c{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono)}
.cell .e{font-size:11.5px;font-weight:600;color:var(--pay);margin-top:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* day list */
h2{font-family:var(--f-display);font-weight:750;font-stretch:85%;font-size:20px;margin:6px 0 0;text-wrap:balance}
.days{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.day{border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day>summary{list-style:none;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.day>summary::-webkit-details-marker{display:none}
.day[open]>summary{background:var(--sunk)}
.day.isToday>summary{box-shadow:inset 3px 0 0 var(--accent)}
.dd{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.dd .wd{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dd .n{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:24px}
.what{min-width:0}
.what .r{font-family:var(--f-mono);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.tag i{width:8px;height:8px;border-radius:2px;background:var(--kc)}
.amt{text-align:right;font-variant-numeric:tabular-nums}
.amt .v{font-family:var(--f-display);font-weight:750;font-stretch:85%;font-size:19px;color:var(--pay)}
.amt .v.zero{color:var(--muted);font-weight:500}
.amt .h{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.detail{padding:4px 12px 14px 76px;display:grid;gap:12px}
@media (max-width:520px){.detail{padding-left:12px}}
.legs{font-family:var(--f-mono);font-size:12.5px;display:grid;grid-template-columns:auto auto auto auto 1fr;gap:3px 12px;overflow-x:auto}
.legs .dhl{color:var(--muted)}
.brk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px}
.brk dt{color:var(--muted)} .brk dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.brk .t{font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:4px}
.extras{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;background:var(--sunk);border-radius:8px;padding:10px}
.extras label{display:flex;align-items:center;gap:6px}
.extras input[type=number]{width:84px}
input[type=number],input[type=text],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:14px}

/* payslip */
.slip{font-size:13.5px;border-collapse:collapse;width:100%}
.slip td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.slip td:nth-child(2),.slip td:nth-child(3){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.slip td:nth-child(2){color:var(--muted);font-family:var(--f-mono);font-size:12px}
.slip tr.sum td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.slip tr.ded td:nth-child(3){color:var(--warn)}
.slip tr.ex td:nth-child(3){color:var(--pay)}
.tablewrap{overflow-x:auto}

/* settings / import */
details.box>summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";color:var(--muted);font-family:var(--f-mono)}
details.box[open]>summary::after{content:"–"}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form label.chk{flex-direction:row;align-items:center;color:var(--ink);font-size:13.5px}
.form input,.form select{width:100%}
.form .wide{grid-column:1/-1}
.btn{border:0;border-radius:8px;background:var(--accent);color:var(--surface);padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.msg.err{background:var(--warn-soft);color:var(--warn)}
.note{font-size:12.5px;color:var(--muted);max-width:65ch}
.note b{color:var(--ink);font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">Pay<span>roster</span></div>
    <div class="monthnav">
      <button class="iconbtn" id="prevM" aria-label="" data-i18n-aria="prevMonth">‹</button>
      <div class="mlabel" id="mLabel">—</div>
      <button class="iconbtn" id="nextM" aria-label="" data-i18n-aria="nextMonth">›</button>
    </div>
    <label class="iconbtn" for="pdfIn" title="" data-i18n-title="importTitle">＋ PDF</label>
    <input type="file" id="pdfIn" accept="application/pdf,.pdf" class="sr">
  </header>

  <div id="updBar" class="msg" hidden></div>
  <div id="importMsg" hidden></div>
  <div id="rankWarn" hidden></div>
  <section class="panel" id="setup" hidden></section>

  <section class="hero" id="hero"></section>

  <section>
    <div class="strip" id="strip"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <h2 data-i18n="dayByDay"></h2>
    <p class="note" data-i18n="dayByDayNote"></p>
    <div class="days" id="days"></div>
  </section>

  <section class="panel">
    <h2 style="margin-top:0" data-i18n="slipTitle"></h2>
    <p class="note" id="slipNote"></p>
    <div class="tablewrap"><table class="slip" id="slip"></table></div>
  </section>

  <details class="box panel" id="setBox">
    <summary data-i18n="contractData"></summary>
    <div class="form" id="form"></div>
  </details>

  <details class="box panel">
    <summary data-i18n="storedMonths"></summary>
    <div id="stored" style="margin-top:12px;display:grid;gap:8px"></div>
    <p class="note" style="margin-top:12px" data-i18n="storedNote"></p>
  </details>

  <p class="note" data-i18n="footer"></p>
  <p class="note" data-i18n="footer2"></p>
  <div class="row note" id="verRow" hidden><span id="verTxt"></span><button class="btn ghost" id="updCheck" type="button" data-i18n="upd_check"></button><span id="updRes"></span></div>
</div>

<script>
// Payroster engine: roster parser + pay rules (Convenio TCP Eurowings Europe, bases España)
// Pure functions; no DOM. Used by the page and by node tests.
var PR = (function () {
  const MONTHS = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };
  const ES_AIRPORTS = new Set(('PMI IBZ MAH MAD BCN AGP ALC VLC SVQ BIO SCQ VGO OVD SDR LPA TFS TFN ACE FUE SPC GMZ VDE ' +
    'GRX XRY LEI REU GRO ZAZ VIT PNA LCG MJV RMU VLL SLM LEN BJZ EAS SDR HSK ODB RGS CDT MLN JCU').split(' '));

  // ---------- convenio tables ----------
  const BASE = {
    PU: [null, 2150, 2175, 2200, 2225, 2250, 2275, 2300, 2325, 2350, 2375, 2400, 2425, 2450, 2475, 2500],
    CA: [1260, 1740, 1781, 1822, 1863, 1904, 1945, 1986, 2027, 2068, 2109, 2150]
  };
  const PCT = { // % of monthly base per hour, art. 24.7.2
    PU: { fdp: [0.105, 0.2, 0.32], add: [0.053, 0.1, 0.16] },
    CA: { fdp: [0.065, 0.2, 0.33], add: [0.033, 0.1, 0.165] }
  };
  const TIER_LIMITS = { // art. 30.7.7.2, by contract %
    100: [70, 110], 95: [67, 105], 90: [63, 99], 85: [60, 94], 80: [56, 88], 75: [53, 83], 70: [49, 77], 65: [46, 72], 60: [42, 66], 55: [39, 61], 50: [35, 55]
  };
  const DIETA = { intlDay: 66.11, natDay: 36.06, intlNight: 91.35, natNight: 53.34 };
  const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;

  function defaultSettings() {
    return {
      rank: 'PU', level: 1, levelMode: 'date', since: '', contract: 100, base: 'PMI',
      isTrainer: false, isCT: false, uniform: 66.66, irpf: 15, ss: 6.5, configured: false,
      salesEstimate: 0, minDietas: false,
      absenceCodes: 'U, UL, URL, VAC, SICK, KRANK, PERM, PR',
      earlyCheckin: 30,
      trainingCodes: 'DT_TRNG', ctCodes: 'COMP',
      // Works Agreement Cabin Trainers (Eurowings Europe Spain), 1.1.1.2
      tBase: 270, tTwo: 340, tExtra: 105, ctBase: 80, ctExtra: 80
    };
  }

  function rates(s) {
    const base = BASE[s.rank][s.level] || 0;
    const p = PCT[s.rank];
    return {
      base,
      fdp: p.fdp.map(x => r2(base * x / 100)),
      add: p.add.map(x => r2(base * x / 100)),
      limits: TIER_LIMITS[s.contract] || interpLimits(s.contract)
    };
  }
  function interpLimits(c) {
    const keys = Object.keys(TIER_LIMITS).map(Number).sort((a, b) => a - b);
    let lo = keys[0], hi = keys[keys.length - 1];
    for (const k of keys) { if (k <= c) lo = k; if (k >= c && hi > k) hi = k; }
    if (lo === hi) return TIER_LIMITS[lo];
    const f = (c - lo) / (hi - lo);
    return [0, 1].map(i => Math.round(TIER_LIMITS[lo][i] + f * (TIER_LIMITS[hi][i] - TIER_LIMITS[lo][i])));
  }

  // ---------- helpers ----------
  const hm = s => { const m = /^(\d{1,3}):(\d{2})/.exec(s || ''); return m ? (+m[1]) + (+m[2]) / 60 : 0; };
  const isTime = s => /^\d{4}$/.test(s);
  const isStation = s => /^[A-Z]{3}$/.test(s);
  const dateRe = /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)(\d{2})$/;

  // ---------- parser ----------
  // pages: [{items:[{x,y,str}]}] in page orientation (y grows downward)
  function parseRoster(pages) {
    const raw = pages.flatMap((p, i) => p.items.map(it => ({ ...it, page: i })));
    // The duty detail ends where the summary block ("Flight time", "Crew Information…") starts
    const stop = raw.filter(i => /^(Flight time|Crew Information|Hotels)/.test(i.str.trim()))
      .sort((a, b) => a.page - b.page || a.y - b.y)[0];
    const all = raw.filter(i => !stop || i.page < stop.page || (i.page === stop.page && i.y < stop.y - 4) || /Period:|Individual duty plan|contract:/.test(i.str));
    const text = raw.map(i => i.str).join(' ');
    const per = /Period:\s*(\d{2})([A-Z][a-z]{2})(\d{2})\s*-\s*(\d{2})([A-Z][a-z]{2})(\d{2})/.exec(text);
    if (!per) throw new Error('No encuentro el periodo del roster. ¿Es el "Individual duty plan" de IDP en PDF?');
    const year = 2000 + (+per[3]), month = MONTHS[per[2]];
    const endDay = +per[4];
    const nameM = /Individual duty plan\s+for\s+(.+?)\s*\((\d+)\)/.exec(text);
    const contract = (/contract:\s*(\S+)/.exec(text) || [])[1] || '';

    // header: rank + base under "CRM"
    let rank = null, base = null;
    const crm = all.find(i => i.str === 'CRM' && i.page === 0);
    if (crm) {
      const under = all.filter(i => i.page === 0 && Math.abs(i.x - crm.x) < 6 && i.y > crm.y + 3 && i.y < crm.y + 30).sort((a, b) => a.y - b.y);
      for (const u of under) { const t = u.str.trim(); if (/^(PU|CA|ST|SC|FA|CM)$/.test(t) && !rank) rank = t; else if (isStation(t) && !base) base = t; }
    }

    // detail blocks: dates like "Mon09" at the left of a column
    const days = {};
    const dayAnchors = all.filter(i => dateRe.test(i.str.trim()) && i.y > 60);
    const colXs = [...new Set(dayAnchors.map(a => Math.round(a.x / 10)))].map(v => v * 10).sort((a, b) => a - b);
    const colOf = x => { let c = -1; for (let k = 0; k < colXs.length; k++) if (x >= colXs[k] - 12) c = k; return c; };

    const byPageCol = {};
    for (const it of all) {
      if (it.y < 60 && it.page === 0) continue; // header grid
      const c = colOf(it.x); if (c < 0) continue;
      const key = it.page + ':' + c;
      (byPageCol[key] = byPageCol[key] || []).push({ ...it, rx: it.x - colXs[c], s: it.str.trim() });
    }
    const pageKeys = Object.keys(byPageCol).sort((a, b) => { const [pa, ca] = a.split(':').map(Number), [pb, cb] = b.split(':').map(Number); return pa - pb || ca - cb; });
    for (const key of pageKeys) {
      const items = byPageCol[key].filter(i => i.s).sort((a, b) => a.y - b.y || a.x - b.x);
      if (!items.some(i => dateRe.test(i.s) && i.rx < 8)) continue;
      // group into lines
      const lines = [];
      for (const it of items) {
        const last = lines[lines.length - 1];
        if (last && Math.abs(last.y - it.y) <= 1.5) last.items.push(it); else lines.push({ y: it.y, items: [it] });
      }
      let cur = null;
      for (const ln of lines) {
        ln.items.sort((a, b) => a.x - b.x);
        // brackets live at rx >= 205; split them off
        const main = ln.items.filter(i => i.rx < 205);
        const br = ln.items.filter(i => i.rx >= 205);
        if (main.length && dateRe.test(main[0].s) && main[0].rx < 8) {
          const d = +dateRe.exec(main[0].s)[2];
          cur = days[d] = days[d] || { day: d, events: [], dt: null, fdp: null, bt: null, hotel: null, notes: [] };

      const ciEv = d.events.find(e => e.type === 'ci' || e.type === 'su');

    const allowBase = s.isTrainer ? +s.tBase : (s.isCT ? +s.ctBase : 0);

      level: s.level, days, rates: R, TF, TA, T, r, tiers, hourPay: r2(hourPay), minGuarantee, topUp, dietas, dietasPaid, early, extraFix, sales,
      salesFromDays: salesDays > 0, trainPay, trainDays, ctDays, allowBase, allowTotal: r2(allowBase + trainPay), baseSalary, fixed, taxable, ss, irpf, net,

    const per = /Periodo de liquidaci[óo]n\s*:?\s*(\d{2})\/(\d{2})\/(\d{4})/.exec(text);
    const cat = under('Categoría profesional') || '';

    const out = {
      period: per ? { month: +per[2], year: +per[3] } : null,
      rank: cm ? (cm[1] === 'C' ? 'PU' : 'CA') : null,

      nextIncrease: incM ? `${incM[3]}-${incM[2]}-${incM[1]}` : null,

    ps_of: ' za <b>{m}</b>', ps_at: ', úvazek {c} %', ps_plus: ', trenérský příplatek {v}', ps_next: '. Další zvýšení stupně: {d}',
    ps_mismatch: 'Pozor: tvoje základní mzda ({a}) neodpovídá tabulce ve smlouvě ({b}). Zkontroluj stupeň v části Moje smluvní údaje.',

</script>
<script>
const SEED = null;
const SEED_SETTINGS = null;
const APP_VERSION = '2026.11.05-1406';
const IS_PWA_BUILD = true;
const LS = 'payroster.v1';
const KC = { flight:'--k-flight', deadhead:'--k-dh', training:'--k-train', standby:'--k-sby', reserve:'--k-sby', ground:'--k-ground', off:'--k-off', empty:'--k-off', other:'--k-ground' };
const kind = k => ({ n: t('k_'+(KC[k]?k:'other')), c: KC[k]||KC.other });
const LANGS = Object.keys(I18N.names);
let lang = 'es', LOC = 'es-ES', eur, eur0, n2;
function setLang(l){
  lang = LANGS.includes(l) ? l : 'es'; LOC = I18N.locales[lang];
  eur = new Intl.NumberFormat(LOC,{style:'currency',currency:'EUR'});
  eur0 = new Intl.NumberFormat(LOC,{style:'currency',currency:'EUR',maximumFractionDigits:0});
  n2 = new Intl.NumberFormat(LOC,{minimumFractionDigits:2,maximumFractionDigits:2});
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
}
function t(k, v){
  let s = (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : (I18N.es[k] != null ? I18N.es[k] : k);
  if(v) s = s.replace(/\{(\w+)\}/g, (m,x) => v[x] != null ? v[x] : m);
  return s;
}
function detectLang(){ const n=(navigator.language||'').slice(0,2).toLowerCase(); return LANGS.includes(n) ? n : 'en'; }
const rankName = r => t(r==='PU'?'rankPU':'rankCA');
const monthName = (y,m,opt) => new Date(y,m-1,1).toLocaleDateString(LOC, opt||{month:'long'});
const langSelect = id => `<label>${t('f_lang')}<select id="${id}">${LANGS.map(l=>`<option value="${l}"${l===lang?' selected':''}>${I18N.names[l]}</option>`).join('')}</select></label>`;
const hhmm = h => { const m = Math.round(h*60); return Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); };
const t4 = t => t ? t.slice(0,2)+':'+t.slice(2) : '';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = load();
setLang(state.lang || detectLang());
function load(){
  let s=null; try{ s = JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){}
  if(!s || !s.months) s = { months:{}, extras:{}, settings: SEED_SETTINGS || PR.defaultSettings(), current:null, example:true };
  if(s.settings && s.settings.configured===undefined){ // profile saved before profiles existed
    s.settings.configured = true; s.settings.isTrainer = +s.settings.trainerPlus>0; s.settings.levelMode = 'manual';
  }
  if(!s.settings && SEED_SETTINGS) s.settings = SEED_SETTINGS;
  s.settings = Object.assign(PR.defaultSettings(), s.settings||{});
  if(s.settings.ctCodes==='DT_CT, DT_COMP, CT') s.settings.ctCodes='COMP';
  if(!Object.keys(s.months).length && SEED){ s.months[key(SEED)] = SEED; s.current = key(SEED); }
  if(!s.current || !s.months[s.current]) s.current = Object.keys(s.months).sort().pop();
  return s;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function key(r){ return r.year+'-'+String(r.month).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function render(){
  const keys = Object.keys(state.months).sort();
  const i = keys.indexOf(state.current);
  $('prevM').disabled = i<=0; $('nextM').disabled = i<0 || i>=keys.length-1;
  const ro = state.months[state.current];
  if(!ro){ renderSetup(); $('mLabel').textContent=t('noData'); $('hero').innerHTML=`<div class="panel"><div class="eyebrow">${t('startHere')}</div><p style="margin:8px 0 0">${t('startText')}</p></div>`; ['strip','legend','days','slip'].forEach(i=>$(i).innerHTML=''); renderForm(); renderStored(); return; }
  const s = state.settings;
  renderSetup();
  if(ro.base && !s.baseSetByUser) s.base = ro.base;
  const w = $('rankWarn');
  if(s.configured && ro.rankNorm && ro.rankNorm!==s.rank){
    w.hidden=false; w.className='msg err';
    w.innerHTML = `${t('rankWarn',{a:rankName(ro.rankNorm),b:rankName(s.rank)})} <button class="btn ghost" id="useRosterRank" type="button" style="margin-left:6px">${t('useRank',{a:rankName(ro.rankNorm)})}</button>`;
  } else w.hidden=true;
  const c = PR.compute(ro, s, state.extras);
  const mDate = new Date(ro.year, ro.month-1, 1);
  $('mLabel').textContent = mDate.toLocaleDateString(LOC,{month:'short',year:'numeric'}).replace('.','');
  renderHero(c, ro); renderStrip(c, ro); renderDays(c, ro); renderSlip(c, ro); renderForm(); renderStored();
}

function renderHero(c, ro){
  const [L1,L2] = c.rates.limits;
  const max = Math.max(L2+20, Math.ceil((c.T+10)/10)*10);
  const seg = (lo,hi,color) => { const w = Math.max(0, Math.min(c.T,hi)-lo)/max*100; return w>0?`<div class="gseg" style="width:${w}%;background:${color}"></div>`:''; };
  const tierNow = c.T>L2?3:c.T>L1?2:1;
  const nextMsg = tierNow===1 ? t('tier1Msg',{h:hhmm(L1-c.T)}) : tierNow===2 ? t('tier2Msg',{h:hhmm(L2-c.T)}) : t('tier3Msg');
  const dc = c.dietaCounts;
  const dietLine = ['intlNight','intlDay','natNight','natDay'].filter(k=>dc[k]).map(k=>t('dc_'+k,{n:dc[k]})).join(' · ') || t('noAway');
  $('hero').innerHTML = `
  <div class="panel">
    <div class="eyebrow">${t('variableIn',{m:monthName(ro.year,ro.month)})}</div>
    <div class="big num">${eur0.format(c.variable).replace(/\s?€/,'')}<small>€</small></div>
    <div class="sub">${t('variableSub')}</div>
    <dl class="kv">
      <dt>${t('dutyTime',{h:hhmm(c.T)})}</dt><dd>${eur.format(c.hourPay + c.topUp)}</dd>
      <dt>${t('perDiems')} · ${dietLine}</dt><dd>${eur.format(c.dietasPaid)}</dd>
      ${c.early?`<dt>${t('earlyOff')}</dt><dd>${eur.format(c.early)}</dd>`:''}
      ${c.trainDays+c.ctDays>0?`<dt>${t('trainDaysLine',{n:c.trainDays,c:c.ctDays})}</dt><dd>${eur.format(c.trainPay)}</dd>`:''}
      ${c.extraFix?`<dt>${t('daysBought')}</dt><dd>${eur.format(c.extraFix)}</dd>`:''}
      ${c.sales?`<dt>${t('sales')} ${c.salesFromDays?'':t('estimated')}</dt><dd>${eur.format(c.sales)}</dd>`:''}
    </dl>
    <div class="gauge" aria-label="${t('gaugeAria')}">
      <div class="gtrack">${seg(0,L1,'var(--accent)')}${seg(L1,L2,'var(--pay)')}${seg(L2,Infinity,'var(--warn)')}</div>
      <div class="gscale"><span style="left:0;transform:none">0</span><span style="left:${L1/max*100}%">${L1} h</span><span style="left:${L2/max*100}%">${L2} h</span></div>
      <div class="gnote">${nextMsg}</div>
    </div>
  </div>
  <div class="panel">
    <div class="eyebrow">${t('netTitle')}</div>
    <div class="netfig num">${eur.format(c.net)}</div>
    <div class="sub">${t('netSub',{ss:n2.format(state.settings.ss),irpf:n2.format(state.settings.irpf)})}</div>
    <dl class="kv">
      <dt>FDP</dt><dd class="mono">${hhmm(c.TF)} h</dd>
      <dt>${t('addDuty')}</dt><dd class="mono">${hhmm(c.TA)} h</dd>
      <dt>Block</dt><dd class="mono">${hhmm(c.blockHours)} h</dd>
      <dt>${t('fdpShare')}</dt><dd class="mono">${Math.round(c.r*100)} %</dd>
      ${c.topUp?`<dt>${t('minGuar')}</dt><dd>+${eur.format(c.topUp)}</dd>`:''}
    </dl>
  </div>`;
}

function renderStrip(c, ro){
  const dows = [...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleDateString(LOC,{weekday:'narrow'}));
  const first = (new Date(ro.year, ro.month-1, 1).getDay()+6)%7;
  const today = todayISO();
  let h = dows.map(d=>`<div class="dow">${d}</div>`).join('') + '<div class="cell blank"></div>'.repeat(first);
  for(const d of c.days){
    const k = kind(d.kind);
    const code = d.kind==='flight' ? (d.legs.filter(l=>l.type==='flt').map(l=>l.arr).filter(a=>a!==d.startLoc).filter((v,i,a)=>a.indexOf(v)===i).slice(0,2).join(' ')||'FLT')
              : d.kind==='deadhead' ? 'DH '+(d.legs[0]?d.legs[d.legs.length-1].arr:'')
              : (d.label||'').replace(/^DT_/,'').replace(/^STBY_/,'SB ').replace('RESERVE72','RES');
    h += `<button class="cell${d.date===today?' today':''}" style="--kc:var(${k.c})" data-go="${d.date}" aria-label="${d.day}: ${esc(k.n)} ${d.total?eur.format(d.total):''}">
      <span class="d">${d.day}</span><span class="c">${esc(code)}</span>${d.total>0.005?`<span class="e">${eur0.format(d.total)}</span>`:''}</button>`;
  }
  $('strip').innerHTML = h;
  const used = [...new Set(c.days.map(d=>d.kind))].filter(k=>k!=='empty');
  $('legend').innerHTML = used.map(k=>`<span><i style="background:var(${kind(k).c})"></i>${kind(k).n}</span>`).join('');
}

function renderDays(c, ro){
  const today = todayISO();
  const open = new Set([...document.querySelectorAll('.day[open]')].map(e=>e.dataset.date));
  $('days').innerHTML = c.days.map(d=>{
    const k = kind(d.kind);
    const wd = new Date(d.date+'T12:00').toLocaleDateString(LOC,{weekday:'short'}).replace('.','');
    const main = d.route ? d.route : (d.label || k.n);
    const times = d.ci ? `${t4(d.ci)}${d.co?'–'+t4(d.co):''}` : '';
    const tier = d.H>0 ? t('tierN',{n:d.tierEnd>c.rates.limits[1]?3:d.tierEnd>c.rates.limits[0]?2:1}) : '';
    const legs = d.legs.length ? `<div class="legs">${d.legs.map(l=>`<span class="${l.type==='dh'?'dhl':''}">${l.type==='dh'?'DH ':''}${esc(l.flight)}</span><span>${l.dep}</span><span>${t4(l.t1)}</span><span>${t4(l.t2)}</span><span>${l.arr}</span>`).join('')}</div>` : '';
    const ex = state.extras[d.date]||{};
    const offish = d.kind==='off' || d.kind==='flight' || d.kind==='deadhead';
    return `<details class="day${d.date===today?' isToday':''}" id="d-${d.date}" data-date="${d.date}"${open.has(d.date)?' open':''}>
      <summary>
        <div class="dd"><span class="wd">${wd}</span><span class="n">${d.day}</span></div>
        <div class="what"><div class="r">${esc(main)}</div>
          <div class="m"><span class="tag" style="--kc:var(${k.c})"><i></i>${k.n}</span>${times?`<span class="mono">${times}</span>`:''}${d.hotel?`<span>${t('nightIn',{st:d.hotel})}</span>`:''}</div></div>
        <div class="amt"><div class="v${d.total>0.005?'':' zero'}">${d.total>0.005?eur.format(d.total):'0 €'}</div>${d.H?`<div class="h">${hhmm(d.H)} h</div>`:''}</div>
      </summary>
      <div class="detail">
        ${legs}
        <dl class="brk">
          ${d.H?`<dt>${t('payHours',{f:hhmm(d.F),a:hhmm(d.A)})}${d.absence?t('absenceCredit'):''} · ${tier}</dt><dd>${eur.format(d.hourPay)}</dd>`:''}
          ${d.dieta?`<dt>${t('d_'+d.dietaType)}</dt><dd>${eur.format(d.dieta)}</dd>`:''}
          ${d.early?`<dt>${t('earlyAt',{t:t4(d.ci)})}</dt><dd>${eur.format(d.early)}</dd>`:''}
          ${d.isTrain?`<dt>${t('trainDay',{n:d.trainNo})}${d.trainNo===1?t('inPlus'):''}</dt><dd>${eur.format(d.trainPay)}</dd>`:''}
          ${d.isCTday?`<dt>${t('ctDay',{n:d.ctNo})}${d.ctNo===1?t('inPlus'):''}</dt><dd>${eur.format(d.trainPay)}</dd>`:''}
          ${d.extraFix?`<dt>${t('buyDefer')}</dt><dd>${eur.format(d.extraFix)}</dd>`:''}
          ${d.sales?`<dt>${t('sales')}</dt><dd>${eur.format(d.sales)}</dd>`:''}
          <dt class="t">${t('dayTotal')}</dt><dd class="t">${eur.format(d.total)}</dd>
        </dl>
        <div class="extras" data-date="${d.date}">
          ${d.kind==='flight'?`<label>${t('salesEur')} <input type="number" step="0.01" min="0" id="s-${d.date}" data-f="sales" value="${ex.sales||''}" placeholder="0,00"></label>`:''}
          ${offish?`<label>${t('dayBought')} <select id="b-${d.date}" data-f="buy"><option value="">${t('no')}</option><option value="full"${ex.buy==='full'?' selected':''}>${t('full')}</option><option value="half"${ex.buy==='half'?' selected':''}>${t('half')}</option></select></label>`:''}
          ${d.codes.includes('O_M')?`<label><input type="checkbox" id="o-${d.date}" data-f="omDefer"${ex.omDefer?' checked':''}> ${t('omDeferred')}</label>`:''}
          ${(!offish && d.kind!=='flight')?`<span class="note">${t('noExtras')}</span>`:''}
        </div>
      </div>
    </details>`;
  }).join('');
}

function renderSlip(c, ro){
  const s = state.settings, R = c.rates;
  const rows = [];
  const add = (name, info, val, cls='') => rows.push(`<tr class="${cls}"><td>${name}</td><td>${info||''}</td><td>${val}</td></tr>`);
  add(t('slip_base',{r:rankName(s.rank),l:c.level}), s.contract!==100?s.contract+' %':'', eur.format(c.baseSalary));
  if(c.allowTotal) add(t('slip_trainer'), t('slip_trainerInfo',{n:c.trainDays,c:c.ctDays}), eur.format(c.allowTotal));
  if(+s.uniform) add(t('slip_uniform'),'',eur.format(+s.uniform));
  const tn = ['<70','70–110','>110'];
  c.tiers.forEach(tr=>{ if(tr.h<=0) return;
    add(t('slip_fdp',{t:tn[tr.i]}), `${n2.format(tr.hF)} h × ${n2.format(tr.rateF)}`, eur.format(tr.payF));
    add(t('slip_add',{t:tn[tr.i]}), `${n2.format(tr.hA)} h × ${n2.format(tr.rateA)}`, eur.format(tr.payA)); });
  if(c.topUp) add(t('slip_min'),'',eur.format(c.topUp));
  if(c.early) add('Early check-in', `${c.early/s.earlyCheckin} × ${s.earlyCheckin} €`, eur.format(c.early));
  if(c.extraFix) add(t('slip_buy'),'',eur.format(c.extraFix));
  if(c.sales) add(t('slip_sales'), c.salesFromDays?'':t('estimatedW'), eur.format(c.sales));
  add(`<b>${t('slip_taxable')}</b>`,'',`<b>${eur.format(c.taxable)}</b>`);
  add(t('slip_ss'), n2.format(s.ss)+' %', '−'+eur.format(c.ss), 'ded');
  add(t('slip_irpf'), n2.format(s.irpf)+' %', '−'+eur.format(c.irpf), 'ded');
  const dc=c.dietaCounts;
  if(dc.intlNight) add(t('slip_intlNight'), `${dc.intlNight} × ${n2.format(PR.DIETA.intlNight)}`, eur.format(dc.intlNight*PR.DIETA.intlNight), 'ex');
  if(dc.intlDay) add(t('slip_intlDay'), `${dc.intlDay} × ${n2.format(PR.DIETA.intlDay)}`, eur.format(dc.intlDay*PR.DIETA.intlDay), 'ex');
  if(dc.natNight) add(t('slip_natNight'), `${dc.natNight} × ${n2.format(PR.DIETA.natNight)}`, eur.format(dc.natNight*PR.DIETA.natNight), 'ex');
  if(dc.natDay) add(t('slip_natDay'), `${dc.natDay} × ${n2.format(PR.DIETA.natDay)}`, eur.format(dc.natDay*PR.DIETA.natDay), 'ex');
  if(c.dietasPaid>c.dietas) add(t('slip_minDiet'),'',eur.format(c.dietasPaid-c.dietas),'ex');
  rows.push(`<tr class="sum"><td>${t('slip_net')}</td><td></td><td>${eur.format(c.net)}</td></tr>`);
  $('slip').innerHTML = rows.join('');
  const next = monthName(ro.year, ro.month+1);
  $('slipNote').innerHTML = t('slipNote',{m:next,f:R.fdp.map(x=>n2.format(x)).join(' / '),a:R.add.map(x=>n2.format(x)).join(' / ')});
}

function applyPayslip(p){
  const s = state.settings;
  if(!p.rank || p.level==null){ showMsg(t('e_noCat'), true); return; }
  s.rank = p.rank; s.level = p.level; s.contract = p.contract || 100;
  if(p.since){ s.levelMode='date'; s.since=p.since; } else s.levelMode='manual';
  // concept 1046 «Formación de cabina»: 270 € or more = trainer, 80–269 € = competence team only
  s.isTrainer = p.trainerPlus >= (+s.tBase||270); s.isCT = !s.isTrainer && p.trainerPlus > 0;
  if(p.uniform) s.uniform = p.uniform;
  if(p.irpf!=null) s.irpf = p.irpf;
  if(p.ss) s.ss = PR.r2(p.ss);
  if(p.sales>0) s.salesEstimate = PR.r2(p.sales);
  s.configured = true; $('form').dataset.ready=''; save(); render();
  const expected = (PR.BASE[p.rank][p.level]||0) * s.contract/100;
  const mes = p.period ? monthName(p.period.year,p.period.month,{month:'long',year:'numeric'}) : '';
  let html = t('ps_read',{m: mes?t('ps_of',{m:mes}):'', r: rankName(p.rank), l: p.level, c: s.contract!==100?t('ps_at',{c:s.contract}):'', irpf: n2.format(s.irpf),
    t: s.isTrainer?t('ps_trainer'):(s.isCT?t('ps_ct'):''), n: p.nextIncrease?t('ps_next',{d:new Date(p.nextIncrease+'T12:00').toLocaleDateString(LOC)}):''});
  if(p.basePay && Math.abs(p.basePay-expected)>1) html += ' <br>'+t('ps_mismatch',{a:eur.format(p.basePay),b:eur.format(expected)});
  if(!Object.keys(state.months).length) html += ' '+t('ps_nowRoster');
  showMsg(html, p.basePay && Math.abs(p.basePay-expected)>1);
}
function saveSetup(){
  const s = state.settings, v = id => $(id).value;
  const rank = v('p-rank'), pay = parseFloat(String(v('p-basepay')).replace(',','.')), inc = v('p-inc'), lv = v('p-level');
  const table = PR.BASE[rank];
  if(pay && inc){
    const full = pay / ((+v('p-contract')||100)/100); let level = table.findIndex(x=>x!=null && Math.abs(x-full)<0.5);
    if(level<0){ $('p-err').textContent = t('e_notInTable',{v:n2.format(pay),r:rankName(rank)}); return; }
    const d = new Date(inc+'T12:00'); d.setFullYear(d.getFullYear()-level);
    s.levelMode='date'; s.since = d.toISOString().slice(0,10); s.level = level;
  } else if(lv!==''){ s.levelMode='manual'; s.level=+lv; s.since=''; }
  else { $('p-err').textContent = t('e_fill'); return; }
  s.rank = rank; s.irpf = parseFloat(String(v('p-irpf')).replace(',','.'))||0; s.contract = +v('p-contract');
  s.isTrainer = $('p-trainer').checked; s.isCT = $('p-ct').checked;
  s.configured = true; $('form').dataset.ready=''; save(); render();
}

function renderStored(){
  const keys = Object.keys(state.months).sort().reverse();
  $('stored').innerHTML = keys.map(k=>{ const r=state.months[k]; const lbl=monthName(r.year,r.month,{month:'long',year:'numeric'});
    return `<div class="row" style="justify-content:space-between"><span style="text-transform:capitalize">${lbl}${r.crew?` · <span class="note">${esc(r.crew)}</span>`:''}</span>
      <span class="confirm" id="cf-${k}"><button class="btn danger" data-del="${k}" type="button">${t('del')}</button></span></div>`; }).join('') || `<span class="note">${t('noneStored')}</span>`;
}

// ---- events ----
document.addEventListener('click', e=>{
  const go = e.target.closest('[data-go]');
  if(go){ const el = $('d-'+go.dataset.go); if(el){ el.open = true; el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'center'}); } return; }
  const del = e.target.closest('[data-del]');
  if(del){ const k=del.dataset.del; $('cf-'+k).innerHTML = `<span class="note">${t('delQ')}</span><button class="btn danger" data-delok="${k}" type="button">${t('delYes')}</button><button class="btn ghost" data-delno type="button">${t('no')}</button>`; return; }
  const ok = e.target.closest('[data-delok]');
  if(ok){ delete state.months[ok.dataset.delok]; state.current = Object.keys(state.months).sort().pop()||null; save(); render(); return; }
  if(e.target.closest('[data-delno]')){ renderStored(); return; }
  if(e.target.id==='useRosterRank'){ const ro=state.months[state.current]; state.settings.rank=ro.rankNorm; $('form').dataset.ready=''; save(); render(); return; }
  if(e.target.id==='redoSetup'){ state.settings.configured=false; save(); render(); $('setup').scrollIntoView(); return; }
  if(e.target.id==='p-save'){ saveSetup(); return; }
  if(e.target.id==='resetSet'){ const b=state.settings.base; state.settings = Object.assign(PR.defaultSettings(),{base:b}); $('form').dataset.ready=''; save(); render(); }
});
$('prevM').onclick = ()=>{ const k=Object.keys(state.months).sort(); const i=k.indexOf(state.current); if(i>0){state.current=k[i-1]; save(); render();} };
$('nextM').onclick = ()=>{ const k=Object.keys(state.months).sort(); const i=k.indexOf(state.current); if(i<k.length-1){state.current=k[i+1]; save(); render();} };

document.addEventListener('change', e=>{
  if(e.target.id==='f-lang' || e.target.id==='p-lang'){ state.lang = e.target.value; setLang(state.lang); if(IS_PWA_BUILD) $('verTxt').textContent = t('version',{v:APP_VERSION}); save(); $('form').dataset.ready=''; $('setup').innerHTML=''; $('setup').hidden=true; render(); return; }
  const el = e.target;
  const box = el.closest('.extras');
  if(box && el.dataset.f){
    const d = box.dataset.date; const ex = state.extras[d] = state.extras[d]||{};
    ex[el.dataset.f] = el.type==='checkbox' ? el.checked : (el.dataset.f==='sales' ? (parseFloat(String(el.value).replace(',','.'))||0) : el.value);
    save(); render(); return;
  }
  if(el.id && el.id.startsWith('f-')){
    const f = el.id.slice(2), s = state.settings;
    if(el.type==='checkbox') s[f]=el.checked;
    else if(['level','contract','uniform','irpf','ss','salesEstimate','earlyCheckin','tBase','tTwo','tExtra','ctBase','ctExtra'].includes(f)) s[f]=parseFloat(String(el.value).replace(',','.'))||0;
    else s[f]=f==='base'?el.value.toUpperCase().trim():el.value;
    if(f==='base') s.baseSetByUser = true;
    if(['rank','levelMode','isTrainer','isCT','since'].includes(f)){ if(f==='rank') s.level=1; $('form').dataset.ready=''; }
    save(); render();
  }
});

// ---- PDF import ----
const PDFJS = './lib/';
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error(t('e_pdfLib'))); document.head.appendChild(s); }); }
async function readPdf(file){
  if(!window.pdfjsLib){ await loadScript(PDFJS+'pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS+'pdf.worker.min.js'; }
  const doc = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p); const tc=await pg.getTextContent(); const vp=pg.getViewport({scale:1});
    pages.push({items: tc.items.filter(i=>i.str&&i.str.trim()).map(it=>{ const m=pdfjsLib.Util.transform(vp.transform,it.transform); return {x:m[4],y:m[5],str:it.str}; })});
  }
  return pages;
}
function showMsg(html, err){ const m=$('importMsg'); m.hidden=false; m.className='msg'+(err?' err':''); m.innerHTML=html; }
$('pdfIn').addEventListener('change', async e=>{
  const f = e.target.files[0]; if(!f) return;
  showMsg(t('reading',{f:esc(f.name)}));
  try{
    const pages = await readPdf(f);
    const slip = PR.parsePayslip(pages[0] ? pages[0].items : []);
    if(slip){ applyPayslip(slip); e.target.value=''; return; }
    const ro = PR.parseRoster(pages);
    const k = key(ro);
    state.months[k] = ro; state.current = k; save(); render();
    const flights = ro.days.filter(d=>d.events.some(x=>x.type==='flt')).length;
    showMsg(t('imported',{m:monthName(ro.year,ro.month,{month:'long',year:'numeric'}),d:ro.days.length,f:flights}));
  }catch(err){ const m=String(err.message||err); showMsg(/^No encuentro el periodo/.test(m)?t('e_noPeriod'):esc(m), true); }
  e.target.value='';
});

render();
// ---- updates (installed webapp) ----
async function latestVersion(){
  const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('http'); return (await r.json()).version;
}
async function checkUpdate(manual){
  if(!IS_PWA_BUILD) return;
  try{
    const v = await latestVersion();
    if(v && v !== APP_VERSION){
      const b=$('updBar'); b.hidden=false;
      b.innerHTML = `${t('upd_available')} <button class="btn" id="updNow" type="button" style="margin-left:6px">${t('upd_button')}</button>`;
    } else if(manual) $('updRes').textContent = t('upd_latest');
  }catch(e){ if(manual) $('updRes').textContent = t('upd_offline'); }
}
async function applyUpdate(){
  try{
    if('serviceWorker' in navigator){ const reg = await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }
    if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); }
  }catch(e){}
  location.replace(location.pathname + '?v=' + Date.now());
}
if(IS_PWA_BUILD){
  $('verRow').hidden=false; $('verTxt').textContent = t('version',{v:APP_VERSION});
  document.addEventListener('click', e=>{ if(e.target.id==='updNow') applyUpdate(); if(e.target.id==='updCheck'){ $('updRes').textContent='…'; checkUpdate(true); } });
  checkUpdate(false);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkUpdate(false); });
}
// open today's row on first view
(()=>{ const el=$('d-'+todayISO()); if(el) el.open=true; })();
