<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Payroster">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Payroster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: duty-plan ledger — month figure + tier gauge on top, a NetLine-style day strip, then one row per day that opens into its pay breakdown. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#e9ebf1; --ink:#161a2c; --muted:#5d6379; --line:#d8dbe5;
  --accent:#2c4fd6; --accent-soft:#e3e8fb; --pay:#0b7650; --pay-soft:#dcf1e7; --warn:#a85a00; --warn-soft:#fbecd6;
  --k-flight:#2c4fd6; --k-dh:#7d8bd6; --k-train:#c48a00; --k-sby:#8e4fb8; --k-off:#c9ccd7; --k-ground:#3a8a9a;
  --f-display:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1220; --surface:#171b2d; --sunk:#1f2438; --ink:#e8eaf3; --muted:#9aa0b8; --line:#2b3150;
  --accent:#8fa6ff; --accent-soft:#232c55; --pay:#5fd3a2; --pay-soft:#163a2c; --warn:#f0b35e; --warn-soft:#3b2a12;
  --k-flight:#7f99ff; --k-dh:#5e6aa8; --k-train:#d9a520; --k-sby:#b583d9; --k-off:#3a4060; --k-ground:#5bb3c4; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#171b2d; --sunk:#1f2438; --ink:#e8eaf3; --muted:#9aa0b8; --line:#2b3150;
  --accent:#8fa6ff; --accent-soft:#232c55; --pay:#5fd3a2; --pay-soft:#163a2c; --warn:#f0b35e; --warn-soft:#3b2a12;
  --k-flight:#7f99ff; --k-dh:#5e6aa8; --k-train:#d9a520; --k-sby:#b583d9; --k-off:#3a4060; --k-ground:#5bb3c4; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:22px;letter-spacing:.01em;margin-right:auto}
.brand span{color:var(--accent)}
.monthnav{display:flex;align-items:center;gap:2px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;height:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn:disabled{opacity:.35;cursor:default}
.mlabel{font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:17px;min-width:96px;text-align:center;text-transform:capitalize}

/* summary */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{font-family:var(--f-display);font-weight:800;font-stretch:78%;font-size:46px;line-height:1;margin:6px 0 4px;letter-spacing:-.01em}
.big small{font-size:22px;font-weight:600;color:var(--muted);margin-left:2px}
.sub{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.kv .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700;color:var(--ink)}
.netfig{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:32px;color:var(--pay);line-height:1.05;margin-top:4px}

/* tier gauge */
.gauge{margin-top:14px}
.gtrack{position:relative;height:14px;border-radius:7px;background:var(--sunk);overflow:hidden;display:flex}
.gseg{height:100%}
.gscale{position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:3px}
.gscale span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono)}
.gnote{font-size:13px;color:var(--muted);margin-top:4px}
.gnote b{color:var(--ink)}

/* strip calendar */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.cell{border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:58px;padding:4px 5px;cursor:pointer;display:flex;flex-direction:column;gap:1px;text-align:left;position:relative;overflow:hidden}
.cell::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--kc, transparent)}
.cell .d{font-family:var(--f-mono);font-size:12px;font-weight:600;margin-top:2px}
.cell .c{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono)}
.cell .e{font-size:11.5px;font-weight:600;color:var(--pay);margin-top:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* day list */
h2{font-family:var(--f-display);font-weight:750;font-stretch:85%;font-size:20px;margin:6px 0 0;text-wrap:balance}
.days{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.day{border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day>summary{list-style:none;display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.day>summary::-webkit-details-marker{display:none}
.day[open]>summary{background:var(--sunk)}
.day.isToday>summary{box-shadow:inset 3px 0 0 var(--accent)}
.dd{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.dd .wd{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dd .n{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:24px}
.what{min-width:0}
.what .r{font-family:var(--f-mono);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what .m{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.tag i{width:8px;height:8px;border-radius:2px;background:var(--kc)}
.amt{text-align:right;font-variant-numeric:tabular-nums}
.amt .v{font-family:var(--f-display);font-weight:750;font-stretch:85%;font-size:19px;color:var(--pay)}
.amt .v.zero{color:var(--muted);font-weight:500}
.amt .h{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.detail{padding:4px 12px 14px 76px;display:grid;gap:12px}
@media (max-width:520px){.detail{padding-left:12px}}
.legs{font-family:var(--f-mono);font-size:12.5px;display:grid;grid-template-columns:auto auto auto auto 1fr;gap:3px 12px;overflow-x:auto}
.legs .dhl{color:var(--muted)}
.brk{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px}
.brk dt{color:var(--muted)} .brk dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.brk .t{font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:4px}
.extras{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;background:var(--sunk);border-radius:8px;padding:10px}
.extras label{display:flex;align-items:center;gap:6px}
.extras input[type=number]{width:84px}
input[type=number],input[type=text],select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:14px}

/* payslip */
.slip{font-size:13.5px;border-collapse:collapse;width:100%}
.slip td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.slip td:nth-child(2),.slip td:nth-child(3){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.slip td:nth-child(2){color:var(--muted);font-family:var(--f-mono);font-size:12px}
.slip tr.sum td{font-weight:800;border-bottom:0;border-top:2px solid var(--pay);color:var(--pay);font-size:16px;padding-top:8px}
.slip tr.sec td{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:14px;border-bottom:1px solid var(--line)}
.slip tr.sec td:nth-child(3){color:var(--ink);font-weight:700;letter-spacing:0;text-transform:none;font-size:13.5px}
.slip tr.gross td{font-weight:700;background:var(--pay-soft);color:var(--pay);border-bottom:0}
.slip tr.info td{color:var(--muted);font-size:12.5px}
.sumbox{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:12px;font-variant-numeric:tabular-nums}
.sumbox dt{color:var(--muted)} .sumbox dd{margin:0;text-align:right;font-weight:500}
.sumbox .op{color:var(--muted);font-family:var(--f-mono);margin-right:6px}
.sumbox .gross{background:var(--pay-soft);color:var(--pay);font-weight:700;padding:6px 8px;border-radius:6px}
.sumbox dt.gross{border-radius:6px 0 0 6px} .sumbox dd.gross{border-radius:0 6px 6px 0}
.salesm{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.salesm input{width:110px;text-align:right;flex:0 0 auto}
.salesm .src{display:block;margin-top:2px;font-size:11.5px;font-weight:600}
.src.s-slip{color:var(--pay)} .src.s-man{color:var(--accent)} .src.s-none{color:var(--warn)}
.askj{display:flex;flex-direction:column;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);background:var(--warn-soft);border-radius:8px;padding:10px 12px}
.askjin{display:flex;flex-direction:column;gap:4px;color:var(--ink);font-weight:600;font-size:13px}
/* iOS draws an empty date field with no width: give it a real box */
.askjin input[type=date]{width:100%;max-width:240px;min-height:42px;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.crew{display:grid;gap:8px;font-size:13px}
.crew .leg{display:grid;gap:4px}
.crew .lh{font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.crew .mem{display:flex;flex-wrap:wrap;gap:4px 6px}
.crew .m{background:var(--sunk);border-radius:6px;padding:2px 7px;white-space:nowrap}
.crew .m b{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:600;margin-right:4px}
.crew .m.me{background:var(--accent-soft)}
.crew details summary{cursor:pointer;color:var(--muted)}
.crew .names{columns:2 180px;column-gap:16px;margin-top:6px;color:var(--ink)}
.h2row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.share{display:grid;gap:12px}
.share .opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px}
.share .opts label{display:flex;align-items:center;gap:6px}
.share .opts input[type=date]{min-height:36px;font-size:15px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.qrbox{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.qrbox .qr{background:#fff;padding:10px;border-radius:10px;width:min(260px,100%);line-height:0}
.qrbox .qr svg{width:100%;height:auto;display:block}
.qrbox .linkcol{flex:1 1 220px;min-width:0;display:grid;gap:8px}
.qrbox textarea{width:100%;min-height:84px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:6px;resize:vertical}
body.viewer .wrap > *:not(.bar):not(#viewer){display:none!important}
body.viewer .monthnav, body.viewer label[for=pdfIn]{display:none}
#viewer .vday>summary{grid-template-columns:54px 1fr}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.toolbar .btn{font-size:13.5px;padding:8px 12px}
.toolbar .btn.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
table.chk{font-size:12.5px}
table.chk td{vertical-align:top;padding:6px 3px}
table.chk td:first-child{min-width:0;word-break:break-word}
table.chk td:nth-child(2){font-family:inherit;font-size:inherit;color:var(--muted)}
table.chk tr.hint td{font-size:12px;color:var(--muted);padding-top:0;border-top:0;text-align:left!important;white-space:normal!important}
table.chk tr.meh td{background:var(--sunk)}
table.chk tr.meh td:last-child{color:var(--muted)}
table.chk td:nth-child(2),table.chk td:nth-child(3),table.chk td:nth-child(4),table.chk td:nth-child(5),table.chk td:nth-child(6),table.chk td:nth-child(7){text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.chk tr.bad td{background:var(--warn-soft)}
table.chk tr.bad:not(.hint) td:last-child{color:var(--warn);font-weight:700}
.mlist{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.mrow{display:grid;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow.tot{background:var(--sunk)}
.mrow .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600;text-transform:capitalize}
.mrow .mh b{font-family:var(--f-display);font-stretch:85%;font-size:17px;color:var(--pay);text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:13px;white-space:nowrap}
.mrow.tot .chip{background:var(--surface)}
.chip.c-vac{background:var(--accent-soft)}
.chip.c-bez{background:var(--pay-soft)}
.chip.c-sick{background:var(--warn-soft)}
.fdpl{font-size:13px;display:grid;gap:3px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.fdpl b{font-family:var(--f-mono)}
.fdpl .over{color:var(--warn);font-weight:700}
.ftl{display:grid;gap:12px}
.ftl .fl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;margin-bottom:4px}
.sumbox .netrow{border-top:2px solid var(--pay);padding-top:8px;color:var(--pay);font-weight:800;font-size:17px}
.slip tr.ded td:nth-child(3){color:var(--warn)}
.slip tr.ex td:nth-child(3){color:var(--pay)}
.tablewrap{overflow-x:auto}

/* settings / import */
details.box>summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-stretch:85%;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"+";color:var(--muted);font-family:var(--f-mono)}
details.box[open]>summary::after{content:"–"}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form label.chk{flex-direction:row;align-items:center;color:var(--ink);font-size:13.5px}
.form input,.form select{width:100%;min-width:0}
.form label.chk{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:14px;padding-block:4px;cursor:pointer}
.form label.chk input{width:20px;height:20px;flex:none;margin:0;accent-color:var(--accent)}
/* Safari (iPad/iPhone) draws an empty date field as a grey pill with no height */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:36px;line-height:1.3;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:14px;color:var(--ink)}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.form .wide{grid-column:1/-1}
.btn{border:0;border-radius:8px;background:var(--accent);color:var(--surface);padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:13.5px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.msg.err{background:var(--warn-soft);color:var(--warn)}
.note{font-size:12.5px;color:var(--muted);max-width:65ch}
.note b{color:var(--ink);font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand">Pay<span>roster</span></div>
    <div class="monthnav">
      <button class="iconbtn" id="prevM" aria-label="" data-i18n-aria="prevMonth">‹</button>
      <div class="mlabel" id="mLabel">—</div>
      <button class="iconbtn" id="nextM" aria-label="" data-i18n-aria="nextMonth">›</button>
    </div>
    <label class="iconbtn" for="pdfIn" title="" data-i18n-title="importTitle">＋ PDF</label>
    <input type="file" id="pdfIn" accept="application/pdf,.pdf" class="sr" multiple>
  </header>

  <div id="updBar" class="msg" hidden></div>
  <section id="viewer" hidden></section>
  <div id="importMsg" hidden></div>
  <div id="rankWarn" hidden></div>
  <section class="panel" id="setup" hidden></section>

  <section class="hero" id="hero"></section>

  <section>
    <div class="strip" id="strip"></div>
    <div class="legend" id="legend"></div>
  </section>

  <section>
    <div class="h2row"><h2 data-i18n="dayByDay"></h2><button class="btn ghost" id="shareBtn" type="button" data-i18n="share_btn"></button></div>
    <div class="panel share" id="sharePanel" hidden></div>
    <p class="note" data-i18n="dayByDayNote"></p>
    <p class="note" data-i18n="rateNote"></p>
    <p class="note" data-i18n="fdpNote"></p>
    <div class="days" id="days"></div>
  </section>

  <section>
    <h2 data-i18n="toolsT"></h2>
    <div class="toolbar" id="toolbar"></div>
    <div class="panel" id="toolPanel" hidden style="margin-top:10px"></div>
  </section>

  <section class="panel">
    <h2 style="margin-top:0" id="slipH"></h2>
    <p class="note" id="slipNote"></p>
    <div class="tablewrap"><table class="slip" id="slip"></table></div>
  </section>

  <details class="box panel" id="setBox">
    <summary data-i18n="contractData"></summary>
    <div class="form" id="form"></div>
  </details>

  <details class="box panel">
    <summary data-i18n="storedMonths"></summary>
    <div id="stored" style="margin-top:12px;display:grid;gap:8px"></div>
    <div id="sharedList" style="margin-top:12px;display:grid;gap:8px"></div>
    <p class="note" style="margin-top:12px" data-i18n="storedNote"></p>
  </details>

  <p class="note" data-i18n="footer"></p>
  <p class="note" data-i18n="footer2"></p>
  <div class="row note" id="verRow" hidden><span id="verTxt"></span><button class="btn ghost" id="updCheck" type="button" data-i18n="upd_check"></button><span id="updRes"></span></div>
</div>

<script>
// Payroster engine: roster parser + pay rules (Convenio TCP Eurowings Europe, bases España)
// Pure functions; no DOM. Used by the page and by node tests.
var PR = (function () {
  const PARSER_V = 8; // bump when the roster reader changes, so saved months get re-read
  const MONTHS = { Jan: 1, Feb: 2, Mar: 3, Apr: 4, May: 5, Jun: 6, Jul: 7, Aug: 8, Sep: 9, Oct: 10, Nov: 11, Dec: 12 };
  const ES_AIRPORTS = new Set(('PMI IBZ MAH MAD BCN AGP ALC VLC SVQ BIO SCQ VGO OVD SDR LPA TFS TFN ACE FUE SPC GMZ VDE ' +
    'GRX XRY LEI REU GRO ZAZ VIT PNA LCG MJV RMU VLL SLM LEN BJZ EAS SDR HSK ODB RGS CDT MLN JCU').split(' '));

  // ---------- time zones (IDP prints every time in UTC) ----------
  const TZ = {};
  const tzList = {
    'Europe/London': 'LHR LGW STN LTN MAN EDI GLA BHX BRS NCL LPL BFS EMA ABZ',
    'Europe/Dublin': 'DUB ORK SNN',
    'Europe/Lisbon': 'LIS OPO FAO FNC PDL',
    'Atlantic/Canary': 'LPA TFS TFN ACE FUE SPC VDE GMZ',
    'Europe/Athens': 'ATH HER RHO CFU SKG KGS JTR JMK CHQ ZTH KLX EFL PVK',
    'Asia/Nicosia': 'LCA PFO', 'Europe/Helsinki': 'HEL', 'Europe/Riga': 'RIX', 'Europe/Vilnius': 'VNO', 'Europe/Tallinn': 'TLL',
    'Europe/Bucharest': 'OTP', 'Europe/Sofia': 'SOF VAR BOJ', 'Europe/Kiev': 'KBP',
    'Europe/Istanbul': 'IST SAW AYT ADB DLM BJV ESB', 'Africa/Casablanca': 'RAK AGA CMN TNG FEZ',
    'Africa/Cairo': 'HRG SSH CAI RMF', 'Asia/Jerusalem': 'TLV', 'Asia/Dubai': 'DXB', 'Atlantic/Reykjavik': 'KEF'
  };
  for (const z in tzList) tzList[z].split(' ').forEach(a => TZ[a] = z);
  const tzOf = st => TZ[st] || 'Europe/Madrid'; // the rest of Europe shares CET/CEST
  function localHour(dateISO, hhmm, st) {
    const [y, m, d] = dateISO.split('-').map(Number);
    const utc = Date.UTC(y, m - 1, d, Math.floor(+hhmm / 100), +hhmm % 100);
    try {
      const p = new Intl.DateTimeFormat('en-GB', { timeZone: tzOf(st), hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(utc));
      return +p.find(x => x.type === 'hour').value + (+p.find(x => x.type === 'minute').value) / 60;
    } catch (e) { return Math.floor(+hhmm / 100) + 1; }
  }

  // ---------- EASA ORO.FTL.205 (b)(1): max daily FDP, acclimatised crew ----------
  // rows: [from, to) local start time in minutes; values for 1–2, 3, 4 … 10 sectors (minutes)
  const FDP_TABLE = (() => {
    const h = x => { const [a, b] = x.split(':').map(Number); return a * 60 + b; };
    const row = (from, to, list) => ({ from: h(from), to: h(to), v: list.split(' ').map(h) });
    return [
      row('06:00', '13:30', '13:00 12:30 12:00 11:30 11:00 10:30 10:00 9:30 9:00'),
      row('13:30', '14:00', '12:45 12:15 11:45 11:15 10:45 10:15 9:45 9:15 9:00'),
      row('14:00', '14:30', '12:30 12:00 11:30 11:00 10:30 10:00 9:30 9:00 9:00'),
      row('14:30', '15:00', '12:15 11:45 11:15 10:45 10:15 9:45 9:15 9:00 9:00'),
      row('15:00', '15:30', '12:00 11:30 11:00 10:30 10:00 9:30 9:00 9:00 9:00'),
      row('15:30', '16:00', '11:45 11:15 10:45 10:15 9:45 9:15 9:00 9:00 9:00'),
      row('16:00', '16:30', '11:30 11:00 10:30 10:00 9:30 9:00 9:00 9:00 9:00'),
      row('16:30', '17:00', '11:15 10:45 10:15 9:45 9:15 9:00 9:00 9:00 9:00'),
      row('05:00', '05:15', '12:00 11:30 11:00 10:30 10:00 9:30 9:00 9:00 9:00'),
      row('05:15', '05:30', '12:15 11:45 11:15 10:45 10:15 9:45 9:15 9:00 9:00'),
      row('05:30', '05:45', '12:30 12:00 11:30 11:00 10:30 10:00 9:30 9:00 9:00'),
      row('05:45', '06:00', '12:45 12:15 11:45 11:15 10:45 10:15 9:45 9:15 9:00')
    ];
  })();
  const FDP_NIGHT = '11:00 10:30 10:00 9:30 9:00 9:00 9:00 9:00 9:00'.split(' ').map(x => { const [a, b] = x.split(':').map(Number); return a * 60 + b; }); // 17:00–04:59
  function maxFdp(startLocalH, sectors) {
    const m = Math.round(((startLocalH % 24) + 24) % 24 * 60);
    const r = FDP_TABLE.find(x => m >= x.from && m < x.to);
    const col = Math.min(8, Math.max(0, (sectors || 1) - 2));
    return (r ? r.v : FDP_NIGHT)[col] / 60;
  }

  // ---------- convenio tables ----------
  const BASE = {
    PU: [null, 2150, 2175, 2200, 2225, 2250, 2275, 2300, 2325, 2350, 2375, 2400, 2425, 2450, 2475, 2500],
    CA: [1260, 1740, 1781, 1822, 1863, 1904, 1945, 1986, 2027, 2068, 2109, 2150]
  };
  const PCT = { // % of monthly base per hour, art. 24.7.2
    PU: { fdp: [0.105, 0.2, 0.32], add: [0.053, 0.1, 0.16] },
    CA: { fdp: [0.065, 0.2, 0.33], add: [0.033, 0.1, 0.165] }
  };
  const TIER_LIMITS = { // art. 30.7.7.2, by contract %
    100: [70, 110], 95: [67, 105], 90: [63, 99], 85: [60, 94], 80: [56, 88], 75: [53, 83], 70: [49, 77], 65: [46, 72], 60: [42, 66], 55: [39, 61], 50: [35, 55]
  };
  const DIETA = { intlDay: 66.11, natDay: 36.06, intlNight: 91.35, natNight: 53.34 };
  const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;

  function defaultSettings() {
    return {
      rank: 'PU', level: 1, levelMode: 'date', since: '', contract: 100, base: 'PMI',
      isTrainer: false, isCT: false, uniform: 66.66, irpf: 15, ss: 6.5, configured: false,
      salesEstimate: 0, minDietas: false,
      absenceCodes: 'U, SU, UL, URL, VAC, SICK, KRANK, PERM, PR',
      earlyCheckin: 30,
      trainingCodes: 'DT_TRNG, CATR, CAB_K', joined: '', fiscalAid: 500, ctCodes: 'COMP',
      // Works Agreement Cabin Trainers (Eurowings Europe Spain), 1.1.1.2
      tBase: 270, tTwo: 340, tExtra: 105, ctBase: 80, ctExtra: 80
    };
  }

  function rates(s) {
    const base = BASE[s.rank][s.level] || 0;
    const p = PCT[s.rank];
    return {
      base,
      fdp: p.fdp.map(x => r2(base * x / 100)),
      add: p.add.map(x => r2(base * x / 100)),
      limits: [70, 110]   // payslips of part-time crew (80 %) use the same 70 / 110 h tiers
    };
  }
  function interpLimits(c) {
    const keys = Object.keys(TIER_LIMITS).map(Number).sort((a, b) => a - b);
    let lo = keys[0], hi = keys[keys.length - 1];
    for (const k of keys) { if (k <= c) lo = k; if (k >= c && hi > k) hi = k; }
    if (lo === hi) return TIER_LIMITS[lo];
    const f = (c - lo) / (hi - lo);
    return [0, 1].map(i => Math.round(TIER_LIMITS[lo][i] + f * (TIER_LIMITS[hi][i] - TIER_LIMITS[lo][i])));
  }

  // ---------- helpers ----------
  const hm = s => { const m = /^(\d{1,3}):(\d{2})/.exec(s || ''); return m ? (+m[1]) + (+m[2]) / 60 : 0; };
  const isTime = s => /^\d{4}$/.test(s);
  const isStation = s => /^[A-Z]{3}$/.test(s);
  const dateRe = /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)(\d{2})$/;

  // ---------- parser ----------
  // pages: [{items:[{x,y,str}]}] in page orientation (y grows downward)
  // An IDP export can cover one month or several (e.g. 01Jan26 - 30Nov26): parseRosterAll returns one roster per month.
  function parseRoster(pages, ym) {
    const all = parseRosterAll(pages);
    return (ym && all.find(r => r.year + '-' + String(r.month).padStart(2, '0') === ym)) || all[0];
  }
  function parseRosterAll(pages) {
    const raw = pages.flatMap((p, i) => p.items.map(it => ({ ...it, page: i })));
    // The duty detail ends where the summary block ("Flight time", "Crew Information…") starts
    const stop = raw.filter(i => /^(Flight time|Crew Information|Hotels)/.test(i.str.trim()))
      .sort((a, b) => a.page - b.page || a.y - b.y)[0];
    // The summary (flight time, hotels, crew list) can start inside the last day column of a page:
    // drop only what sits below it in that column, and everything on later pages.
    const all = raw.filter(i => !stop || i.page < stop.page ||
      (i.page === stop.page && (i.y < stop.y - 4 || i.x < stop.x - 12)) || /Period:|Individual duty plan|contract:/.test(i.str));
    const text = raw.map(i => i.str).join(' ');
    const per = /Period:\s*(\d{2})([A-Z][a-z]{2})(\d{2})\s*-\s*(\d{2})([A-Z][a-z]{2})(\d{2})/.exec(text);
    if (!per) throw new Error('No encuentro el periodo del roster. ¿Es el "Individual duty plan" de IDP en PDF?');
    const year = 2000 + (+per[3]), month = MONTHS[per[2]];
    const startDay = +per[1], endDay = +per[4], endYear = 2000 + (+per[6]), endMonth = MONTHS[per[5]];
    const nMonths = Math.max(1, (endYear * 12 + endMonth) - (year * 12 + month) + 1);
    // day key = month offset * 100 + day; dates only carry the day, so a smaller day means the next month
    const offOf = (mo, yr) => (yr * 12 + mo) - (year * 12 + month);
    const findOff = makeOffFinder(year, month, nMonths);
    const nameM = /Individual duty plan\s+for\s+(.+?)\s*\((\d+)\)/.exec(text);
    const contract = (/contract:\s*(\S+)/.exec(text) || [])[1] || '';

    // header: rank + base under "CRM"
    let rank = null, base = null;
    const crm = all.find(i => i.str === 'CRM' && i.page === 0);
    if (crm) {
      const under = all.filter(i => i.page === 0 && Math.abs(i.x - crm.x) < 6 && i.y > crm.y + 3 && i.y < crm.y + 30).sort((a, b) => a.y - b.y);
      for (const u of under) { const t = u.str.trim(); if (/^(PU|CA|ST|SC|FA|CM)$/.test(t) && !rank) rank = t; else if (isStation(t) && !base) base = t; }
    }

    // detail blocks: dates like "Mon09" at the left of a column
    const days = {};
    // Columns are found per page: each page has its own left edges (e.g. 31 / 298), and a
    // stray date elsewhere on another page (crew-leg list) must not shift them.
    const colsByPage = {};
    for (const i of all) {
      if (!(dateRe.test(i.str.trim()) && i.y > 60)) continue;
      (colsByPage[i.page] = colsByPage[i.page] || []).push(i.x);
    }
    for (const p in colsByPage) {
      const xs = colsByPage[p].sort((a, b) => a - b), cl = [];
      for (const x of xs) { if (!cl.length || x - cl[cl.length - 1].max > 15) cl.push({ min: x, max: x }); else cl[cl.length - 1].max = x; }
      colsByPage[p] = cl.map(c => c.min);
    }
    const colOf = (page, x) => { const cx = colsByPage[page] || []; let c = -1; for (let k = 0; k < cx.length; k++) if (x >= cx[k] - 12) c = k; return c; };

    const byPageCol = {};
    for (const it of all) {
      if (it.y < 60 && it.page === 0) continue; // header grid
      const c = colOf(it.page, it.x); if (c < 0) continue;
      const key = it.page + ':' + c;
      (byPageCol[key] = byPageCol[key] || []).push({ ...it, rx: it.x - colsByPage[it.page][c], s: it.str.trim() });
    }
    let mOff = 0, lastD = 0;
    const pageKeys = Object.keys(byPageCol).sort((a, b) => { const [pa, ca] = a.split(':').map(Number), [pb, cb] = b.split(':').map(Number); return pa - pb || ca - cb; });
    for (const key of pageKeys) {
      const items = byPageCol[key].filter(i => i.s).sort((a, b) => a.y - b.y || a.x - b.x);
      if (!items.some(i => dateRe.test(i.s) && i.rx < 8)) continue;
      // group into lines
      const lines = [];
      for (const it of items) {
        const last = lines[lines.length - 1];
        if (last && Math.abs(last.y - it.y) <= 1.5) last.items.push(it); else lines.push({ y: it.y, items: [it] });
      }
      let cur = null;
      for (const ln of lines) {
        ln.items.sort((a, b) => a.x - b.x);
        // brackets live at rx >= 205; split them off
        const main = ln.items.filter(i => i.rx < 205);
        const br = ln.items.filter(i => i.rx >= 205);
        if (main.length && dateRe.test(main[0].s) && main[0].rx < 8) {
          const dm0 = dateRe.exec(main[0].s), d = +dm0[2];
          mOff = findOff(dm0[1], d, mOff, lastD);
          lastD = d;
          const dk = mOff * 100 + d;
          cur = days[dk] = days[dk] || { day: d, events: [], dt: null, fdp: null, bt: null, hotel: null, notes: [] };
          main.shift();
        }
        if (!cur) continue;
        if (br.length) {
          const t = br.map(b => b.s).join(' ');
          const m = /\[(DT|BT|DP|FDP)\s*(\d{1,3}:\d{2})\]?/.exec(t);
          if (m) { const k = m[1].toLowerCase(); cur[k] = (cur[k] || 0) + hm(m[2]); }
        }
        if (!main.length) continue;
        const toks = main.map(i => ({ s: i.s, rx: i.rx }));
        const words = toks.map(t => t.s);
        const first = words.join(' ');
        if (/^To\b|^Ref:|^c\/m/.test(first)) continue;
        if (/^H\d{1,2}$/.test(words[0]) && toks[0].rx < 30) { cur.hotel = words.find(isStation) || null; continue; }
        // bucket by relative x
        const at = (lo, hi) => toks.filter(t => t.rx >= lo && t.rx < hi).map(t => t.s);
        const label = at(25, 95).join(' ');
        const dep = at(98, 118).find(isStation) || null;
        const t1 = at(118, 138).find(isTime) || null;
        const t2 = at(138, 158).find(isTime) || null;
        const arr = at(158, 182).find(isStation) || null;
        const info = at(182, 205).join(' ');
        const reserveMark = at(88, 100).includes('R');
        if (!label && !dep && !t1) { if (main.length) cur.notes.push(first); continue; }
        if (/^Pick Up/.test(label)) { cur.events.push({ type: 'pickup', t1 }); continue; }
        if (!label && (dep || t1)) { cur.notes.push(first); continue; }
        let m;
        if ((m = /^(DH\/)?([A-Z0-9]{2})\s*(\d{1,4}[A-Z]?)$/.exec(label)) && dep && arr && t1 && t2) {
          cur.events.push({ type: m[1] ? 'dh' : 'flt', flight: m[2] + ' ' + m[3], dep, arr, t1, t2, ac: info });
        } else if (/^C\/I$/.test(label)) {
          cur.events.push({ type: 'ci', st: dep, t1 });
        } else if (/^C\/O$/.test(label)) {
          cur.events.push({ type: 'co', st: arr || dep, t1: t2 || t1 });
        } else if (/^S\/U$/.test(label)) {
          cur.events.push({ type: 'su', st: dep, t1 });
        } else {
          cur.events.push({ type: 'code', code: label.split(' ')[0], label, st: dep || arr, t1, t2, arr, reserveMark });
        }
      }
    }

    // DT limit values (page with "Value for DT Limit Calc")
    const dtl = {};
    const re = /(\d{2})([A-Z][a-z]{2})(\d{2})\s+(\d{1,2}:\d{2})/g;
    const p3 = pages.map(p => p.items.slice().sort((a, b) => a.y - b.y || a.x - b.x).map(i => i.str).join(' ')).join(' ');
    if (/Limit Calc/.test(p3)) {
      const after = p3.slice(p3.indexOf('Limit Calc'));
      let m; while ((m = re.exec(after))) { const o = offOf(MONTHS[m[2]], 2000 + (+m[3])); if (o >= 0 && o < nMonths) dtl[o * 100 + (+m[1])] = hm(m[4]); }
    }
    const summary = {
      flightTime: hm((/Flight time\s+(\d+:\d{2})/.exec(text) || [])[1]),
      fdp: hm((/Alt\.\s*flight duty period\s+(\d+:\d{2})/.exec(text) || [])[1])
    };

    // crew lists ("Crew Information on Leg" / "on Ground Activity")
    const crew = parseCrew(raw, findOff);

    const res = [];
    for (let o = 0; o < nMonths; o++) {
      const yy = year + Math.floor((month - 1 + o) / 12), mm = (month - 1 + o) % 12 + 1;
      const first = o === 0 && nMonths > 1 ? startDay : 1;
      const last = o === nMonths - 1 ? endDay : new Date(Date.UTC(yy, mm, 0)).getUTCDate();
      const out = [];
      for (let d = first; d <= last; d++) {
        const k = o * 100 + d;
        const x = days[k] || { day: d, events: [], dt: null, fdp: null, hotel: null, notes: [] };
        x.dtLimit = dtl[k] != null ? dtl[k] : null;
        x.date = `${yy}-${String(mm).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        x.crew = crew.legs[k] || [];
        x.gcrew = crew.events[k] || [];
        out.push(x);
      }
      res.push({ parser: PARSER_V, year: yy, month: mm, crew: nameM ? nameM[1] : '', crewId: nameM ? nameM[2] : '', contract, rank, rankNorm: normRank(rank), base, days: out,
        summary: nMonths === 1 ? summary : { flightTime: null, fdp: null }, multi: nMonths > 1 ? nMonths : undefined });
    }
    return res;
  }

  // ---------- crew lists ----------
  // Reading order: page, then column (x < 290 / < 565 / rest), then top to bottom. A leg line is
  // "Mon09 EW 9840 DUS 0525 0655 LIN", followed by "cockpit: CP Name", "FO Name", "cabin: PU Name",
  // "ST Name"…; a ground activity is "Tue03 DT_TRNG BER 0700 1700" followed by "crew on event:Name"
  // and one name per line.
  // Dates only say "Tue17": the month is the first one, from the current one on, where the 17th is a Tuesday
  // (going forward only when the day goes back or the weekday doesn't fit).
  const WD = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  function makeOffFinder(year, month, nMonths) {
    return (wd, d, off, lastD) => {
      if (nMonths <= 1) return 0;
      const fits = o => { const dt = new Date(Date.UTC(year, month - 1 + o, d)); return dt.getUTCDate() === d && dt.getUTCDay() === WD[wd]; };
      const from = d < lastD ? off + 1 : off;
      for (let o = from; o < nMonths; o++) if (fits(o)) return o;
      return Math.min(from, nMonths - 1);
    };
  }
  function parseCrew(raw, findOff) {
    findOff = findOff || (() => 0);
    const legs = {}, events = {};
    const col = x => x < 290 ? 0 : x < 565 ? 1 : 2;
    const items = raw.filter(i => i.y > 115 && i.str.trim()).map(i => ({ ...i, c: col(i.x), s: i.str.trim() }))
      .sort((a, b) => a.page - b.page || a.c - b.c || a.y - b.y || a.x - b.x);
    const lines = [];
    for (const it of items) {
      const l = lines[lines.length - 1];
      if (l && l.page === it.page && l.c === it.c && Math.abs(l.y - it.y) <= 1.5) l.parts.push(it.s);
      else lines.push({ page: it.page, c: it.c, y: it.y, parts: [it.s] });
    }
    const ROLE = /^(CP|cp|FO|SO|SFO|PU|ST|SC|FA|CA|CC|PR|TR|JU|IN|OB)$/;
    const date = /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)(\d{2})$/;
    let mode = null, cur = null, off = 0, lastD = 0;
    for (const l of lines) {
      const text = l.parts.join(' ').replace(/\s+/g, ' ').trim();
      if (/Crew Information on/.test(text)) { const nm = /Ground/.test(text) ? 'event' : /Leg/.test(text) ? 'leg' : mode; if (nm !== mode) { off = 0; lastD = 0; } mode = nm; cur = null; continue; }
      if (!mode) continue;
      if (/Legend|expiry date|^code description|^date flight|^Hotels|Flight time/.test(text)) { cur = null; continue; }
      const tok = text.split(' ');
      const dm = date.exec(tok[0]);
      if (dm) {
        const d0 = +dm[2];
        off = findOff(dm[1], d0, off, lastD);
        lastD = d0;
        const day = off * 100 + d0;
        const fl = /^(DH\/)?[A-Z0-9]{2}$/.test(tok[1]) && /^\d{1,4}[A-Z]?$/.test(tok[2]);
        if (fl) { cur = { type: 'leg', flight: tok[1] + ' ' + tok[2], dep: tok[3], t1: tok[4], arr: tok[tok.length - 1], members: [] }; (legs[day] = legs[day] || []).push(cur); }
        else { cur = { type: 'event', code: tok[1], st: /^[A-Z]{3}$/.test(tok[2]) ? tok[2] : '', names: [] }; (events[day] = events[day] || []).push(cur); }
        continue;
      }
      if (!cur) continue;
      if (cur.type === 'leg') {
        const t = tok.filter(x => !/^(cockpit|cabin):?$/.test(x));
        if (t.length > 1 && ROLE.test(t[0]) && /,/.test(text)) cur.members.push({ role: t[0], name: t.slice(1).join(' ') });
        else cur = null;
      } else {
        const name = text.replace(/^crew on event:\s*/, '').replace(/^crew on\s+event:\s*/, '');
        if (/,/.test(name) && !/\d/.test(name) && name.length < 60) cur.names.push(name);
        else if (!/^crew on/.test(text)) cur = null;
      }
    }
    return { legs, events };
  }

  // ---------- classification ----------
  const OFF_CODES = /^(O_|OFF|FREI|U_OFF|LV_OFF)/;
  function classify(day) {
    const ev = day.events;

<script>
// ---- Payroster tools: payslip check, what-if, calendar, FTL, days off, year summary, backup ----
// Shares the page's globals (state, t, eur, n2, hhmm, PR, monthName, key, prevKey, save, render…).

const TOOLS = ['check','sim','cal','ftl','vac','year','backup'];
let toolOpen = null, simDate = null;

function renderToolbar(){
  const bar = $('toolbar'); if(!bar) return;
  bar.innerHTML = TOOLS.map(k => `<button class="btn ghost${toolOpen===k?' on':''}" type="button" data-tool="${k}">${t('tool_'+k)}</button>`).join('');
}
function openTool(k){
  toolOpen = (toolOpen===k && k!=='sim') ? null : k;
  renderToolbar();
  const p = $('toolPanel');
  if(!toolOpen){ p.hidden = true; p.innerHTML = ''; return; }
  p.hidden = false;
  ({check:renderCheck, sim:renderSim, cal:renderCal, ftl:renderFtl, vac:renderVac, year:renderYear, backup:renderBackup})[toolOpen]();
  p.scrollIntoView({block:'nearest'});
}
function refreshTool(){ if(toolOpen) ({check:renderCheck, sim:renderSim, cal:renderCal, ftl:renderFtl, vac:renderVac, year:renderYear, backup:renderBackup})[toolOpen](); }
const pnl = html => { $('toolPanel').innerHTML = html; };
const hdr = (k, sub) => `<div class="eyebrow">${t('tool_'+k)}</div>${sub?`<p class="note" style="margin:6px 0 12px">${sub}</p>`:''}`;
const fmtH = h => hhmm(Math.max(0,h||0));
const nm = (y,m,o) => monthName(y,m,o||{month:'long',year:'numeric'});
const kOf = (y,m) => y+'-'+String(m).padStart(2,'0');
const prevYM = (y,m) => m===1 ? [y-1,12] : [y,m-1];
const nextYM = (y,m) => m===12 ? [y+1,1] : [y,m+1];

// ================= 1. payslip check =================
function slipBuckets(lines){
  const sum = (f, fld='dev') => lines.filter(f).reduce((a,l)=>a+(+l[fld]||0),0);
  const L = l => (l.label||'').toLowerCase();
  const isH = l => /^(tiempo de vuelo|tpo de vuelo|tpo vuelo)/.test(L(l));
  const isAdd = l => /adicion/.test(L(l));
  const viaje = l => /^viaje/.test(L(l));
  const dType = l => (/inter/.test(L(l)) ? 'intl' : 'nat') + (/con pern/.test(L(l)) ? 'Night' : 'Day');
  const counts = {intlNight:0,intlDay:0,natNight:0,natDay:0}, dAmt = {intlNight:0,intlDay:0,natNight:0,natDay:0};
  lines.filter(viaje).forEach(l => { const k = dType(l); dAmt[k] += +l.dev||0; counts[k] += Math.round((+l.dev||0) / PR.DIETA[k]); });
  const known = l => l.code==='1000' || isOneOff(l) || /uniforme|formaci[oó]n de cabina|compra|comisi|asesoramiento|early|check/.test(L(l)) || isH(l) || viaje(l) || /^\//.test(l.code);
  return {
    base: sum(l=>l.code==='1000'), uniform: sum(l=>/uniforme/.test(L(l))), trainer: sum(l=>/formaci[oó]n de cabina/.test(L(l))),

function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function utcStamp(dateISO, hhmm, plusDays){ const [y,m,d] = dateISO.split('-').map(Number); const dt = new Date(Date.UTC(y,m-1,d+(plusDays||0), Math.floor(+hhmm/100), +hhmm%100)); return dt.toISOString().replace(/[-:]/g,'').slice(0,15)+'Z'; }

function buildIcs(months, o){
  const ev = [], me = (state.months[state.current]||{}).crew||'';
  for(const ro of months){
    const c = PR.compute(ro, state.settings, state.extras);
    let open = null;
    const close = (end) => { if(!open) return; open.end = end || open.end; ev.push(open); open = null; };
    for(const d of c.days){
      const raw = ro.days.find(x=>x.date===d.date) || {events:[]};
      // a duty only carries over midnight when the next day starts with its remaining legs
      if(open && !(raw.events[0] && (raw.events[0].type==='flt' || raw.events[0].type==='dh' || raw.events[0].type==='co'))) close();
      for(const e of raw.events){
        if(e.type==='ci' || e.type==='su'){ close(); open = { start: utcStamp(d.date, e.t1), legs:[], date:d.date, d }; continue; }
        if(e.type==='flt' || e.type==='dh'){
          if(!open) open = { start: utcStamp(d.date, e.t1), legs:[], date:d.date, d };
          open.legs.push(e); open.end = utcStamp(d.date, e.t2, +e.t2 < +e.t1 ? 1 : 0); open.hotel = d.hotel || open.hotel;
          if(!open.crew && d.crew && d.crew.length) open.crew = d.crew; continue; }
        if(e.type==='co'){ if(open) close(utcStamp(d.date, e.t1)); continue; }
        if(e.type==='code'){
          const off = /^(O_|OFF|FREI|U$|SU$|U_)/.test(e.code);
          if(off){ if(o.off && !open) ev.push({ allDay:d.date, title:e.code + (kind(d.kind).n?` · ${kind(d.kind).n}`:''), d }); continue; }
          if(open){ open.extra = (open.extra||[]).concat(e.code); continue; }
          if(e.t1 && e.t2) ev.push({ start: utcStamp(d.date, e.t1), end: utcStamp(d.date, e.t2, +e.t2 <= +e.t1 ? 1 : 0), title: e.label || e.code, loc: e.st, d, gcrew: d.gcrew });
        }
      }
    }
    close();
  }
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Payroster//Roster//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Payroster'];
  const now = new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  for(const e of ev){
    const legs = e.legs||[];
    const title = legs.length ? (legs.some(l=>l.type==='flt') ? '' : 'DH ') + [legs[0].dep, ...legs.map(l=>l.arr)].join('–') : e.title;
    const desc = [];
    legs.forEach(l => desc.push(`${l.type==='dh'?'DH ':''}${l.flight} ${l.dep} ${t4(l.t1)}–${t4(l.t2)} ${l.arr} (UTC)`));
    if(e.hotel) desc.push(t('nightIn',{st:e.hotel}));
    if(e.extra) desc.push(e.extra.join(', '));
    if(o.crew && e.crew) e.crew.forEach(l => desc.push(`${l.flight}: ` + l.members.filter(m=>m.name.trim()!==me.trim()).map(m=>m.role+' '+m.name).join(' · ')));
    const uid = `${(e.start||e.allDay).replace(/[^0-9TZ]/g,'')}-${icsEsc(title).replace(/[^A-Za-z0-9]/g,'').slice(0,20)}@payroster`;
    lines.push('BEGIN:VEVENT', 'UID:'+uid, 'DTSTAMP:'+now);
    if(e.allDay){ const dd = e.allDay.replace(/-/g,''); const nx = new Date(e.allDay+'T12:00:00Z'); nx.setUTCDate(nx.getUTCDate()+1);
      lines.push('DTSTART;VALUE=DATE:'+dd, 'DTEND;VALUE=DATE:'+nx.toISOString().slice(0,10).replace(/-/g,''), 'TRANSP:TRANSPARENT'); }
    else lines.push('DTSTART:'+e.start, 'DTEND:'+(e.end||addMin(e.start,60)));
    lines.push('SUMMARY:'+icsEsc(title));
    if(legs[0] || e.loc) lines.push('LOCATION:'+icsEsc(legs[0] ? legs[0].dep : e.loc));
    if(desc.length) lines.push('DESCRIPTION:'+icsEsc(desc.join('\n')));
    if(o.alarm && !e.allDay) lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:-PT'+o.alarm+'M','END:VALARM');
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  // fold lines at 75 octets-ish
  return { text: lines.map(l => l.length>74 ? l.match(/.{1,74}/g).join('\r\n ') : l).join('\r\n'), n: ev.length };
}

const blockMin = l => { const m = x => Math.floor(+x/100)*60 + (+x%100); let v = m(l.t2) - m(l.t1); if(v<0) v += 1440; return v; };
function ftlTimeline(){
  const map = {};
  for(const k of Object.keys(state.months)){
    const ro = state.months[k];
    for(const d of ro.days){
      const duty = d.dtLimit != null ? d.dtLimit : (d.dt || 0);
      const blk = (d.events||[]).filter(e=>e.type==='flt').reduce((a,l)=>a+blockMin(l),0)/60;
      map[d.date] = { duty, block: blk };
    }
  }
  return map;
}
function renderFtl(){
  const ro = state.months[state.current]; if(!ro){ pnl(hdr('ftl')+`<p class="msg">${t('startText')}</p>`); return; }
  const map = ftlTimeline(), s = state.settings;
  const sc = full => s.contract>=100 ? full : Math.min(full, Math.round(full * s.contract/100 * 1.1));
  const dayAdd = (iso, n) => { const d = new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
  const win = (end, n, f) => { let sum=0, missing=false; for(let i=0;i<n;i++){ const x = map[dayAdd(end,-i)]; if(!x) missing=true; else sum += x[f]; } return {sum, missing}; };
  const days = ro.days.map(d=>d.date), last = days[days.length-1];
  const peak = (n, f) => { let best={sum:0,end:days[0],missing:false}; for(const dd of days){ const w = win(dd,n,f); if(w.sum>best.sum) best={...w,end:dd}; } return best; };
  const yearSum = (f) => { let sum=0; for(const k in map){ if(k.startsWith(ro.year+'-') && k<=last) sum += map[k][f]; } return sum; };
  const items = [
    { lbl:t('ftl_d7'),  w:peak(7,'duty'),   lim:60 },
    { lbl:t('ftl_d14'), w:peak(14,'duty'),  lim:110 },
    { lbl:t('ftl_d28'), w:peak(28,'duty'),  lim:sc(190) },
    { lbl:t('ftl_b28'), w:peak(28,'block'), lim:sc(100) },
    { lbl:t('ftl_b12m'),w:win(last,365,'block'), lim:sc(1000) },
    { lbl:t('ftl_byear',{y:ro.year}), w:{sum:yearSum('block')}, lim:sc(900) },
    { lbl:t('ftl_dyear',{y:ro.year}), w:{sum:yearSum('duty')},  lim:sc(2000) },
  ];
  const anyMissing = items.some(i=>i.w.missing);
  pnl(hdr('ftl', t('ftl_intro',{m:nm(ro.year,ro.month)})) + `<div class="ftl">${items.map(i=>{
    const p = Math.min(100, i.w.sum/i.lim*100), cls = p>=100?'over':p>=90?'warn':'';
    return `<div class="fr"><div class="fl"><span>${i.lbl}</span><span class="mono">${fmtH(i.w.sum)} / ${i.lim} h${i.w.end?` <span class="note">(${t('ftl_until',{d:+i.w.end.slice(8)})})</span>`:''}</span></div>
      <div class="gtrack"><div class="gseg ${cls}" style="width:${p}%;background:${cls==='over'?'var(--warn)':cls==='warn'?'var(--k-train)':'var(--accent)'}"></div></div></div>`; }).join('')}</div>
    ${anyMissing?`<p class="note">${t('ftl_missing')}</p>`:''}<p class="note">${t('ftl_note')}${s.contract<100?' '+t('ftl_pt',{c:s.contract}):''}</p>`);
}

  const ro = state.months[state.current]; const year = ro ? ro.year : new Date().getFullYear();
  const absence = new Set(String(state.settings.absenceCodes||'').split(/[,\s]+/).filter(Boolean).map(x=>x.toUpperCase()));
  const cats = ['vac','su','om','off','bez','sick'];
  const rows = [];
  for(let m=1;m<=12;m++){
    const r = state.months[kOf(year,m)]; if(!r) continue;
    const cnt = {vac:0,su:0,om:0,off:0,bez:0,sick:0};
    for(const d of r.days){
      const codes = d.events.filter(e=>e.type==='code').map(e=>e.code.toUpperCase());
      if(codes.includes('U') || codes.some(c=>/^U_/.test(c) && c!=='U_OFF')) cnt.vac++;
      else if(codes.includes('SU')) cnt.su++;
      else if(codes.some(c=>/KRANK|SICK|^K_|^AU$/.test(c))) cnt.sick++;
      else if(codes.includes('O_M')) cnt.om++;
      else if(codes.some(c=>/^(O_|FREI|U_OFF|OFF$)/.test(c)) && !d.events.some(e=>e.type==='flt'||e.type==='ci')) cnt.off++;
      if(codes.some(c=>/^OFF_BEZ/.test(c))) cnt.bez++;
    }
    rows.push({m, cnt});
  }
  const tot = cats.reduce((o,k)=>(o[k]=rows.reduce((a,r)=>a+r.cnt[k],0),o),{});
  const ent = vacEntitlement(year);
  pnl(hdr('vac', t('vac_intro',{y:year})) +
    `<p class="msg">${t('vac_sum',{u:tot.vac,e:ent.days,l:Math.max(0,ent.days-tot.vac)})}${ent.known?'':' '+t('vac_noJoined')}</p>
    <div class="mlist">${rows.map(r=>`<div class="mrow"><div class="mh">${nm(year,r.m,{month:'long'})}</div><div class="chips">${cats.filter(k=>r.cnt[k]).map(k=>`<span class="chip c-${k}">${t('vac_'+k)} <b>${r.cnt[k]}</b></span>`).join('') || '<span class="note">—</span>'}</div></div>`).join('')}
      <div class="mrow tot"><div class="mh">${t('vac_total')}</div><div class="chips">${cats.filter(k=>tot[k]).map(k=>`<span class="chip c-${k}">${t('vac_'+k)} <b>${tot[k]}</b></span>`).join('')}</div></div></div>
    <p class="note">${t('vac_note')}</p>`);
}

// ================= 6. year summary =================
function yearData(year){
  const s = state.settings, out = [];
  for(let m=1;m<=12;m++){
    const k = kOf(year,m), real = (state.slips||{})[k];
    if(real && real.lines){
      const R = slipBuckets(real.lines);
      const gross = real.totals && real.totals.devengos != null ? real.totals.devengos : null;
      out.push({ m, real:true, gross: gross!=null ? gross : null, dietas:R.dietas, ss:R.ss, irpf:R.irpf + R.ingCta, net:real.net });
      continue;
    }
    const [py,pm] = prevYM(year,m), prev = state.months[kOf(py,pm)];
    if(!prev && !state.months[k]) continue;
    const c = prev ? PR.compute(prev, s, state.extras) : null, P = slipFor(c, s, year, m);
    out.push({ m, real:false, partial:!prev, gross:P.gross, dietas:P.dietas, ss:P.ss, irpf:P.irpf + P.ingresoCta, net:P.net });
  }
  return out;
}
function renderYear(){
  const years = [...new Set([...Object.keys(state.months), ...Object.keys(state.slips||{})].map(k=>+k.slice(0,4)))].sort();
  const ro = state.months[state.current];
  const year = +($('yr-y') && $('yr-y').value) || (ro ? ro.year : years[years.length-1]);
  if(!year){ pnl(hdr('year')+`<p class="msg">${t('startText')}</p>`); return; }
  const rows = yearData(year);
  const full = rows.filter(r=>!r.partial), nPart = rows.length - full.length;
  const sum = f => full.reduce((a,r)=>a+(+r[f]||0),0);
  const max = Math.max(1, ...rows.map(r=>r.net));
  const W = 600, H = 170, bw = W/12;
  const bars = rows.map(r=>{ const h = r.net/max*(H-34); const x = (r.m-1)*bw;
    return `<rect x="${x+6}" y="${H-18-h}" width="${bw-12}" height="${h}" rx="3" fill="${r.real?'var(--pay)':'var(--accent)'}" opacity="${r.partial?0.45:1}"></rect>
      <text x="${x+bw/2}" y="${H-18-h-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${Math.round(r.net)}</text>`; }).join('');
  const labels = [...Array(12)].map((_,i)=>`<text x="${i*bw+bw/2}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)">${new Date(2024,i,1).toLocaleDateString(LOC,{month:'short'}).replace('.','')}</text>`).join('');
  pnl(hdr('year', t('yr_intro')) + `<label class="note">${t('yr_year')} <select id="yr-y">${years.map(y=>`<option${y===year?' selected':''}>${y}</option>`).join('')}</select></label>
    <div class="tablewrap" style="margin-top:10px"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;display:block" role="img" aria-label="${t('yr_chart')}">${bars}${labels}</svg></div>
    <div class="legend"><span><i style="background:var(--pay)"></i>${t('yr_real')}</span><span><i style="background:var(--accent)"></i>${t('yr_est')}</span></div>
    <div class="mlist">${rows.map(r=>`<div class="mrow"${r.partial?' style="opacity:.55"':''}><div class="mh"><span>${nm(year,r.m,{month:'long'})} <span class="note">${r.real?t('yr_realS'):r.partial?t('yr_partial'):t('yr_estS')}</span></span><b class="num">${eur.format(r.net)}</b></div>
      <div class="note num">${t('grossTotal')} ${r.gross!=null?eur.format(r.gross):'—'} · ${t('yr_diet')} ${eur.format(r.dietas)} · ${t('slip_ss')} ${eur.format(r.ss)} · IRPF ${eur.format(r.irpf)}</div></div>`).join('')}
      <div class="mrow tot"><div class="mh"><span>${t('vac_total')}</span><b class="num">${eur.format(sum('net'))}</b></div>
      <div class="note num">${t('grossTotal')} ${eur.format(sum('gross'))} · ${t('yr_diet')} ${eur.format(sum('dietas'))} · ${t('slip_ss')} ${eur.format(sum('ss'))} · IRPF ${eur.format(sum('irpf'))}</div></div></div>
    ${nPart?`<p class="note">${t('yr_partNote',{n:nPart})}</p>`:''}<p class="note">${t('yr_note',{g:eur.format(sum('gross')-sum('dietas')),i:eur.format(sum('irpf')),s:eur.format(sum('ss')),d:eur.format(sum('dietas'))})}</p>`);
}

// ================= 7. backup =================
function renderBackup(msg){
  const n = Object.keys(state.months).length, ns = Object.keys(state.slips||{}).length;
  pnl(hdr('backup', t('bk_intro')) + `<p class="note">${t('bk_have',{m:n,s:ns})}</p>
    <div class="row"><button class="btn" id="bk-exp" type="button">${t('bk_export')}</button>

}
let bkPending = null;
document.addEventListener('change', async e=>{
  if(e.target.id==='bk-in'){
    const f = e.target.files[0]; if(!f) return;
    try{ const j = JSON.parse(await f.text()); if(j.app!=='payroster' || !j.state || !j.state.months) throw 0;

      $('bk-out').innerHTML = `<p class="msg err">${t('bk_confirm',{m:Object.keys(j.state.months).length,d:esc(j.exported||'')})}</p><div class="row"><button class="btn danger" id="bk-ok" type="button">${t('bk_replace')}</button><button class="btn ghost" id="bk-no" type="button">${t('no')}</button></div>`;

document.addEventListener('click', async e=>{

    await giveFile(`payroster-copia-${todayISO()}.json`, data, 'application/json');
    $('bk-out').innerHTML = `<p class="msg">${t('bk_done')}</p>`; return; }
  if(id==='bk-ok' && bkPending){ const lang = state.lang; state = Object.assign({ extras:{}, slips:{}, shared:{} }, bkPending); state.lang = state.lang || lang; bkPending = null;
    save(); location.reload(); return; }
  if(id==='bk-no'){ bkPending = null; $('bk-out').innerHTML=''; return; }
});

</script>
<script>
const SEED = null;
const SEED_SETTINGS = null;
const APP_VERSION = '2026.11.08-1925';
const IS_PWA_BUILD = true;
const LS = 'payroster.v1';
const KC = { flight:'--k-flight', deadhead:'--k-dh', training:'--k-train', standby:'--k-sby', reserve:'--k-sby', ground:'--k-ground', off:'--k-off', empty:'--k-off', other:'--k-ground' };
const kind = k => ({ n: t('k_'+(KC[k]?k:'other')), c: KC[k]||KC.other });
const LANGS = Object.keys(I18N.names);
let lang = 'es', LOC = 'es-ES', eur, eur0, n2;
function setLang(l){
  lang = LANGS.includes(l) ? l : 'es'; LOC = I18N.locales[lang];
  // 'always' so Spanish shows 3.044,40 like the payslip (CLDR would print 3044,40)
  eur = new Intl.NumberFormat(LOC,{style:'currency',currency:'EUR',useGrouping:'always'});
  eur0 = new Intl.NumberFormat(LOC,{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:'always'});
  n2 = new Intl.NumberFormat(LOC,{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
}
function t(k, v){
  let s = (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : (I18N.es[k] != null ? I18N.es[k] : k);
  if(v) s = s.replace(/\{(\w+)\}/g, (m,x) => v[x] != null ? v[x] : m);
  return s;
}
function detectLang(){ const n=(navigator.language||'').slice(0,2).toLowerCase(); return LANGS.includes(n) ? n : 'en'; }
const rankName = r => t(r==='PU'?'rankPU':'rankCA');
const monthName = (y,m,opt) => new Date(y,m-1,1).toLocaleDateString(LOC, opt||{month:'long'});
const langSelect = id => `<label>${t('f_lang')}<select id="${id}">${LANGS.map(l=>`<option value="${l}"${l===lang?' selected':''}>${I18N.names[l]}</option>`).join('')}</select></label>`;
const hhmm = h => { const m = Math.round(h*60); return Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); };
const t4 = t => t ? t.slice(0,2)+':'+t.slice(2) : '';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = load();
save();   // keep months re-read by a newer parser
setLang(state.lang || detectLang());
function load(){
  let s=null; try{ s = JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){}
  if(!s || !s.months) s = { months:{}, extras:{}, settings: (s && s.settings) || SEED_SETTINGS || PR.defaultSettings(), current:null, example:true, lang: s && s.lang };
  if(s.settings && s.settings.configured===undefined){ // profile saved before profiles existed
    s.settings.configured = true; s.settings.isTrainer = +s.settings.trainerPlus>0; s.settings.levelMode = 'manual';
  }
  if(!s.settings && SEED_SETTINGS) s.settings = SEED_SETTINGS;
  s.settings = Object.assign(PR.defaultSettings(), s.settings||{});
  if(s.settings.ctCodes==='DT_CT, DT_COMP, CT') s.settings.ctCodes='COMP';
  if(s.settings.trainingCodes==='DT_TRNG') s.settings.trainingCodes='DT_TRNG, CATR, CAB_K';
  if(s.settings.absenceCodes && !/\bSU\b/.test(s.settings.absenceCodes)) s.settings.absenceCodes = s.settings.absenceCodes.replace(/^U,/, 'U, SU,');
  if(!s.settings.v2slip){ s.settings.salesEstimate = 0; s.settings.v2slip = true; }
  s.slips = s.slips || {};
  if(!Object.keys(s.months).length && SEED){ s.months[key(SEED)] = SEED; s.current = key(SEED); }
  s.stale = [];
  s.raws = s.raws || {};
  for(const k of Object.keys(s.months)){
    const m = s.months[k];
    if(m.parser === PR.PARSER_V) continue;
    const raw = m.raw || (m.rawId && s.raws[m.rawId]);
    if(raw){ try{ storeRosters(s, PR.parseRosterAll(rawPages(raw)), raw, k); }catch(e){ console.warn("reparse", k, e); } }
    else if(!(SEED && k===key(SEED))) s.stale.push(k);
  }
  pruneRaws(s);
  salesFromSlips(s);
  if(!s.current || !s.months[s.current]) s.current = Object.keys(s.months).sort().pop();
  return s;
}
function rawPages(raw){ return raw.map(p=>({items:p.map(([x,y,str])=>({x,y,str}))})); }
// Save the months read from one roster PDF. A multi-month PDF keeps its text once (state.raws) and
// each month points to it; `only` re-reads just that month (other months may come from newer PDFs).
function storeRosters(s, list, raw, only){
  let id = null;
  if(list.length > 1){ id = 'r' + list[0].year + String(list[0].month).padStart(2,'0') + '-' + list.length + '-' + Date.now().toString(36); s.raws[id] = raw; }
  for(const ro of list){
    const k = key(ro);
    if(only){
      // a month-long PDF read before v8 may hold a whole period: also fill the months it covers that are missing
      if(k !== only && s.months[k]) continue;
    }
    if(id) ro.rawId = id; else ro.raw = raw;
    s.months[k] = ro;
    if(s.stale) s.stale = s.stale.filter(x=>x!==k);
  }
  return list.map(key);
}
function pruneRaws(s){
  const used = new Set(Object.values(s.months).map(m=>m.rawId).filter(Boolean));
  for(const id of Object.keys(s.raws||{})) if(!used.has(id)) delete s.raws[id];
}
// one-off payments («Pago único», 5196): typed by the user for a payslip, or read from the uploaded one
function isOneOff(l){ return l.code==='5196' || /pago [uú]nico|pago extraordinario|gratificaci/i.test(l.label||''); }
function oneOffOf(y,m){
  const k = y+'-'+String(m).padStart(2,'0'), ex = (state.extras[k]||{}).oneOff;
  if(ex!=null) return {v:+ex||0, manual:true};
  const sl = (state.slips||{})[k];
  const v = sl && sl.lines ? sl.lines.filter(l=>isOneOff(l) && !l.retro).reduce((a,l)=>a+(+l.dev||0),0) : 0;
  return {v: PR.r2(v), fromSlip: v>0};
}
// Sales commission read from an uploaded payslip (5128 «Comisión de Ventas»): it is paid with the
// month it belongs to in the «Retro» column (202608), or the month before the payslip. Fills that
// month only when the user hasn't typed a value.
function salesFromSlips(s){
  s.extras = s.extras || {};
  for(const [k, sl] of Object.entries(s.slips||{})){
    if(!sl || !sl.lines) continue;
    const [y,m] = k.split('-').map(Number), pk = prevKey(y,m), by = {};
    for(const l of sl.lines){
      if(!/comisi/i.test(l.label||'') && l.code!=='5128') continue;
      const mk = l.retro && /^\d{6}$/.test(l.retro) ? l.retro.slice(0,4)+'-'+l.retro.slice(4) : pk;
      by[mk] = PR.r2((by[mk]||0) + (+l.dev||0) - (+l.ded||0));
    }
    for(const [mk, v] of Object.entries(by)){
      const ex = s.extras[mk] = s.extras[mk] || {};
      if(ex.sales == null || ex.salesSlip) { ex.sales = v; ex.salesSlip = true; }
    }
  }
}
function salesInput(k, mName){
  const ex = state.extras[k]||{}, has = ex.sales!=null && ex.sales!=='', est = +state.settings.salesEstimate||0;
  const src = has && ex.salesSlip ? `<span class="src s-slip">✓ ${t('src_slip')}</span>`
    : has ? `<span class="src s-man">✎ ${t('src_manual')}</span>`
    : `<span class="src s-none">${est ? t('src_est',{v:eur.format(est)}) : t('src_none')}</span>`;
  return `<label class="salesm"><span>${t('salesMonth',{m:mName})}${src}</span><input type="text" inputmode="decimal" id="ms-${k}" data-msales="${k}" value="${has ? (ex.salesSlip ? n2.format(ex.sales) : ex.sales) : ''}" placeholder="0,00"></label>`;
}
function slipFor(c, s, y, m){ return PR.payslip(c, s, y, m, oneOffOf(y,m).v); }
function oneOffInput(y,m){
  const k = y+'-'+String(m).padStart(2,'0'), o = oneOffOf(y,m);
  const src = o.manual ? `<span class="src s-man">✎ ${t('src_manual')}</span>` : o.fromSlip ? `<span class="src s-slip">✓ ${t('src_slip')}</span>` : '';
  return `<label class="salesm"><span>${t('oneOffMonth',{m:monthName(y,m)})}${src}</span><input type="text" inputmode="decimal" id="mo-${k}" data-moneoff="${k}" value="${o.manual ? o.v : (o.v ? n2.format(o.v) : '')}" placeholder="0,00"></label>`;
}
function prevKey(y,m){ return m===1 ? (y-1)+'-12' : y+'-'+String(m-1).padStart(2,'0'); }
function save(){ try{ const {stale, ...keep} = state; localStorage.setItem(LS, JSON.stringify(keep)); }catch(e){} }
function key(r){ return r.year+'-'+String(r.month).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function render(){
  const keys = Object.keys(state.months).sort();
  const i = keys.indexOf(state.current);
  $('prevM').disabled = i<=0; $('nextM').disabled = i<0 || i>=keys.length-1;
  const ro = state.months[state.current];
  if(!ro){ renderSetup(); $('mLabel').textContent=t('noData'); $('hero').innerHTML=`<div class="panel"><div class="eyebrow">${t('startHere')}</div><p style="margin:8px 0 0">${t('startText')}</p></div>`; ['strip','legend','days','slip'].forEach(i=>$(i).innerHTML=''); renderForm(); renderStored(); return; }
  const s = state.settings;

  if(s.configured && ro.rankNorm && ro.rankNorm!==s.rank){

    w.innerHTML = `${t('rankWarn',{a:rankName(ro.rankNorm),b:rankName(s.rank)})} <button class="btn ghost" id="useRosterRank" type="button" style="margin-left:6px">${t('useRank',{a:rankName(ro.rankNorm)})}</button>`;
  } else w.hidden=true;

  const cPrev = roPrev ? PR.compute(roPrev, s, state.extras) : null;
  const slipNow = slipFor(cPrev, s, ro.year, ro.month);           // the payslip of this month
  const nx = ro.month===12 ? [ro.year+1,1] : [ro.year, ro.month+1];

  c._nextKey = nx[0]+'-'+String(nx[1]).padStart(2,'0');

  $('mLabel').textContent = mDate.toLocaleDateString(LOC,{month:'short',year:'numeric'}).replace('.','');
  renderHero(c, ro); renderStrip(c, ro); renderDays(c, ro); renderSlip(c, ro); renderForm(); renderStored();
  if(typeof renderToolbar==='function'){ renderToolbar(); if(['check','ftl','vac','year'].includes(toolOpen)) refreshTool(); }
}

function renderHero(c, ro){
  const [L1,L2] = c.rates.limits;
  const max = Math.max(L2+20, Math.ceil((c.T+10)/10)*10);
  const seg = (lo,hi,color) => { const w = Math.max(0, Math.min(c.T,hi)-lo)/max*100; return w>0?`<div class="gseg" style="width:${w}%;background:${color}"></div>`:''; };
  const tierNow = c.T>L2?3:c.T>L1?2:1;
  const nextMsg = tierNow===1 ? t('tier1Msg',{h:hhmm(L1-c.T)}) : tierNow===2 ? t('tier2Msg',{h:hhmm(L2-c.T)}) : t('tier3Msg');
  const dc = c.dietaCounts;
  const dietLine = ['intlNight','intlDay','natNight','natDay'].filter(k=>dc[k]).map(k=>t('dc_'+k,{n:dc[k]})).join(' · ') || t('noAway');
  const P = c._slipNow, N = c._slipNext, ok = c._prevLoaded;
  const mNow = monthName(ro.year, ro.month), mPrev = monthName(ro.year, ro.month-1), mNext = monthName(ro.year, ro.month+1);
  const slips = state.slips||{};
  const realNow = slips[key(ro)], realNext = slips[c._nextKey], pk = prevKey(ro.year, ro.month);
  const cmp = (calc, real) => { if(!real || real.net==null) return ''; const d = PR.r2(calc - real.net);
    return `<dt>${t('realSlip')}</dt><dd>${eur.format(real.net)}</dd><dt>${t('difference')}</dt><dd style="color:${Math.abs(d)<5?'var(--pay)':'var(--warn)'}">${d>0?'+':''}${eur.format(d)}</dd>`; };
  $('hero').innerHTML = `
  <div class="panel">
    <div class="eyebrow">${t('nextPayHead',{m:mNext})}</div>
    <div class="big num" style="color:var(--pay)">${eur.format(N.net)}</div>

function renderStrip(c, ro, stripId, legendId){
  const dows = [...Array(7)].map((_,i)=>new Date(2024,0,1+i).toLocaleDateString(LOC,{weekday:'narrow'}));
  const first = (new Date(ro.year, ro.month-1, 1).getDay()+6)%7;
  const today = todayISO();
  let h = dows.map(d=>`<div class="dow">${d}</div>`).join('') + '<div class="cell blank"></div>'.repeat(first);
  for(const d of c.days){
    const k = kind(d.kind);
    const code = d.kind==='flight' ? (d.legs.filter(l=>l.type==='flt').map(l=>l.arr).filter(a=>a!==d.startLoc).filter((v,i,a)=>a.indexOf(v)===i).slice(0,2).join(' ')||'FLT')
              : d.kind==='deadhead' ? 'DH '+(d.legs[0]?d.legs[d.legs.length-1].arr:'')
              : (d.label||'').replace(/^DT_/,'').replace(/^STBY_/,'SB ').replace('RESERVE72','RES');
    h += `<button class="cell${d.date===today?' today':''}" style="--kc:var(${k.c})" data-go="${d.date}" aria-label="${d.day}: ${esc(k.n)} ${d.total?eur.format(d.total):''}">
      <span class="d">${d.day}</span><span class="c">${esc(code)}</span>${d.total>0.005?`<span class="e">${eur0.format(d.total)}</span>`:''}</button>`;
  }
  $(stripId||'strip').innerHTML = h;
  const used = [...new Set(c.days.map(d=>d.kind))].filter(k=>k!=='empty');
  $(legendId||'legend').innerHTML = used.map(k=>`<span><i style="background:var(${kind(k).c})"></i>${kind(k).n}</span>`).join('');
}

const hm2 = h => { if(h==null) return ''; h=((h%24)+24)%24; return String(Math.floor(h)).padStart(2,'0')+':'+String(Math.round((h%1)*60)).padStart(2,'0'); };
function buyWhyText(d){

  if(d.autoBuy==='half') return w.start!=null && w.start>=16 ? t('buyHalfLate',{h:hm2(w.start)}) : t('buyHalfEarly',{h:hm2(w.end)});
  return t('buyFullWhy',{h:hm2(w.start)});

function renderSlip(c, ro){
  const s = state.settings, P = c._slipNext, v = P.v, R = c.rates;
  const mNow = monthName(ro.year, ro.month+1), mPrev = monthName(ro.year, ro.month);
  $('slipH').textContent = t('slipOf',{m:mNow});
  const rows = [];
  const add = (name, info, val, cls='') => rows.push(`<tr class="${cls}"><td>${name}</td><td>${info||''}</td><td>${val}</td></tr>`);
  const sec = (label, val) => rows.push(`<tr class="sec"><td>${label}</td><td></td><td>${val}</td></tr>`);
  sec(t('fixedOf',{m:mNow}), eur.format(P.fixed));
  add(t('slip_base',{r:rankName(s.rank),l:P.level}), s.contract!==100?s.contract+' %':'', eur.format(P.baseSalary));
  if(P.allowBase) add(t('slip_trainer'), '', eur.format(P.allowBase));
  if(P.uniform) add(t('slip_uniform'),'',eur.format(P.uniform));
  if(P.oneOff) add(t('slip_oneOff'),'',eur.format(P.oneOff));
  if(P.fiscalAid) add(t('slip_fiscalAid'),'',eur.format(P.fiscalAid));
  sec(t('variableOf',{p:mPrev}), eur.format(P.variable));
  const tn = ['<70','70–110','>110'];
  (v.tiers||[]).forEach(tr=>{ if(tr.h<=0) return;
    add(t('slip_fdp',{t:tn[tr.i]}), `${n2.format(tr.hF)} h × ${n2.format(tr.rateF)}`, eur.format(tr.payF));
    add(t('slip_add',{t:tn[tr.i]}), `${n2.format(tr.hA)} h × ${n2.format(tr.rateA)}`, eur.format(tr.payA)); });
  if(v.topUp) add(t('slip_min'),'',eur.format(v.topUp));
  if(v.trainPay) add(t('slip_trainer'), t('slip_trainerInfo',{n:v.trainDays,c:v.ctDays}), eur.format(v.trainPay));
  if(v.early) add('Early check-in', `${v.early/s.earlyCheckin} × ${s.earlyCheckin} €`, eur.format(v.early));
  if(v.extraFix) add(t('slip_buy'),'',eur.format(v.extraFix));
  if(v.sales) add(t('slip_sales'), v.salesFromDays?'':t('estimatedW'), eur.format(v.sales));
  const dc=v.dietaCounts||{};
  if(dc.intlNight) add(t('slip_intlNight'), `${dc.intlNight} × ${n2.format(PR.DIETA.intlNight)}`, eur.format(dc.intlNight*PR.DIETA.intlNight));
  if(dc.intlDay) add(t('slip_intlDay'), `${dc.intlDay} × ${n2.format(PR.DIETA.intlDay)}`, eur.format(dc.intlDay*PR.DIETA.intlDay));
  if(dc.natNight) add(t('slip_natNight'), `${dc.natNight} × ${n2.format(PR.DIETA.natNight)}`, eur.format(dc.natNight*PR.DIETA.natNight));
  if(dc.natDay) add(t('slip_natDay'), `${dc.natDay} × ${n2.format(PR.DIETA.natDay)}`, eur.format(dc.natDay*PR.DIETA.natDay));
  if(v.dietasPaid>v.dietas) add(t('slip_minDiet'),'',eur.format(v.dietasPaid-v.dietas));
  add(t('grossTotal'),'',eur.format(P.gross),'gross');
  add(t('slip_taxable'),'',eur.format(P.taxable),'info');
  add(t('slip_ss'), n2.format(s.ss)+' %', '−'+eur.format(P.ss), 'ded');
  add(t('slip_irpf'), n2.format(s.irpf)+' %', '−'+eur.format(P.irpf), 'ded');
  if(P.ingresoCta) add(t('slip_ingCta'), `${n2.format(P.fiscalAid)} × ${n2.format(s.irpf)} %`, '−'+eur.format(P.ingresoCta), 'ded');
  rows.push(`<tr class="sum"><td>${t('slip_net')}</td><td></td><td>${eur.format(P.net)}</td></tr>`);
  const real = (state.slips||{})[c._nextKey];
  if(real && real.net!=null){ const d=PR.r2(P.net-real.net);
    rows.push(`<tr><td>${t('realSlip')}</td><td></td><td>${eur.format(real.net)}</td></tr><tr><td>${t('difference')}</td><td></td><td style="color:${Math.abs(d)<5?'var(--pay)':'var(--warn)'}">${d>0?'+':''}${eur.format(d)}</td></tr>`); }
  $('slip').innerHTML = rows.join('');
  $('slipNote').innerHTML = t('slipNote2',{m:mNow,p:mPrev,f:R.fdp.map(x=>n2.format(x)).join(' / '),a:R.add.map(x=>n2.format(x)).join(' / ')});
}

function applyPayslip(p){
  const s = state.settings;
  if(!p.rank || p.level==null) return {html:t('e_noCat'), err:true};
  const pk = p.period ? p.period.year+'-'+String(p.period.month).padStart(2,'0') : '';
  const mes = p.period ? monthName(p.period.year,p.period.month,{month:'long',year:'numeric'}) : '';
  state.slips = state.slips||{};
  // an older payslip is only stored for the history; the contract data comes from the newest one
  const newest = Object.keys(state.slips).sort().pop();
  const older = s.configured && pk && newest && pk < newest;
  if(pk && p.net!=null){ state.slips[pk] = { net: p.net, lines: p.lines, totals: p.totals }; salesFromSlips(state); }
  if(older){ save(); render(); return {html: t('ps_saved',{m:mes})}; }
  s.rank = p.rank; s.level = p.level; s.contract = p.contract || 100;
  if(p.since){ s.levelMode='date'; s.since=p.since; } else s.levelMode='manual';

  s.isTrainer = p.trainerPlus >= (+s.tBase||270); s.isCT = !s.isTrainer && p.trainerPlus > 0;

  if(p.ss) s.ss = PR.r2(p.ss);
  s.configured = true; $('form').dataset.ready=''; save(); render();
  const expected = (PR.BASE[p.rank][p.level]||0) * s.contract/100;
  let html = t('ps_read',{m: mes?t('ps_of',{m:mes}):'', r: rankName(p.rank), l: p.level, c: s.contract!==100?t('ps_at',{c:s.contract}):'', irpf: n2.format(s.irpf),

  if(bad) html += ' <br>'+t('ps_mismatch',{a:eur.format(p.basePay),b:eur.format(expected)});

const PDFJS = './lib/';
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error(t('e_pdfLib'))); document.head.appendChild(s); }); }
async function readPdf(file){
  if(!window.pdfjsLib){ await loadScript(PDFJS+'pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS+'pdf.worker.min.js'; }
  const doc = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p); const tc=await pg.getTextContent(); const vp=pg.getViewport({scale:1});
    pages.push({items: tc.items.filter(i=>i.str&&i.str.trim()).map(it=>{ const m=pdfjsLib.Util.transform(vp.transform,it.transform); return {x:m[4],y:m[5],str:it.str}; })});
  }
  return pages;
}
function showMsg(html, err){ const m=$('importMsg'); m.hidden=false; m.className='msg'+(err?' err':''); m.innerHTML=html; }
async function importPdf(f){
  try{
    const pages = await readPdf(f);
    const slip = PR.parsePayslip(pages[0] ? pages[0].items : []);
    if(slip) return Object.assign({slip:true, period: slip.period}, applyPayslip(slip));
    if(!pages.some(p=>p.items.length)) return {html: t('e_image',{f:esc(f.name)}), err:true};

    const raw = pages.map(p => p.items.map(i => [Math.round(i.x*10)/10, Math.round(i.y*10)/10, i.str]));
    state.raws = state.raws || {};

    const ro = list[list.length-1];

      const flights = list.reduce((a,r)=>a+r.days.filter(d=>d.events.some(x=>x.type==='flt')).length, 0);
      return {html: t('importedMany',{n:list.length, a:monthName(list[0].year,list[0].month,{month:'long',year:'numeric'}), b:monthName(ro.year,ro.month,{month:'long',year:'numeric'}), f:flights})};

// ---- max FDP (EASA ORO.FTL.205) and commander's discretion ----
const hm2s = h => { const m = Math.round(((h%24)+24)%24*60); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
function fdpHtml(d, next){
  const ev = d.events||[], ciI = ev.map(e=>e.type).lastIndexOf('ci'), ci = ev[ciI];
  if(!ci || !ci.t1) return '';
  const after = ev.slice(ciI+1);                       // only this duty: legs after its check-in
  let legs = after.filter(e=>e.type==='flt'||e.type==='dh');
  // a duty that lands after midnight continues on the next day without a new check-in
  const closed = after.some(e=>e.type==='co');
  if(next && !closed){
    const nl = []; for(const e of (next.events||[])){ if(e.type==='ci' || e.type==='co') break; if(e.type==='flt'||e.type==='dh') nl.push(e); }
    legs = legs.concat(nl.map(e=>Object.assign({}, e, {_next:true})));
  }
  const sectors = legs.filter(e=>e.type==='flt').length;
  if(!sectors) return '';
  const toMin = x => Math.floor(+x/100)*60 + (+x%100);
  const st = ci.st || (legs[0] && legs[0].dep) || '';
  const startL = PR.localHour(d.date, ci.t1, st);
  const max = PR.maxFdp(startL, sectors), disc = max + 2;
  // scheduled FDP: check-in to the last on-block
  const last = legs[legs.length-1];
  let fdpMin = toMin(last.t2) - toMin(ci.t1) + (last._next ? 1440 : 0);
  if(!last._next && toMin(last.t2) < toMin(ci.t1)) fdpMin += 1440;
  const fdp = fdpMin/60;
  const cls = fdp > disc ? 'over' : fdp > max ? 'over' : '';
  const utcEnd = (toMin(ci.t1) + Math.round(disc*60)) % 1440;
  return `<div class="fdpl">
    <div>${t('fdp_lim',{m:hhmm(max),s:sectors,t:hm2s(startL),st:esc(st)})}</div>
    <div>${t('fdp_disc',{m:hhmm(disc),e:hm2s(startL+disc),u:hm2s(utcEnd/60)})}</div>
    <div class="${cls}">${t('fdp_now',{f:hhmm(fdp)})}${fdp>max?' · '+(fdp>disc?t('fdp_overDisc'):t('fdp_needDisc')):''}</div>
  </div>`;
}

// ---- sharing: the roster travels inside the link (after #), never through a server ----
const SHARE_BASE = 'https://atibalear.github.io/payroster/';
const b64u = bytes => { let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };

// v2: compact text (names table, short codes), deflate-raw, base64url, prefixed "2"
const KC2 = {flight:'F',deadhead:'D',training:'T',standby:'S',reserve:'R',ground:'G',off:'O',empty:'E',other:'X'};
const KC2R = Object.fromEntries(Object.entries(KC2).map(([k,v])=>[v,k]));
const clean = s => String(s||'').replace(/[~|\n;:,\/]/g,' ');
const shortName = n => { const [s,f] = n.split(',').map(x=>x.trim()); return s.split(' ')[0] + (f ? ' '+f[0]+'.' : ''); };
async function encodeShare2(ro, c, o){
  const me = (ro.crew||'').trim(), names = [], ni = n => { let i = names.indexOf(n); if(i<0){ names.push(n); i = names.length-1; } return i.toString(36); };
  const days = c.days.filter(d => d.date >= o.from && d.date <= o.to);
  const lines = days.map(d => {
    const legs = d.legs.map(l => (l.type==='dh'?'*':'') + clean(l.flight).replace(/^EW /,'').replace(/ /g,'') + l.dep + l.t1 + l.t2 + l.arr).join(',');
    let crew = '';
    if(o.crew !== 'none'){
      if(d.crewInherited) crew = '^';
      else crew = (d.crew||[]).map(l => { const li = d.legs.findIndex(x => x.flight===l.flight && x.dep===l.dep); return (li>=0 ? li : [clean(l.flight).replace(/^EW /,''), l.dep, l.arr].join('/')) + ':' +
        l.members.map(m => m.role + (m.name.trim()===me ? '@' : ni(o.crew==='short' ? shortName(m.name) : clean(m.name)))).join('.'); }).join(';');
    }
    return [KC2[d.kind]||'X', clean(d.label), d.ci||'', d.co||'', d.hotel||'', legs, crew].join('~').replace(/~+$/,'');
  });
  const head = ['3', ro.year, ro.month, o.name ? clean(me) : '', todayISO(), o.from, o.to, ro.base||state.settings.base||''].join('|');
  const txt = head + '\n' + lines.join('\n') + (names.length ? '\n#\n' + names.join('\n') : '');
  const raw = new TextEncoder().encode(txt);
  return '2'+b64u(fflate.deflateSync(raw, {level:9, mem:12}));   // strongest deflate: shortest link
}
function parseShare2(txt){
