<style>
/* Layout: duty-plan ledger — month figure + tier gauge on top, a NetLine-style day strip, then one row per day that opens into its pay breakdown. */
:root{

}

  --accent:#8fa6ff; --accent-soft:#232c55; --pay:#5fd3a2; --pay-soft:#163a2c; --warn:#f0b35e; --warn-soft:#3b2a12;
  --k-flight:#7f99ff; --k-dh:#5e6aa8; --k-train:#d9a520; --k-sby:#b583d9; --k-off:#3a4060; --k-ground:#5bb3c4; --map-sea:#081226; --map-sea2:#10203f; --map-sky:#1d3a6e; --ac-hi:#d6fff0; --ac-edge:#06281d; --map-land:#232a40; --map-border:#435073; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1220; --surface:#171b2d; --sunk:#1f2438; --ink:#e8eaf3; --muted:#9aa0b8; --line:#2b3150;
  --accent:#8fa6ff; --accent-soft:#232c55; --pay:#5fd3a2; --pay-soft:#163a2c; --warn:#f0b35e; --warn-soft:#3b2a12;
  --k-flight:#7f99ff; --k-dh:#5e6aa8; --k-train:#d9a520; --k-sby:#b583d9; --k-off:#3a4060; --k-ground:#5bb3c4; --map-sea:#081226; --map-sea2:#10203f; --map-sky:#1d3a6e; --ac-hi:#d6fff0; --ac-edge:#06281d; --map-land:#232a40; --map-border:#435073; color-scheme:dark }

*{box-sizing:border-box}

.td-sky .sky-lbl{position:relative;margin-top:10px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.td-sky .sky-big{position:relative;font:200 clamp(44px,15vw,64px)/1 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.03em;margin-top:2px;text-shadow:0 2px 16px rgba(0,0,0,.15)}
.td-sky .sky-arc{position:relative;display:block;width:100%;max-width:420px;height:auto;margin:4px auto 0}
html.glass .today{box-shadow:inset 0 1px 0 var(--glass-hi),var(--glass-shadow)}
.td-next{margin-top:14px}
.td-nx{display:grid;grid-template-columns:auto 1fr 10px;gap:10px;align-items:center;width:100%;text-align:left;background:var(--sunk);border:0;border-radius:14px;padding:10px 12px;margin-top:6px;color:var(--ink);font:inherit;cursor:pointer}
.td-nx .d{font-weight:700;text-transform:capitalize;white-space:nowrap}.td-nx .r{color:var(--muted);font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-nx .k{width:10px;height:10px;border-radius:50%}
html.glass .td-nx{background:var(--glass-in);border:1px solid var(--glass-brd)}
/* week route */
.weekstrip{position:relative;display:grid;grid-template-columns:repeat(7,1fr);padding:10px 4px 8px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
html.glass .weekstrip{background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(22px) saturate(1.8);-webkit-backdrop-filter:blur(22px) saturate(1.8);box-shadow:inset 0 1px 0 var(--glass-hi),var(--glass-shadow)}
.wr-line{position:absolute;left:calc(100%/14 + 4px);right:calc(100%/14 + 4px);top:37px;display:grid;grid-template-columns:repeat(6,1fr);pointer-events:none}
.wr-line i{height:2px;margin:0 9px;background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 7px);opacity:.45}
.wr-line i.on{background:#e8b41f;opacity:1;height:3px;border-radius:2px}
.wr{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;padding:0;min-width:0}
.wr .wl{height:13px;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--muted);max-width:100%;overflow:hidden}
.wr .wn{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;line-height:1;color:#fff;background:var(--k);border:2px solid var(--k)}
.wr .wn.fly{width:22px;height:22px;margin:-3px 0;background:#e8b41f;border-color:#e8b41f;color:#2a1d00;font-size:12px}
.wr .wn.off{background:var(--surface);border-color:var(--k-off)}
html.glass .wr .wn.off{background:transparent}
.wr .wn.none{background:transparent;border-color:transparent}
.wr .wd{display:flex;flex-direction:column;align-items:center;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;line-height:1.1;margin-top:2px}
.wr .wd b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.wr.now .wd b{color:var(--accent)}
.wr.now .wn{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--accent)}
html.glass .wr.now .wn{box-shadow:0 0 0 3px rgba(255,255,255,.6),0 0 0 5px var(--accent)}
/* boarding-pass stubs */
.stubs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 8px 16px;margin:0 -8px -10px;scrollbar-width:none;scroll-padding-left:8px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.stubs::-webkit-scrollbar{display:none}
.stub{flex:0 0 212px;width:212px;scroll-snap-align:start;display:flex;align-items:stretch;border:0;padding:0;border-radius:16px;background:var(--sunk);color:var(--ink);font:inherit;cursor:pointer;text-align:left;position:relative;overflow:hidden;max-width:230px}
html.glass .stub{background:var(--glass-in);box-shadow:inset 0 0 0 1px var(--glass-brd)}
.stub .sbd{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px;margin:6px;border-radius:12px;background:var(--k);color:#fff;min-width:52px}
.stub .sbd b{font-size:20px;line-height:1}.stub .sbd small{font-size:10.5px;font-weight:700;text-transform:uppercase;opacity:.9;margin-top:2px}
.stub .sbr{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 14px 8px 6px;min-width:0}
.stub .sbr b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stub .sbr small{font-size:12px;color:var(--muted)}

/* ===== day detail (modern) ===== */
:root{--card2:color-mix(in srgb,var(--accent) 5%,var(--surface));--card2-brd:color-mix(in srgb,var(--accent) 12%,transparent)}
html.glass{--card2:rgba(255,255,255,.72);--card2-brd:rgba(255,255,255,.9)}
@media (prefers-color-scheme: dark){ html:not([data-theme="light"]){--card2:color-mix(in srgb,var(--accent) 8%,var(--surface));--card2-brd:rgba(255,255,255,.07)} html.glass:not([data-theme="light"]){--card2:rgba(255,255,255,.06);--card2-brd:rgba(255,255,255,.10)} }
html[data-theme="dark"]{--card2:color-mix(in srgb,var(--accent) 8%,var(--surface));--card2-brd:rgba(255,255,255,.07)}
html.glass[data-theme="dark"]{--card2:rgba(255,255,255,.06);--card2-brd:rgba(255,255,255,.10)}
.detail.dx{padding:6px 10px 16px;gap:16px}
.dsec{display:grid;gap:8px}
.dsec .dh{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.dsec .dh button{font:600 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.dlegs{display:grid;gap:8px}
.dleg,.dtile,.dx .brk,.dx details.crewbox,.dx .extras{background:var(--card2);border:1px solid var(--card2-brd);border-radius:20px;box-shadow:0 1px 2px rgba(20,30,80,.05),0 6px 18px rgba(20,30,80,.05)}
.dleg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:12px 16px}
.dleg .ap b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.1}.dleg .ap small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dleg .ap.r{text-align:right}
.dleg .mid{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);min-width:90px}
.dleg .mid .ln{position:relative;width:100%;height:2px;margin:6px 0;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent) 20%,var(--accent) 80%,transparent);opacity:.5}
.dleg .mid .ln::after{content:'✈︎';position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:14px;color:var(--accent);opacity:1}
.dleg .mid .fn{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-size:12px}
.dleg.dh .ap b{color:var(--muted)}
.dtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dtile{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:3px}
.dtile.wide{grid-column:1/-1}
.dtile .k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dtile .k svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dtile .v{font-size:24px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.15}
.dtile .v small{font-size:13px;font-weight:600;color:var(--muted)}
.dtile .s{font-size:12px;color:var(--muted);line-height:1.3}
.dtile.ok .v{color:var(--pay)}.dtile.bad .v{color:var(--warn)}
.dbar{height:5px;border-radius:3px;background:color-mix(in srgb,var(--muted) 18%,transparent);overflow:hidden;margin:3px 0 2px}
.dbar i{display:block;height:100%;border-radius:3px;background:var(--pay)}
.dbar.soft i{background:var(--accent);opacity:.6}.dbar.bad i{background:var(--warn)}
.drow{flex-direction:row!important;align-items:center;justify-content:space-between;gap:10px}
.step{display:flex;align-items:center;gap:2px;background:color-mix(in srgb,var(--muted) 12%,transparent);border-radius:999px;padding:3px}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--accent);font:700 20px/1 var(--f-body);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.step input{width:46px;text-align:center;border:0!important;background:transparent!important;font:700 17px var(--f-body);color:var(--ink);padding:0!important;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step span{font-size:12px;color:var(--muted);margin-right:4px}
.dx details.crewbox{padding:12px 14px}
.dx details.crewbox > summary{list-style:none;cursor:pointer}.dx details.crewbox > summary::-webkit-details-marker{display:none}
.dx details.crewbox > summary .dh{padding:0}
.dx details.crewbox > summary .dh::after{content:'›';font-size:20px;transform:rotate(90deg);transition:transform .2s;color:var(--muted)}
.dx details.crewbox:not([open]) > summary .dh::after{transform:none}
.dx .crew{margin-top:10px}
.dx .crew .m{border-radius:999px;padding:4px 10px;background:color-mix(in srgb,var(--muted) 12%,transparent)}
.dx .crew .m.me{background:var(--accent-soft)}
.dx .brk{font-size:14px;gap:8px 12px;padding:14px 16px}
.dx .brk .t{font-size:16px;padding-top:8px}
.dx .brk dd.t{color:var(--pay)}
.dx .extras{padding:12px 14px}
.dx .how{padding:0 4px}

/* ===== bottom bar "F": month + three round buttons, all within thumb reach ===== */
.tabbar,html.glass .tabbar{left:max(12px, env(safe-area-inset-left, 0px));right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(8px + env(safe-area-inset-bottom, 0px));
  max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 6px 6px 8px;border-radius:32px;border:1px solid var(--line);background:var(--surface);box-shadow:0 10px 30px rgba(20,30,80,.16)}
html.glass .tabbar{border:1px solid var(--glass-brd);background:var(--glass);backdrop-filter:blur(26px) saturate(1.9);-webkit-backdrop-filter:blur(26px) saturate(1.9);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 34px rgba(20,30,80,.18)}
.tabbar .monthnav{display:flex;align-items:center;gap:0;min-width:0}
.tabbar .mlabel{font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;padding:0 2px}
.tabbar .monthnav .iconbtn{width:32px;height:40px;min-width:0;border:0;background:none;box-shadow:none;font-size:20px;color:var(--accent);padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
.tabbar .monthnav .iconbtn:disabled{opacity:.25}
.tabbar .tb{display:flex;gap:6px;flex:none}
.tabbar .tb button,html.glass .tabbar .tb button{flex:none;max-width:none;width:48px;height:48px;padding:0;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--muted);transition:background .2s,color .2s,transform .15s}
html.glass .tabbar .tb button{background:rgba(255,255,255,.55)}
@media (prefers-color-scheme: dark){ html.glass:not([data-theme="light"]) .tabbar .tb button{background:rgba(255,255,255,.08)} }
html.glass[data-theme="dark"] .tabbar .tb button{background:rgba(255,255,255,.08)}
.tabbar .tb button span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabbar .tb button svg{width:23px;height:23px}
.tabbar .tb button.on,html.glass .tabbar .tb button.on{background:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 40%,transparent)}
.tabbar .tb button:active{transform:scale(.92)}
.bar .brand{flex:1}

/* greeting header */
.hello{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hello .hl1{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden}
.hello .hl1 .brand{font-size:15px;margin:0;flex:none}
.hello .hl1 #hDate{text-transform:capitalize;overflow:hidden;text-overflow:ellipsis}
.hello .hl2{font:800 24px/1.15 -apple-system,"SF Pro Display",var(--f-display),system-ui,sans-serif;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello .hl2:empty{display:none}
/* the bar sits low, like the system tab bar */
.tabbar,html.glass .tabbar{bottom:calc(env(safe-area-inset-bottom, 0px) * .45 + 6px)}
html.glass .wrap,.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px) * .5)}

/* short pages (Tools) must still fill the whole screen, or iOS lifts the fixed bottom bar */
html{min-height:100%}
body{min-height:100vh;min-height:100lvh}
html.glass::before{bottom:auto;height:100vh;height:100lvh}

/* month picker */
.tabbar .mlabel{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border-radius:10px;padding:4px 6px}
.tabbar .mlabel:active{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.mpick{position:fixed;left:max(12px, env(safe-area-inset-left, 0px));bottom:calc(env(safe-area-inset-bottom, 0px) * .45 + 74px);z-index:40;width:min(330px, calc(100vw - 24px));max-height:55vh;overflow:auto;
  padding:12px;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 50px rgba(20,30,80,.25)}
html.glass .mpick{background:var(--glass);border-color:var(--glass-brd);backdrop-filter:blur(28px) saturate(1.9);-webkit-backdrop-filter:blur(28px) saturate(1.9)}
.mp-y{font-weight:800;font-size:15px;margin:4px 6px 6px}
.mp-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.mp-m{height:40px;border-radius:14px;border:0;font:600 14px var(--f-body);text-transform:capitalize;background:color-mix(in srgb,var(--muted) 12%,transparent);color:var(--ink);cursor:pointer}
.mp-m:disabled{opacity:.3;cursor:default;background:transparent}
.mp-m.now{box-shadow:inset 0 0 0 2px var(--accent)}
.mp-m.sel{background:var(--accent);color:#fff}

/* ===== "clay" 3D surfaces ===== */
:root{--clay:#f3f5fa;
  --clay-sh:inset 0 0 0 1px rgba(17,24,39,.05);
  --clay-sh-press:inset 0 0 0 1px rgba(17,24,39,.08);--glass-solid:#f3f5fa}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--clay:linear-gradient(180deg,#2c3456 0%,#1f2541 100%);
  --clay-sh:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.28),0 12px 24px -10px rgba(0,0,0,.7),0 2px 5px rgba(0,0,0,.3);
  --clay-sh-press:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.28),0 4px 10px -6px rgba(0,0,0,.6);--glass-solid:#12162a} }
:root[data-theme="dark"]{--clay:linear-gradient(180deg,#2c3456 0%,#1f2541 100%);
  --clay-sh:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.28),0 12px 24px -10px rgba(0,0,0,.7),0 2px 5px rgba(0,0,0,.3);
  --clay-sh-press:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.28),0 4px 10px -6px rgba(0,0,0,.6);--glass-solid:#12162a}
.dleg,.dtile,.dx .brk,.dx details.crewbox,.dx .extras,.td-st,.stub,.qa,.html-clay{background:var(--clay)!important;border:0!important;box-shadow:var(--clay-sh)!important}
.dleg,.dtile,.td-st,.stub,.qa{transition:transform .12s,box-shadow .12s}
.dleg:active,.stub:active,.qa:active{transform:translateY(1px) scale(.99);box-shadow:var(--clay-sh-press)!important}
.td-st.next{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff) 0%,var(--accent) 100%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18),0 12px 22px -8px color-mix(in srgb,var(--accent) 70%,transparent)!important}
.dleg{border-radius:22px}.dtile{border-radius:22px}
.dleg .ap .wx{display:block;font-size:12px;color:var(--muted);margin-top:1px}
/* earnings with icons */
.dx .brk dt{display:flex;gap:8px;align-items:flex-start}
.dx .brk .ei{font-style:normal;width:26px;height:26px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:14px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
/* crew, organised */
.dx .crew .leg{display:grid;gap:6px;margin-top:6px}
.dx .crew .lh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.dx .crew .lh .fno{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.dx .crew .mem{display:grid;grid-template-columns:1fr;gap:2px}
.dx .crew .cm{display:flex;align-items:center;gap:10px;padding:6px 6px;border-radius:12px}
.dx .crew .cm.me{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.dx .crew .rb{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 11px var(--f-body);color:#fff;letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 3px 8px -3px rgba(0,0,0,.35)}
.dx .crew .rb.ck{background:linear-gradient(180deg,#3b4468,#1f2540)}
.dx .crew .rb.pu{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent))}
.dx .crew .rb.st{background:linear-gradient(180deg,#2ec4a4,#16967c)}
.dx .crew .cn{font-size:15px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dx .crew .you{margin-left:auto;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.dx .crew .m{display:none}
/* quick actions on the duty card */
.qas{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;margin-top:14px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 4px 9px;border-radius:18px;font:600 12px var(--f-body);color:var(--ink);cursor:pointer;min-width:0}
.qa .qi{font-size:20px;line-height:1}
.qa span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qa.on{color:var(--accent);box-shadow:var(--clay-sh-press),inset 0 0 0 2px var(--accent)!important}
.qpanel{margin-top:10px}.qpanel.dx{padding:0}.qpanel.dx details.crewbox > summary{pointer-events:none}.qpanel.dx details.crewbox > summary .dh::after{display:none}
.qpanel[hidden]{display:none}
.td-hint{margin-top:10px;text-align:center;font-size:11.5px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:90;padding:10px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;transition:all .2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dleg.live{box-shadow:var(--clay-sh),inset 0 0 0 2px #e8b41f!important}
.dleg.past{opacity:.5}
/* long-press sheet */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(10,14,30,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:fixed;left:max(10px, env(safe-area-inset-left, 0px));right:max(10px, env(safe-area-inset-right, 0px));bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:81;max-width:520px;margin:0 auto;
  padding:10px;border-radius:28px;background:var(--surface);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:sheetUp .22s ease-out}
html.glass .sheet{background:var(--glass);backdrop-filter:blur(30px) saturate(1.9);-webkit-backdrop-filter:blur(30px) saturate(1.9);border:1px solid var(--glass-brd)}
.sheet .sh-t{padding:8px 12px 10px;font-weight:800;font-size:16px}.sheet .sh-t small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.sheet button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-radius:16px;background:none;color:var(--ink);font:600 15.5px var(--f-body);text-align:left;cursor:pointer}
.sheet button:active{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.sheet button i{font-style:normal;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--clay);box-shadow:var(--clay-sh);font-size:17px}
.sheet .sh-x{justify-content:center;margin-top:4px;background:color-mix(in srgb,var(--muted) 12%,transparent)}

<script>
const SEED = /*DATA*/;
const SEED_SETTINGS = /*SETTINGS*/;
const APP_VERSION = '/*VERSION*/';
const IS_PWA_BUILD = /*PWA*/;
const LS = 'payroster.v1';
const KC = { sick:'--warn', flight:'--k-flight', deadhead:'--k-dh', training:'--k-train', standby:'--k-sby', reserve:'--k-sby', ground:'--k-ground', off:'--k-off', empty:'--k-off', other:'--k-ground' };
const kind = k => ({ n: t('k_'+(KC[k]?k:'other')), c: KC[k]||KC.other });
const LANGS = Object.keys(I18N.names);
let lang = 'es', LOC = 'es-ES', eur, eur0, n2;
function setLang(l){
  lang = LANGS.includes(l) ? l : 'es'; LOC = I18N.locales[lang];
  // 'always' so Spanish shows 3.044,40 like the payslip (CLDR would print 3044,40)
  eur = new Intl.NumberFormat(LOC,{style:'currency',currency:'EUR',useGrouping:'always'});
  eur0 = new Intl.NumberFormat(LOC,{style:'currency',currency:'EUR',maximumFractionDigits:0,useGrouping:'always'});
  eur = privMask(eur); eur0 = privMask(eur0);
  n2 = new Intl.NumberFormat(LOC,{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.innerHTML=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
}
function t(k, v){
  let s = (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : (I18N.es[k] != null ? I18N.es[k] : k);
  if(v) s = s.replace(/\{(\w+)\}/g, (m,x) => v[x] != null ? v[x] : m);
  return s;
}
function detectLang(){ const n=(navigator.language||'').slice(0,2).toLowerCase(); return LANGS.includes(n) ? n : 'en'; }
const rankName = r => t(r==='PU'?'rankPU':'rankCA');
const monthName = (y,m,opt) => new Date(y,m-1,1).toLocaleDateString(LOC, opt||{month:'long'});
const langSelect = id => `<label>${t('f_lang')}<select id="${id}">${LANGS.map(l=>`<option value="${l}"${l===lang?' selected':''}>${I18N.names[l]}</option>`).join('')}</select></label>`;
const hhmm = h => { const m = Math.round(h*60); return Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); };
const t4 = t => t ? t.slice(0,2)+':'+t.slice(2) : '';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = load();
save();   // keep months re-read by a newer parser
let _tab0 = 'roster'; try{ _tab0 = sessionStorage.getItem('pr.tab') || 'roster'; }catch(e){}
setTab(_tab0);
document.body.classList.toggle('priv', PRIV);
setLang(state.lang || detectLang());
function load(from){
  let s=null; if(from) s = from; else try{ s = JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){}
  if(!from) window.__prLoadedAt = (s && s.savedAt) || 0;
  if(!s || !s.months) s = { months:{}, extras:{}, settings: (s && s.settings) || SEED_SETTINGS || PR.defaultSettings(), current:null, example:true, lang: s && s.lang };
  if(s.settings && s.settings.configured===undefined){ // profile saved before profiles existed
    s.settings.configured = true; s.settings.isTrainer = +s.settings.trainerPlus>0; s.settings.levelMode = 'manual';
  }
  if(!s.settings && SEED_SETTINGS) s.settings = SEED_SETTINGS;
  s.settings = Object.assign(PR.defaultSettings(), s.settings||{});
  if(s.settings.ctCodes==='DT_CT, DT_COMP, CT') s.settings.ctCodes='COMP';
  if(s.settings.trainingCodes==='DT_TRNG') s.settings.trainingCodes='DT_TRNG, CATR, CAB_K';
  if(s.settings.absenceCodes && !/\bSU\b/.test(s.settings.absenceCodes)) s.settings.absenceCodes = s.settings.absenceCodes.replace(/^U,/, 'U, SU,');
  // months saved before rosters knew their last day: a month whose days stop early is a partial tail
  for(const m of Object.values(s.months||{})){ if(!m || !m.days || !m.days.length || m.to || m.keptBefore) continue;
    const dim = new Date(Date.UTC(m.year, m.month, 0)).getUTCDate(), mx = Math.max(...m.days.map(d => d.day));
    if(mx < dim && m.days.length === mx - (m.from||1) + 1) m.to = mx; }
  // never open on a month that is only the tail of the previous roster (1 Jan in a December plan)
  if(s.current && s.months && s.months[s.current] && s.months[s.current].to){
    const ks = Object.keys(s.months).sort().filter(k => !s.months[k].to && k < s.current); if(ks.length) s.current = ks[ks.length-1]; }
  if(!s.settings.v2slip){ s.settings.salesEstimate = 0; s.settings.v2slip = true; }
  s.slips = s.slips || {};
  if(!Object.keys(s.months).length && SEED){ s.months[key(SEED)] = SEED; s.current = key(SEED); }
  s.stale = [];
  s.raws = s.raws || {};
  for(const k of Object.keys(s.months)){
    const m = s.months[k];
    if(m.parser === PR.PARSER_V) continue;
    const raw = m.raw || (m.rawId && s.raws[m.rawId]);
    if(raw){ try{ const lst = PR.parseRosterAll(rawPages(raw)); storeRosters(s, lst, raw, k); const lr = lst[lst.length-1]; mergeChecks(s, lr.checks, key(lr)); }catch(e){ console.warn("reparse", k, e); } }
    else if(!(SEED && k===key(SEED))) s.stale.push(k);
  }
  try{ fillFromRaws(s); }catch(e){ console.warn('fill', e); }
  pruneRaws(s);
  salesFromSlips(s);
  if(!s.current || !s.months[s.current]) s.current = Object.keys(s.months).sort().pop();
  return s;
}
function rawPages(raw){ return raw.map(p=>({items:p.map(([x,y,str])=>({x,y,str}))})); }
// Save the months read from one roster PDF. A multi-month PDF keeps its text once (state.raws) and
// each month points to it; `only` re-reads just that month (other months may come from newer PDFs).
// privacy: hide every amount of money (people nearby). Remembered on this device.
var PRIV = false; try{ PRIV = localStorage.getItem('pr.priv') === '1'; }catch(e){}
function privMask(f){
  const real = f.format.bind(f);
  return { format: v => PRIV ? '••••• €' : real(v), resolvedOptions: () => f.resolvedOptions(), formatToParts: v => f.formatToParts(v) };
}
function setPriv(on){
  PRIV = on; try{ localStorage.setItem('pr.priv', on ? '1' : '0'); }catch(e){}
  document.body.classList.toggle('priv', on);
  document.querySelectorAll('.privbtn').forEach(b => { b.innerHTML = privIcon(); b.setAttribute('aria-pressed', on ? 'true' : 'false'); b.title = t(on ? 'priv_show' : 'priv_hide'); });
  render(); if(typeof refreshTool === 'function') refreshTool();
}
const privIcon = () => PRIV
  ? '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c5.5 0 9 5.5 9 7 0 .7-.8 2.2-2.2 3.7M6.5 6.6C4.3 8 3 10.7 3 12c0 1.5 3.5 7 9 7 1.8 0 3.4-.6 4.7-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'
  : '<svg viewBox="0 0 24 24"><path d="M3 12c0-1.5 3.5-7 9-7s9 5.5 9 7-3.5 7-9 7-9-5.5-9-7z"/><circle cx="12" cy="12" r="3"/></svg>';
// A roster downloaded mid-month ("Period: 09Nov26 - …") only covers the days from that date on.
// Keep the days already flown/worked from the copy we had, instead of wiping them.
function mergeEarlier(ro, old){
  if(!old || !old.days || !(ro.from > 1)) return false;
  const keep = old.days.filter(d => d.day < ro.from && ((d.events||[]).length || d.dt || d.hotel));
  if(!keep.length) return false;

// Everything is kept twice on this device: localStorage (fast, but ~5 MB on iPhone) and IndexedDB

function idbOpen(){

function renderSlip(c, ro){
  const s = state.settings, P = c._slipNext, v = P.v, R = c.rates;
  const mNow = monthName(ro.year, ro.month+1), mPrev = monthName(ro.year, ro.month);
  $('slipH').textContent = t('slipOf',{m:mNow});
  const rows = [];
  const add = (name, info, val, cls='') => rows.push(`<tr class="${cls}"><td>${name}</td><td>${info||''}</td><td>${val}</td></tr>`);
  const sec = (label, val) => rows.push(`<tr class="sec"><td>${label}</td><td></td><td>${val}</td></tr>`);
  sec(t('fixedOf',{m:mNow}), eur.format(P.fixed));
  add(t('slip_base',{r:rankName(s.rank),l:P.level}), s.contract!==100?s.contract+' %':'', eur.format(P.baseSalary));
  if(P.allowBase) add(t('slip_trainer'), '', eur.format(P.allowBase));
  if(P.uniform) add(t('slip_uniform'),'',eur.format(P.uniform));
  if(P.oneOff) add(t('slip_oneOff'),'',eur.format(P.oneOff));
  if(P.lumpSum) add(t('slip_lump'), s.contract!==100?s.contract+' %':'', eur.format(P.lumpSum));
  if(P.fiscalAid) add(t('slip_fiscalAid'),'',eur.format(P.fiscalAid));
  sec(t('variableOf',{p:mPrev}), eur.format(P.variable));
  const tn = ['<70','70–110','>110'];
  (v.tiers||[]).forEach(tr=>{ if(tr.h<=0) return;
    add(t('slip_fdp',{t:tn[tr.i]}), `${n2.format(tr.hF)} h × ${n2.format(tr.rateF)}`, eur.format(tr.payF));
    add(t('slip_add',{t:tn[tr.i]}), `${n2.format(tr.hA)} h × ${n2.format(tr.rateA)}`, eur.format(tr.payA)); });
  if(v.topUp) add(t('slip_min'),'',eur.format(v.topUp));
  if(v.trainPay) add(t('slip_trainer'), t('slip_trainerInfo',{n:v.trainDays,c:v.ctDays}), eur.format(v.trainPay));
  if(v.early) add('Early check-in', `${v.early/s.earlyCheckin} × ${s.earlyCheckin} €`, eur.format(v.early));
  if(v.extraFix) add(t('slip_buy'),'',eur.format(v.extraFix));
  if(v.sales) add(t('slip_sales'), v.salesFromDays?'':t('estimatedW'), eur.format(v.sales));
  const dc=v.dietaCounts||{};
  if(dc.intlNight) add(t('slip_intlNight'), `${dc.intlNight} × ${n2.format(PR.DIETA.intlNight)}`, eur.format(dc.intlNight*PR.DIETA.intlNight));
  if(dc.intlDay) add(t('slip_intlDay'), `${dc.intlDay} × ${n2.format(PR.DIETA.intlDay)}`, eur.format(dc.intlDay*PR.DIETA.intlDay));
  if(dc.natNight) add(t('slip_natNight'), `${dc.natNight} × ${n2.format(PR.DIETA.natNight)}`, eur.format(dc.natNight*PR.DIETA.natNight));
  if(dc.natDay) add(t('slip_natDay'), `${dc.natDay} × ${n2.format(PR.DIETA.natDay)}`, eur.format(dc.natDay*PR.DIETA.natDay));
  if(v.dietasPaid>v.dietas) add(t('slip_minDiet'),'',eur.format(v.dietasPaid-v.dietas));
  add(t('grossTotal'),'',eur.format(P.gross),'gross');
  add(t('slip_taxable'),'',eur.format(P.taxable),'info');
  add(t('slip_ss'), n2.format(s.ss)+' %', '−'+eur.format(P.ss), 'ded');
  add(t('slip_irpf'), n2.format(s.irpf)+' %', '−'+eur.format(P.irpf), 'ded');
  if(P.ingresoCta) add(t('slip_ingCta'), `${n2.format(P.fiscalAid)} × ${n2.format(s.irpf)} %`, '−'+eur.format(P.ingresoCta), 'ded');
  rows.push(`<tr class="sum"><td>${t('slip_net')}</td><td></td><td>${eur.format(P.net)}</td></tr>`);
  const real = (state.slips||{})[c._nextKey];
  if(real && real.net!=null){ const d=PR.r2(P.net-real.net);
    rows.push(`<tr><td>${t('realSlip')}</td><td></td><td>${eur.format(real.net)}</td></tr><tr><td>${t('difference')}</td><td></td><td style="color:${Math.abs(d)<5?'var(--pay)':'var(--warn)'}">${d>0?'+':''}${eur.format(d)}</td></tr>`); }
  $('slip').innerHTML = rows.join('');
  $('slipNote').innerHTML = t('slipNote2',{m:mNow,p:mPrev,f:R.fdp.map(x=>n2.format(x)).join(' / '),a:R.add.map(x=>n2.format(x)).join(' / ')});
}

function applyPayslip(p){
  const s = state.settings;
  if(!p.rank || p.level==null) return {html:t('e_noCat'), err:true};
  const pk = p.period ? p.period.year+'-'+String(p.period.month).padStart(2,'0') : '';
  const mes = p.period ? monthName(p.period.year,p.period.month,{month:'long',year:'numeric'}) : '';
  state.slips = state.slips||{};
  // an older payslip is only stored for the history; the contract data comes from the newest one
  const newest = Object.keys(state.slips).sort().pop();
  const older = s.configured && pk && newest && pk < newest;
  if(pk && p.net!=null){ state.slips[pk] = { net: p.net, lines: p.lines, totals: p.totals }; salesFromSlips(state); }
  if(older){ save(); render(); return {html: t('ps_saved',{m:mes})}; }
  s.rank = p.rank; s.level = p.level; s.contract = p.contract || 100;
  if(p.since){ s.levelMode='date'; s.since=p.since; } else s.levelMode='manual';
  // concept 1046 «Formación de cabina»: 270 € or more = trainer, 80–269 € = competence team only
  s.isTrainer = p.trainerPlus >= (+s.tBase||270); s.isCT = !s.isTrainer && p.trainerPlus > 0;
  if(p.uniform) s.uniform = p.uniform;
  if(p.irpf!=null) s.irpf = p.irpf;
  if(p.joined) s.joined = p.joined;
  if(p.ss) s.ss = PR.r2(p.ss);
  s.configured = true; $('form').dataset.ready=''; save(); render();
  const expected = (PR.baseTab(p.rank, pk ? +pk.slice(0,4) : 2026, s)[p.level]||0) * s.contract/100;
  let html = t('ps_read',{m: mes?t('ps_of',{m:mes}):'', r: rankName(p.rank), l: p.level, c: s.contract!==100?t('ps_at',{c:s.contract}):'', irpf: n2.format(s.irpf),
    t: s.isTrainer?t('ps_trainer'):(s.isCT?t('ps_ct'):''), n: p.nextIncrease?t('ps_next',{d:new Date(p.nextIncrease+'T12:00').toLocaleDateString(LOC)}):''});
  const bad = p.basePay && Math.abs(p.basePay-expected)>1;
  if(bad) html += ' <br>'+t('ps_mismatch',{a:eur.format(p.basePay),b:eur.format(expected)});
  if(pk && p.net!=null) html += ' '+t('ps_saved',{m:mes});
  if(!Object.keys(state.months).length) html += ' '+t('ps_nowRoster');
  return {html, err:bad};
}
function saveSetup(){
  const s = state.settings, v = id => $(id).value;
  const rank = v('p-rank'), pay = parseFloat(String(v('p-basepay')).replace(',','.')), inc = v('p-inc'), lv = v('p-level');
  const table = PR.baseTab(rank, new Date().getFullYear(), s);
  if(pay && inc){
    const full = pay / ((+v('p-contract')||100)/100); let level = table.findIndex(x=>x!=null && Math.abs(x-full)<0.5);
    if(level<0){ $('p-err').textContent = t('e_notInTable',{v:n2.format(pay),r:rankName(rank)}); return; }
    const d = new Date(inc+'T12:00'); d.setFullYear(d.getFullYear()-level);
    s.levelMode='date'; s.since = d.toISOString().slice(0,10); s.level = level;
  } else if(lv!==''){ s.levelMode='manual'; s.level=+lv; s.since=''; }
  else { $('p-err').textContent = t('e_fill'); return; }
  s.rank = rank; s.irpf = parseFloat(String(v('p-irpf')).replace(',','.'))||0; s.contract = +v('p-contract');
  s.isTrainer = $('p-trainer').checked; s.isCT = $('p-ct').checked;
  if(v('p-joined')) s.joined = v('p-joined');
  s.configured = true; $('form').dataset.ready=''; save(); render();
}

async function ocrCanvas(canvas){
  if(!window.Tesseract) await loadScript(TESS+'tesseract.min.js');
  if(!ocrWorker) ocrWorker = await Tesseract.createWorker('spa', 1, { workerPath: TESS+'worker.min.js' });
  const r = await ocrWorker.recognize(canvas, {}, {blocks:true});
  const words = [];
  for(const b of r.data.blocks||[]) for(const p of b.paragraphs) for(const l of p.lines) for(const w of l.words)
    words.push({t:w.text, x0:w.bbox.x0, y0:w.bbox.y0, x1:w.bbox.x1, y1:w.bbox.y1});
  return words;
}
const OCR_W = 2250;   // the payslip screenshots read best at about twice their size
async function pdfPageCanvas(file){
  await loadPdfLib();
  const doc = await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pg = await doc.getPage(1), vp0 = pg.getViewport({scale:1}), vp = pg.getViewport({scale: OCR_W/vp0.width});
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);

}
async function imageCanvas(file){

// ---- max FDP (EASA ORO.FTL.205) and commander's discretion ----
const hm2s = h => { const m = Math.round(((h%24)+24)%24*60); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
function fdpHtml(d, next){
  const ev = d.events||[], ciI = ev.map(e=>e.type).lastIndexOf('ci'), ci = ev[ciI];
  if(!ci || !ci.t1) return '';
  const after = ev.slice(ciI+1);                       // only this duty: legs after its check-in
  let legs = after.filter(e=>e.type==='flt'||e.type==='dh');
  // a duty that lands after midnight continues on the next day without a new check-in
  const closed = after.some(e=>e.type==='co');
  if(next && !closed){
    const nl = []; for(const e of (next.events||[])){ if(e.type==='ci' || e.type==='co') break; if(e.type==='flt'||e.type==='dh') nl.push(e); }
    legs = legs.concat(nl.map(e=>Object.assign({}, e, {_next:true})));
  }
  const sectors = legs.filter(e=>e.type==='flt').length;
  if(!sectors) return '';
  const toMin = x => Math.floor(+x/100)*60 + (+x%100);
  const st = ci.st || (legs[0] && legs[0].dep) || '';
  const startL = PR.localHour(d.date, ci.t1, st);
  const max = PR.maxFdp(startL, sectors), disc = max + 2;
  // scheduled FDP: check-in to the last on-block
  const last = legs[legs.length-1];
  let fdpMin = toMin(last.t2) - toMin(ci.t1) + (last._next ? 1440 : 0);
  if(!last._next && toMin(last.t2) < toMin(ci.t1)) fdpMin += 1440;
  const fdp = fdpMin/60;
  const cls = fdp > disc ? 'over' : fdp > max ? 'over' : '';
  const utcEnd = (toMin(ci.t1) + Math.round(disc*60)) % 1440;
  fdpHtml.last = { max, disc, fdp, sectors, startL, st, discEnd: hm2s(startL+disc) };
  return `<div class="fdpl">
    <div>${t('fdp_lim',{m:hhmm(max),s:sectors,t:hm2s(startL),st:esc(st)})}</div>
    <div>${t('fdp_disc',{m:hhmm(disc),e:hm2s(startL+disc),u:hm2s(utcEnd/60)})}</div>
    <div class="${cls}">${t('fdp_now',{f:hhmm(fdp)})}${fdp>max?' · '+(fdp>disc?t('fdp_overDisc'):t('fdp_needDisc')):''}</div>
  </div>`;
}

async function encodeShare(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){ try{ return 'z'+b64u(await pipe(raw, CompressionStream, 'deflate-raw')); }catch(e){} }
  return 'j'+b64u(raw);
}
async function decodeShare(str){
  if(str[0]==='2' || str[0]==='3'){ const b = unb64u(str.slice(1)); const raw = str[0]==='2' ? fflate.inflateSync(b) : b; return parseShare2(new TextDecoder().decode(raw)); }
  const kind = str[0], bytes = unb64u(str.slice(1));
  const raw = kind==='z' ? await pipe(bytes, DecompressionStream, 'deflate-raw') : bytes;
  return JSON.parse(new TextDecoder().decode(raw));
}
function sharePayload(ro, c, o){
  const days = c.days.filter(d => d.date >= o.from && d.date <= o.to);
  return { v:1, y:ro.year, m:ro.month, n: o.name ? (ro.crew||'') : '', at: todayISO(), from:o.from, to:o.to,
    d: days.map(d => [d.day, d.kind, d.label||'', d.ci||'', d.co||'', d.hotel||'', d.startLoc||'',
      d.legs.map(l=>[l.flight, l.dep, l.t1, l.t2, l.arr, l.type==='dh'?1:0]),
      o.crew && !d.crewInherited ? (d.crew||[]).map(l=>[l.flight, l.dep, l.arr, l.members.map(m=>m.role+'|'+m.name)]) : 0,
      o.crew && d.crewInherited ? 1 : 0 ]) };
}
function unpackDays(p){
  let last = [];
  return p.d.map(a => {
    const [day, kindK, label, ci, co, hotel, startLoc, legs, crew, inh] = a;
    const lg = legs.map(x=>({type:x[5]?'dh':'flt', flight:x[0], dep:x[1], t1:x[2], t2:x[3], arr:x[4]}));
    let cr = crew ? crew.map(x=>({flight:x[0], dep:x[1], arr:x[2], members:x[3].map(s=>{const i=s.indexOf('|'); return {role:s.slice(0,i), name:s.slice(i+1)};})})) : [];
    if(cr.length) last = cr; else if(inh) cr = last;
    const date = `${p.y}-${String(p.m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    return { day, date, kind:kindK, label, ci, co, hotel, startLoc, legs:lg, crew:cr, crewInherited:!!inh, gcrew:[], total:0,
      route: lg.length ? [lg[0].dep, ...lg.map(l=>l.arr)].join('–') : '' };
  });
}
let shareOpts = null;
function renderSharePanel(){
  const ro = state.months[state.current]; if(!ro) return;
  const last = `${ro.year}-${String(ro.month).padStart(2,'0')}-${String(ro.days.length).padStart(2,'0')}`;
  const first = `${ro.year}-${String(ro.month).padStart(2,'0')}-01`;
  if(!shareOpts || shareOpts.key!==state.current) shareOpts = { key:state.current, name:false, crew:'short', from:first, to:last };
  const o = shareOpts;
  $('sharePanel').innerHTML = `<div class="h2row"><h2 style="margin:0">${t('share_title',{m:monthName(ro.year,ro.month,{month:'long',year:'numeric'})})}</h2><button class="btn ghost" id="shareClose" type="button">${t('share_close')}</button></div>
    <p class="note">${t('share_note')}</p>
    <p class="note">${t('unofficial')}</p>
    <div class="opts">
      <label><input type="checkbox" id="sh-name"${o.name?' checked':''}> ${t('share_name')}</label>
      <label>${t('crewT')} <select id="sh-crew"><option value="short"${o.crew==='short'?' selected':''}>${t('share_crewShort')}</option><option value="full"${o.crew==='full'?' selected':''}>${t('share_crewFull')}</option><option value="none"${o.crew==='none'?' selected':''}>${t('share_crewNone')}</option></select></label>
      <label>${t('share_from')} <input type="date" id="sh-from" min="${first}" max="${last}" value="${o.from}"></label>
      <label>${t('share_to')} <input type="date" id="sh-to" min="${first}" max="${last}" value="${o.to}"></label>
    </div>
    <div><button class="btn" id="sh-make" type="button">${t('share_make')}</button></div>
    <div id="sh-out"></div>`;
}
async function makeShare(){
  const ro = state.months[state.current]; const o = shareOpts;
  o.name = $('sh-name').checked; o.crew = $('sh-crew').value; o.from = $('sh-from').value || o.from; o.to = $('sh-to').value || o.to;
  if(o.to < o.from) [o.from, o.to] = [o.to, o.from];
  const c = PR.compute(ro, state.settings, state.extras);
  const url = SHARE_BASE + '#s=' + await encodeShare2(ro, c, o);
  let qrSvg = '';
  try{ const q = qrcode(0, 'L'); q.addData(url); q.make(); qrSvg = q.createSvgTag({cellSize:4, margin:2, scalable:true}); }catch(e){ qrSvg = ''; }
  $('sh-out').innerHTML = `<div class="qrbox">${qrSvg?`<div class="qr">${qrSvg}</div>`:`<p class="msg err" style="margin:0">${t('share_toolong')}</p>`}
    <div class="linkcol"><textarea id="sh-url" readonly>${esc(url)}</textarea>
      <div class="row"><button class="btn" id="sh-copy" type="button">${t('share_copy')}</button>${navigator.share?`<button class="btn ghost" id="sh-send" type="button">${t('share_send')}</button>`:''}<span id="sh-msg" class="note"></span></div><span class="note">${t('share_len',{n:url.length})}</span></div></div>`;
}

// ---- viewer (someone opened a shared link) ----
let viewerData = null, viewerStr = '';
async function openViewer(str){
  viewerStr = str;
  try{ viewerData = await decodeShare(str); }catch(e){ viewerData = null; }
  document.body.classList.add('viewer');
  const v = $('viewer'); v.hidden = false;
  if(!viewerData){ v.innerHTML = `<div class="panel"><p>${t('v_bad')}</p><button class="btn ghost" id="v-mine" type="button">${t('v_mine')}</button></div>`; return; }
  const p = viewerData, days = p.v===2 ? p.days : unpackDays(p);
  const saved = !!(state.shared||{})[viewerKey()];
  v.innerHTML = `<div class="panel">
      <div class="eyebrow">${t('v_title')}</div>
      <h2 style="margin:4px 0;text-transform:capitalize">${monthName(p.y,p.m,{month:'long',year:'numeric'})}${p.n?` · <span style="text-transform:none">${t('v_by',{n:esc(p.n)})}</span>`:''}</h2>
      <div class="note">${t('v_sharedOn',{d:esc(p.at)})}</div>
      <div class="row" style="margin-top:10px"><button class="btn" id="v-save" type="button"${saved?' disabled':''}>${saved?t('v_saved'):t('v_save')}</button><button class="btn ghost" id="v-mine" type="button">${t('v_mine')}</button></div>
    </div>
    <section style="margin-top:14px"><div class="strip" id="vstrip"></div><div class="legend" id="vlegend"></div></section>
    <div class="days" style="margin-top:14px">${days.filter(d=>d.kind!=='empty').map(d=>{
      const k = kind(d.kind), wd = new Date(d.date+'T12:00').toLocaleDateString(LOC,{weekday:'short'}).replace('.','');
      const times = d.ci ? `${t4(d.ci)}${d.co?'–'+t4(d.co):''}` : '';
      const legs = d.legs.length ? `<div class="legs">${d.legs.map(l=>`<span class="${l.type==='dh'?'dhl':''}">${l.type==='dh'?'DH ':''}${esc(l.flight)}</span><span>${l.dep}</span><span>${t4(l.t1)}</span><span>${t4(l.t2)}</span><span>${l.arr}</span>`).join('')}</div>` : '';
      const cr = crewHtml(d, p.n);
      return `<details class="day vday" id="v-${d.date}"><summary><div class="dd"><span class="wd">${wd}</span><span class="n">${d.day}</span></div>
        <div class="what"><div class="r">${esc(d.route || d.label || k.n)}</div><div class="m"><span class="tag" style="--kc:var(${k.c})"><i></i>${k.n}</span>${times?`<span class="mono">${times}</span>`:''}${d.hotel?`<span>${t('nightIn',{st:d.hotel})}</span>`:''}</div></div></summary>
        ${legs||cr?`<div class="detail" style="padding-left:12px">${legs}${cr}</div>`:''}</details>`; }).join('')}</div>`;
  renderStrip({days}, {year:p.y, month:p.m}, 'vstrip', 'vlegend');
}
function viewerKey(){ return viewerData ? `${viewerData.y}-${String(viewerData.m).padStart(2,'0')}·${viewerData.n||'-'}·${viewerData.at}` : ''; }
function closeViewer(){ document.body.classList.remove('viewer'); $('viewer').hidden = true; $('viewer').innerHTML=''; viewerData=null;
  try{ history.replaceState(null,'',location.pathname); }catch(e){ location.hash=''; } render(); }
function checkHash(){ const h = location.hash; if(h.startsWith('#cfg=')){ cfgOpen(h.slice(5)); return; } if(h.startsWith('#s=')) openViewer(h.slice(3)); else if(document.body.classList.contains('viewer')) closeViewer(); }
addEventListener('hashchange', checkHash);

document.addEventListener('click', async e=>{
  const id = e.target.id;
  if(id==='shareBtn'){ const p=$('sharePanel'); if(p.hidden){ renderSharePanel(); p.hidden=false; p.scrollIntoView({block:'nearest'}); } else p.hidden=true; return; }
  if(id==='shareClose'){ $('sharePanel').hidden = true; return; }
  if(id==='sh-make'){ e.target.disabled = true; try{ await makeShare(); } finally { e.target.disabled = false; } return; }
  if(id==='sh-copy'){ const ta=$('sh-url'); try{ await navigator.clipboard.writeText(ta.value); $('sh-msg').textContent=t('share_copied'); }catch(err){ ta.focus(); ta.select(); } return; }
  if(id==='sh-send'){ try{ await navigator.share({title:'Payroster', url:$('sh-url').value}); }catch(err){} return; }
  if(id==='v-save'){ state.shared = state.shared||{}; state.shared[viewerKey()] = Object.assign({s:viewerStr}, {y:viewerData.y, m:viewerData.m, n:viewerData.n, at:viewerData.at}); save(); e.target.disabled=true; e.target.textContent=t('v_saved'); return; }
  if(id==='v-mine'){ closeViewer(); return; }
  const op = e.target.closest('[data-shopen]'); if(op){ const s=(state.shared||{})[op.dataset.shopen]; if(s) location.hash = '#s='+s.s; return; }
  const dl = e.target.closest('[data-shdel]'); if(dl){ delete state.shared[dl.dataset.shdel]; save(); renderSharedList(); return; }
});

// ---- updates (installed webapp) ----
async function latestVersion(){
  const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('http'); return (await r.json()).version;
}
async function checkUpdate(manual){
  if(!IS_PWA_BUILD) return;
  try{
    const v = await latestVersion();
    if(v && v !== APP_VERSION){
      const b=$('updBar'); b.hidden=false;
      b.innerHTML = `${t('upd_available')} <button class="btn" id="updNow" type="button" style="margin-left:6px">${t('upd_button')}</button>`;
    } else if(manual) $('updRes').textContent = t('upd_latest');
  }catch(e){ if(manual) $('updRes').textContent = t('upd_offline'); }
}
async function applyUpdate(){
  try{
    if('serviceWorker' in navigator){ const reg = await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }
    if(window.caches){ for(const k of await caches.keys()) await caches.delete(k); }
  }catch(e){}
  location.replace(location.pathname + '?v=' + Date.now());
}
if(IS_PWA_BUILD){
  $('verRow').hidden=false; $('verTxt').textContent = t('version',{v:APP_VERSION});
  document.addEventListener('click', e=>{ if(e.target.id==='updNow') applyUpdate(); if(e.target.id==='updCheck'){ $('updRes').textContent='…'; checkUpdate(true); } });
  checkUpdate(false);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkUpdate(false); });
}

// ---------- pull down to refresh ----------
// Pull the page down from the top: re-reads everything on screen and, in the installed app, looks for a
// new version (installs it if there is one, keeping the 3D map files).
(function(){
  const box = document.createElement('div'); box.id = 'ptr'; box.innerHTML = '<span class="ptr-ic">↓</span><span class="ptr-tx"></span>';
  document.body.appendChild(box);
  const TH = 70; let y0 = null, dy = 0, busy = false;
  const atTop = el => { if(window.scrollY > 0 || document.scrollingElement.scrollTop > 0) return false;
    for(let n = el; n && n !== document.body; n = n.parentElement){ if(n.scrollTop > 0) return false; if(n.closest && n.closest('.g3box,.mapbox,svg,input,textarea,select')) return false; } return true; };
  const show = (h, txt, cls) => { box.style.transform = `translateY(${Math.min(h, 110) - 60}px)`; box.style.opacity = Math.min(1, h / TH);
    box.querySelector('.ptr-tx').textContent = txt; box.className = cls || ''; box.querySelector('.ptr-ic').textContent = cls === 'done' ? '✓' : cls === 'busy' ? '↻' : '↓'; };
  const hide = () => { box.style.transition = 'transform .25s, opacity .25s'; show(0, '', ''); box.style.opacity = 0; setTimeout(() => box.style.transition = '', 260); };
  addEventListener('touchstart', e => { if(busy || e.touches.length !== 1 || !atTop(e.target)) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, {passive: true});
  addEventListener('touchmove', e => { if(y0 == null) return; dy = (e.touches[0].clientY - y0) * 0.55;
    if(dy <= 0){ show(0, '', ''); return; } show(dy, t(dy >= TH ? 'ptr_release' : 'ptr_pull'), dy >= TH ? 'ready' : ''); }, {passive: true});
  addEventListener('touchend', async () => { if(y0 == null) return; y0 = null;
    if(dy < TH){ hide(); return; }
    busy = true; show(TH + 10, t('ptr_busy'), 'busy');
    try{
      if(IS_PWA_BUILD && navigator.onLine !== false){
        let v = null; try{ v = await latestVersion(); }catch(e){}
        if(v && v !== APP_VERSION){
          show(TH + 10, t('ptr_upd'), 'busy');
          try{ const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if(reg) await reg.update();
            if(window.caches) for(const k of await caches.keys()) if(!/assets/.test(k)) await caches.delete(k); }catch(e){}
          location.replace(location.pathname + '?v=' + Date.now()); return;
        }
      }
      render(); if(typeof refreshTool === 'function') refreshTool(); if(typeof renderToday === 'function') renderToday();
      show(TH + 10, t('ptr_ok'), 'done');
    }catch(e){ console.warn(e); }
    setTimeout(() => { hide(); busy = false; }, 900);
  });
})();
